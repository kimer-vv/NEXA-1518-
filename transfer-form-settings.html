<!doctype html>
<!-- NEXA TRANSFER FORM SETTINGS BRIDGE V3.5.1
     Legacy Transfer Workspace "Edit Form" now opens the unified Transfer Form Studio.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050e">
<title>NEXA • Transfer Forms</title>
<style>
html,body{margin:0;min-height:100%;background:#03050e;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.card{width:min(480px,100%);padding:22px;border-radius:22px;border:1px solid rgba(89,228,255,.22);background:#081022}
small{color:#8fefff;font-weight:900;letter-spacing:.15em}.muted{color:#aab4d0;line-height:1.5}
</style>
</head>
<body>
<main><div class="card"><small>NEXA • TRANSFER</small><h1>Opening Form Studio…</h1><p class="muted">Loading the protected NEXA Template and your custom forms.</p></div></main>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const eventId=q.get('event')||'';
 if(!eventId){
   document.querySelector('.muted').textContent='Missing Transfer event.';
   return;
 }
 const u=new URL('transfer-form-custom.html',location.href);
 u.search='';
 u.searchParams.set('event',eventId);
 // No second password/login. The Form Studio uses the active global NEXA staff session.
 location.replace(u.pathname+u.search);
})();
</script>
</body>
</html>
