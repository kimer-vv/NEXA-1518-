let codes=[];async function loadCodes(){try{const r=await api('codes');codes=r.codes||[];for(const [id,want] of [['giftActiveList','active'],['giftExpiredList','expired']]){const el=$(id);el.replaceChildren();for(const x of codes){const s=String(x.status||'').toLowerCase(),expired=s==='expired'||(x.expires_at&&Date.parse(x.expires_at)<=Date.now()),cat=expired?'expired':['available','active'].includes(s)?'active':'other';if(cat!==want)continue;const d=document.createElement('div');d.className='code';d.innerHTML=`<b>${esc(x.code)}</b><small>${want==='active'?'● Active':'● Expired'}</small>`;el.append(d)}if(!el.childElementCount)el.innerHTML=`<p class="muted">No ${want} codes.</p>`}$('scanGiftCodes').hidden=data.role!=='owner';$('addGiftCode').hidden=data.role!=='owner'}catch(e){$('giftCodeStatus').textContent=e.message}}$('refreshGiftCodes').onclick=loadCodes;$('scanGiftCodes').onclick=async()=>{await api('scan_codes');await loadCodes()};$('addGiftCode').onclick=()=>modal('Add Gift Code',field('gc','Gift Code'),{onOk:async b=>{await api('manual_code',{code:clean(b.querySelector('#gc').value)});await loadCodes();return true}});for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{for(const x of document.querySelectorAll('[data-tab]'))x.setAttribute('aria-selected',String(x===b));for(const p of document.querySelectorAll('[data-panel]'))p.classList.toggle('hidden',p.dataset.panel!==b.dataset.tab);if(b.dataset.tab==='codes')loadCodes()};function auth(reg){$('loginPane').classList.toggle('hidden',reg);$('registerPane').classList.toggle('hidden',!reg);$('loginTab').classList.toggle('active',!reg);$('registerTab').classList.toggle('active',reg)}$('loginTab').onclick=()=>auth(false);$('registerTab').onclick=()=>auth(true);$('forgotPass').onclick=()=>$('recoveryPanel').classList.remove('hidden');$('cancelRecovery').onclick=()=>$('recoveryPanel').classList.add('hidden');$('recoverBtn').onclick=async()=>{if($('recoverPassword').value!==$('recoverConfirm').value)return $('recoveryStatus').textContent='Passwords do not match.';const d=await rpc('transfer_staff_reset_password',{p_identifier:clean($('recoverIdentifier').value),p_code:clean($('recoverCode').value),p_new_password:$('recoverPassword').value});$('recoveryStatus').textContent=d?.ok?'Password changed.':d?.error||'Invalid recovery code.'};$('signin').onclick=async()=>{try{const state=Number(clean($('loginState').value)),gameId=clean($('identifier').value);if(!Number.isInteger(state)||state<1)throw Error('Enter your State / Server.');if(!/^\d{4,24}$/.test(gameId))throw Error('Enter a valid Game ID.');const d=await rpc('nexa_staff_login_v2',{p_state_number:state,p_game_id:gameId,p_password:$('password').value,p_remember:$('rememberLogin').checked});if(!d?.ok)throw Error(d?.error||'Login failed');store(d.token,$('rememberLogin').checked,state);await load()}catch(e){message(e.message)}};$('registerBtn').onclick=async()=>{try{const state=Number(clean($('regState').value)),gameId=clean($('regGameId').value);if(!Number.isInteger(state)||state<1)throw Error('Enter your State / Server.');if(!/^\d{4,24}$/.test(gameId))throw Error('Enter a valid Game ID.');if($('regPassword').value!==$('regConfirm').value)throw Error('Passwords do not match.');const d=await rpc('nexa_staff_register_module_v2',{p_module:'gift',p_state_number:state,p_game_name:clean($('regGameName').value),p_game_id:gameId,p_password:$('regPassword').value,p_remember:$('rememberRegister').checked});if(!d?.ok)throw Error(d?.error||'Registration failed');store(d.token,$('rememberRegister').checked,state);await load()}catch(e){message(e.message)}};$('logout').onclick=async()=>{try{if(token)await rpc('transfer_staff_logout',{p_token:token})}catch{}localStorage.removeItem('nexa_transfer_staff_token');sessionStorage.removeItem('nexa_transfer_staff_token');localStorage.removeItem('nexa_active_state');sessionStorage.removeItem('nexa_active_state');location.href='staff-workspaces.html'};$('backWos').onclick=()=>location.href='wos-utilities.html';async function start(){
