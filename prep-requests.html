<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA • Prep Requests</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lang.js"></script>
<script src="ui-i18n-final.js"></script>
</head>
<body>
<div class="nebula-bg" aria-hidden="true"></div>
<div class="starfield" aria-hidden="true"></div>
<header class="topbar">
  <div class="shell nav">
    <a class="logo" href="index.html"><span class="star">✦</span><span>NEXA<small>STATE 1518</small></span></a>
    <a class="back" href="index.html">← Home</a>
  </div>
</header>

<main class="shell event-page">
  <div style="margin-top:10px">
    <span class="badge">ADMIN</span>
    <h1>Prep Requests</h1>
    <div id="requests-meta" class="muted">Loading…</div>
  </div>

  <section class="glass schedule-tools">
    <div class="admin-section-head">
      <h3>Schedule Tools</h3>
      <p>Filter by alliance/day, copy a ready-to-paste schedule, or export requests.</p>
    </div>
    <div class="schedule-tool-grid">
      <select id="copy-alliance-filter"><option value="">All Alliances</option></select>
      <select id="copy-day-filter">
        <option value="">All Days</option>
        <option value="construction">Monday — Construction / VP</option>
        <option value="research">Tuesday — Research / VP</option>
        <option value="training">Thursday — Training / MOE</option>
      </select>
      <button id="copy-alliance-schedule" class="btn" type="button">Copy Alliance Schedule</button>
      <button id="copy-day-schedule" class="btn" type="button">Copy This Day</button>
      <button id="copy-full-schedule" class="btn" type="button">Copy Full Schedule</button>
      <button id="export-requests-csv" class="btn secondary" type="button">Export CSV</button>
    </div>
  </section>

  <section class="glass scheduler-compact-tools">
      <div class="scheduler-stats">
        <div><b id="stat-total">0</b><span>Requests</span></div>
        <div><b id="stat-scheduled">0</b><span>Scheduled</span></div>
        <div><b id="stat-unscheduled">0</b><span>Unscheduled</span></div>
      </div>
      <div class="scheduler-actions">
        <label class="toggle-line"><input id="unscheduled-only" type="checkbox"> Unscheduled only</label>
        <button id="health-check" class="btn secondary" type="button">Schedule Health Check</button>
      </div>
      <div id="health-result" class="health-result hidden"></div>
    </section>

    <div class="tabs request-tabs">
    <button class="tab active" data-request-day="construction"><b>MON</b><small>Construction</small></button>
    <button class="tab" data-request-day="research"><b>TUE</b><small>Research</small></button>
    <button class="tab" data-request-day="training"><b>THU</b><small>Training</small></button>
  </div>

  <div id="requests-message" class="form-message"></div>
  <section id="requests-list" class="admin-list"></section>
</main>

<script>
const sb = window.supabase.createClient("https://dfxcxboxrkfmrnsgpyin.supabase.co", "sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-");
let liveEvent=null;
let activeDay='construction';
let requests=[];
let appointments=[];

const troopRank={new_t8:8,new_t9:9,new_t10:10,new_t11:11,new_t12:12,t8_to_t9:9,t9_to_t10:10,t10_to_t11:11,t11_to_t12:12};

async function ensureAdmin(){
  const {data}=await sb.rpc('is_scheduler_or_admin');
  if(data!==true){ location.href='index.html'; return false; }
  return true;
}
function eventDate(offset){
  const d=new Date(liveEvent.prep_monday+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+offset); return d;
}
function dayOffset(day){ return day==='construction'?0:day==='research'?1:3; }
function ministry(day){ return day==='training'?'MOE (Minister of Education)':'VP (Vice President)'; }
function utcStampForSlot(day,hm){
  const d=eventDate(dayOffset(day));
  const [h,m]=hm.split(':').map(Number);
  d.setUTCHours(h,m,0,0); return d.toISOString();
}
function availableSlots(day){
  const used=new Map(appointments.filter(a=>a.day_type===day).map(a=>[new Date(a.appointment_time).toISOString().slice(11,16),a]));
  const out=[];
  for(let i=0;i<48;i++){
    const h=String(Math.floor(i/2)).padStart(2,'0');
    const m=i%2?'30':'00';
    const hm=`${h}:${m}`;
    out.push({hm,used:used.get(hm)});
  }
  return out;
}
function trainingScore(r){
  return (troopRank[r.training_selection]||0)*1e9 + Number(r.training_speedup_minutes||0);
}
function sortRows(rows){
  if(activeDay==='construction') return rows.sort((a,b)=>Number(b.estimated_construction_points)-Number(a.estimated_construction_points));
  if(activeDay==='research') return rows.sort((a,b)=>Number(b.estimated_research_points)-Number(a.estimated_research_points));
  return rows.sort((a,b)=>trainingScore(b)-trainingScore(a));
}
function fmt(n){ return Number(n||0).toLocaleString(); }
function rowRequested(r){
  return activeDay==='construction'?r.construction_requested:activeDay==='research'?r.research_requested:r.training_requested;
}
function prefFrame(r){ return r[activeDay+'_time_frame']||'—'; }
function prefTime(r){ return (r[activeDay+'_specific_time']||'').slice(0,5)||'—'; }
function existingAppt(r){
  return appointments.find(a=>a.prep_request_id===r.id && a.day_type===activeDay);
}

function resourceLines(r){
  if(activeDay==='construction') return `
    <small>Speedups: ${fmt(r.construction_speedup_minutes)} min • FC: ${fmt(r.construction_fire_crystals)} • Refined FC: ${fmt(r.construction_refined_fire_crystals)}</small>
    <strong>Estimated Points: ${fmt(r.estimated_construction_points)}</strong>`;
  if(activeDay==='research') return `
    <small>Speedups: ${fmt(r.research_speedup_minutes)} min • Shards: ${fmt(r.research_fire_crystal_shards)}</small>
    <strong>Estimated Points: ${fmt(r.estimated_research_points)}</strong>`;
  return `
    <small>Troops: ${r.training_selection||'—'} • Speedups: ${fmt(r.training_speedup_minutes)} min</small>
    <strong>Training Priority: ${troopRank[r.training_selection]||0} / ${fmt(r.training_speedup_minutes)} min</strong>`;
}
function render(){
  const list=document.getElementById('requests-list');
  const dayRequests=requests.filter(rowRequested);
  const scheduledCount=dayRequests.filter(x=>!!existingAppt(x)).length;
  document.getElementById('stat-total').textContent=dayRequests.length;
  document.getElementById('stat-scheduled').textContent=scheduledCount;
  document.getElementById('stat-unscheduled').textContent=dayRequests.length-scheduledCount;
  let rows=sortRows(requests.filter(rowRequested));
  if(document.getElementById('unscheduled-only')?.checked){
    rows=rows.filter(x=>!existingAppt(x));
  }
  if(!rows.length){ list.innerHTML='<div class="empty-state">No requests for this day.</div>'; return; }

  const slots=availableSlots(activeDay);
  list.innerHTML=rows.map((r,i)=>{
    const a=r.player_accounts||{};
    const alliance=a.alliances?.tag||a.custom_alliance_tag||'Not Listed';
    const existing=existingAppt(r);

    const options=slots.map(s=>`<option value="${s.hm}" ${s.used?'disabled':''} ${existing && new Date(existing.appointment_time).toISOString().slice(11,16)===s.hm?'selected':''}>
      ${s.hm} UTC${s.used?' — '+(s.used.player_accounts?.in_game_name||'Occupied'):''}
    </option>`).join('');

    return `<article class="request-card">
      <div class="request-rank">#${i+1}</div>
      <div class="request-main">
        <div class="request-title"><b>${a.in_game_name||'Player'}</b><span>${alliance} • ID ${a.player_id||'—'}</span></div>
        ${resourceLines(r)}
        <div class="request-pref">Preferred: <b>${prefFrame(r)}</b> • Specific: <b>${prefTime(r)} UTC</b></div>
        ${r.upgrading_t12?`<div class="t12-note">T12 • Refined FC ${fmt(r.t12_refined_fire_crystals)} • Shards ${fmt(r.t12_fire_crystal_shards)}</div>`:''}${r.scheduler_note?`<div class="scheduler-note"><b>Note:</b> ${r.scheduler_note}</div>`:''}
      </div>
      <div class="assign-box">
        <label>${ministry(activeDay)}
          <select data-slot-request="${r.id}">
            <option value="">Assign time</option>
            ${options}
          </select>
        </label>
        <button class="btn" data-assign-request="${r.id}" type="button">${existing?'Update Appointment':'Assign Appointment'}</button>
        ${!existing?`<button class="btn secondary" data-waitlist-request="${r.id}" type="button">Waitlist</button>`:''}
        ${existing?`<small>Scheduled: ${new Date(existing.appointment_time).toISOString().slice(11,16)} UTC</small>`:''}
      </div>
    </article>`;
  }).join('');
}
async function load(){
  if(!(await ensureAdmin())) return;
  await sb.rpc('refresh_auto_ended_events');
  const {data:event}=await sb.from('svs_events').select('*').eq('status','live').order('prep_monday',{ascending:false}).limit(1).maybeSingle();
  liveEvent=event;
  if(!event){ document.getElementById('requests-message').textContent='No live SvS event.'; return; }
  document.getElementById('requests-meta').textContent=`SvS against ${event.opponent_state} • Prep Monday ${event.prep_monday} UTC`;

  const {data:req,error}=await sb.from('prep_requests')
    .select('*,player_accounts(id,in_game_name,player_id,custom_alliance_tag,alliances(tag))')
    .eq('event_id',event.id);
  if(error){document.getElementById('requests-message').textContent=error.message;return;}
  requests=req||[];

  const {data:apps,error:appErr}=await sb.from('ministry_appointments')
    .select('*,player_accounts(in_game_name,player_id)')
    .eq('event_id',event.id);
  if(appErr){document.getElementById('requests-message').textContent=appErr.message;return;}
  appointments=apps||[];
  const allianceTags=[...new Set(requests.map(r=>r.player_accounts?.alliances?.tag||r.player_accounts?.custom_alliance_tag).filter(Boolean))].sort();
  document.getElementById('copy-alliance-filter').innerHTML='<option value="">All Alliances</option>'+allianceTags.map(x=>`<option value="${x}">${x}</option>`).join('');
  render();
}
document.querySelectorAll('[data-request-day]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('[data-request-day]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); activeDay=btn.dataset.requestDay; render();
}));
document.getElementById('requests-list').addEventListener('click',async e=>{
  const waitId=e.target.dataset.waitlistRequest;
  if(waitId){
    const {error}=await sb.from('prep_requests').update({status:'waitlisted'}).eq('id',waitId);
    document.getElementById('requests-message').textContent=error?error.message:'Moved to waitlist.';
    if(!error) await load();
    return;
  }
  const id=e.target.dataset.assignRequest; if(!id)return;
  const sel=document.querySelector(`[data-slot-request="${id}"]`);
  const hm=sel.value; if(!hm){alert('Select a UTC time first.');return;}

  const existing=appointments.find(a=>a.prep_request_id===id && a.day_type===activeDay);
  let error;
  if(existing){
    ({error}=await sb.from('ministry_appointments').update({appointment_time:utcStampForSlot(activeDay,hm)}).eq('id',existing.id));
  } else {
    ({error}=await sb.rpc('assign_ministry_appointment',{
      target_request_id:id,
      target_day_type:activeDay,
      target_appointment_time:utcStampForSlot(activeDay,hm)
    }));
  }
  document.getElementById('requests-message').textContent=error?error.message:'Appointment saved.';
  if(!error){
    await sb.rpc('write_audit',{
      action_name:'ministry_appointment_saved',
      action_details:{request_id:id,day:activeDay,time:hm}
    });
    await load();
  }
});

function appointmentRows(filterAlliance='',filterDay=''){
  return appointments
    .filter(a=>!filterDay || a.day_type===filterDay)
    .filter(a=>{
      const r=requests.find(x=>x.id===a.prep_request_id);
      const tag=r?.player_accounts?.alliances?.tag||r?.player_accounts?.custom_alliance_tag||'Not Listed';
      return !filterAlliance || tag===filterAlliance;
    })
    .map(a=>{
      const r=requests.find(x=>x.id===a.prep_request_id);
      const p=r?.player_accounts||{};
      return {
        day:a.day_type,
        time:new Date(a.appointment_time).toISOString().slice(11,16),
        name:p.in_game_name||'Player',
        alliance:p.alliances?.tag||p.custom_alliance_tag||'Not Listed'
      };
    })
    .sort((a,b)=>{
      const order={construction:0,research:1,training:2};
      return order[a.day]-order[b.day] || a.time.localeCompare(b.time);
    });
}
function scheduleText(rows,title='SvS Ministry Schedule'){
  const labels={
    construction:'Monday • Construction • VP (Vice President)',
    research:'Tuesday • Research • VP (Vice President)',
    training:'Thursday • Training • MOE (Minister of Education)'
  };
  let out=`${title}\n`;
  for(const day of ['construction','research','training']){
    const d=rows.filter(x=>x.day===day);
    if(!d.length) continue;
    out+=`\n${labels[day]}\n`;
    d.forEach(x=>out+=`${x.time} UTC — ${x.name}\n`);
  }
  return out.trim();
}
async function copyText(text){
  await navigator.clipboard.writeText(text);
  document.getElementById('requests-message').textContent='Schedule copied.';
}
document.getElementById('copy-alliance-schedule').addEventListener('click',async()=>{
  const a=document.getElementById('copy-alliance-filter').value;
  const rows=appointmentRows(a,'');
  await copyText(scheduleText(rows,a?`${a} — SvS Ministry Schedule`:'SvS Ministry Schedule'));
});
document.getElementById('copy-day-schedule').addEventListener('click',async()=>{
  const a=document.getElementById('copy-alliance-filter').value;
  const d=document.getElementById('copy-day-filter').value || activeDay;
  const rows=appointmentRows(a,d);
  await copyText(scheduleText(rows,a?`${a} — SvS Ministry Schedule`:'SvS Ministry Schedule'));
});
document.getElementById('copy-full-schedule').addEventListener('click',async()=>{
  await copyText(scheduleText(appointmentRows('','')));
});
document.getElementById('export-requests-csv').addEventListener('click',()=>{
  const head=['IGN','Player ID','Alliance','Construction Points','Research Points','Training Selection','Training Speedup Minutes','Construction Window','Research Window','Training Window','Scheduler Note','Status'];
  const rows=requests.map(r=>{
    const p=r.player_accounts||{};
    const tag=p.alliances?.tag||p.custom_alliance_tag||'Not Listed';
    return [
      p.in_game_name||'',p.player_id||'',tag,
      r.estimated_construction_points||0,r.estimated_research_points||0,
      r.training_selection||'',r.training_speedup_minutes||0,
      r.construction_time_frame||'',r.research_time_frame||'',r.training_time_frame||'',
      r.scheduler_note||'',r.status||''
    ];
  });
  const esc=v=>`"${String(v??'').replaceAll('"','""')}"`;
  const csv=[head,...rows].map(row=>row.map(esc).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='nexa-prep-requests.csv'; a.click();
  URL.revokeObjectURL(url);
});


document.getElementById('unscheduled-only').addEventListener('change',render);

document.getElementById('health-check').addEventListener('click',()=>{
  const result=document.getElementById('health-result');
  const issues=[];

  // duplicate exact slots
  const seen=new Map();
  appointments.forEach(a=>{
    const key=`${a.day_type}|${new Date(a.appointment_time).toISOString().slice(11,16)}`;
    if(seen.has(key)) issues.push(`Duplicate slot: ${key.replace('|',' • ')}`);
    else seen.set(key,a.id);
  });

  // appointments for requests that did not request that day / outside preferred frame
  appointments.forEach(a=>{
    const req=requests.find(r=>r.id===a.prep_request_id);
    if(!req) return;
    const requested=req[`${a.day_type}_requested`];
    if(!requested) issues.push(`${req.player_accounts?.in_game_name||'Player'} is scheduled for ${a.day_type} but did not request it.`);

    const frame=req[`${a.day_type}_time_frame`];
    if(frame){
      const m=frame.match(/(\d{2}):(\d{2})[–-](\d{2}):(\d{2})/);
      if(m){
        const start=Number(m[1])*60+Number(m[2]);
        const end=Number(m[3])*60+Number(m[4]);
        const d=new Date(a.appointment_time);
        const mins=d.getUTCHours()*60+d.getUTCMinutes();
        if(mins<start || mins>=end){
          issues.push(`${req.player_accounts?.in_game_name||'Player'} is outside preferred frame (${frame}).`);
        }
      }
    }
  });

  const totalReq=requests.filter(rowRequested).length;
  const scheduled=requests.filter(rowRequested).filter(x=>!!existingAppt(x)).length;
  const unscheduled=totalReq-scheduled;

  result.classList.remove('hidden');
  if(!issues.length){
    result.innerHTML=`<b>Everything looks good ✓</b><span>${scheduled} scheduled • ${unscheduled} unscheduled/waitlisted for this day.</span>`;
  } else {
    result.innerHTML=`<b>${issues.length} issue${issues.length===1?'':'s'} found</b><span>${issues.join('<br>')}</span>`;
  }
});

load();
</script>
</body>
</html>
