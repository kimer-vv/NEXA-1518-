<!doctype html>
<!-- NEXA STAFF WORKSPACES V2.1 — GLOBAL STATE + GAME ID LOGIN + SHARED MODULE ACCESS -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA • Staff Workspaces</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#20174a,#090d20 34%,#050713 70%);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(820px,100%);margin:auto;padding:32px 16px 70px}.k{font-size:10px;letter-spacing:.17em;color:#9fb0dd;font-weight:950}.hero h1{font-size:clamp(2.2rem,8vw,4rem);margin:7px 0}.muted{color:#aab4d0}.card{border:1px solid rgba(150,170,255,.18);background:rgba(12,17,37,.84);border-radius:22px;padding:17px}.login{width:min(430px,100%);margin:12vh auto 0}.login label{display:grid;gap:6px;margin:12px 0;font-weight:800}.input{width:100%;min-height:45px;border:1px solid rgba(150,170,255,.2);border-radius:13px;background:#0b1024;color:#fff;padding:10px 12px}.btn{width:100%;min-height:44px;border:1px solid rgba(111,134,255,.4);border-radius:13px;background:linear-gradient(135deg,rgba(91,65,219,.65),rgba(22,129,168,.45));color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.module{cursor:pointer;text-decoration:none;color:#fff}.module h2{margin:4px 0 6px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(122,96,255,.24);border:1px solid rgba(143,122,255,.33);font-size:11px;font-weight:850}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{width:auto;padding:8px 12px;background:#10162c}@media(max-width:560px){.grid{grid-template-columns:1fr}}
.hidden{display:none!important}.status{min-height:20px;margin-top:9px;color:#ff9fbd}
</style></head><body>
<main class="shell">
<section id="login" class="card login">
<div class="k">NEXA STAFF</div><h1>Workspace Login</h1><p class="muted">One login for every staff workspace you are authorized to use.</p>
<label>State / Server<input id="state" class="input" inputmode="numeric" autocomplete="off" placeholder="e.g. 1518"></label>
<label>Game ID<input id="id" class="input" inputmode="numeric" autocomplete="username" placeholder="Game ID"></label>
<label>Password<input id="pw" class="input" type="password" autocomplete="current-password"></label>
<label style="display:flex;grid-template-columns:auto 1fr;align-items:center"><input id="remember" type="checkbox" checked> Remember me</label>
<button id="go" class="btn">Sign In</button><div id="msg" class="status"></div>
</section>
<section id="app" class="hidden">
<div class="top"><div class="hero"><div class="k">NEXA STAFF</div><h1>Choose Workspace</h1><p id="who" class="muted"></p></div><button id="out" class="btn logout">Log Out</button></div>
<div id="grid" class="grid"></div>
</section>
</main>
<script>
(()=>{'use strict';
const sb=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-'),$=x=>document.getElementById(x);
let token=localStorage.getItem('nexa_transfer_staff_token')||sessionStorage.getItem('nexa_transfer_staff_token')||'';
let activeState=Number(localStorage.getItem('nexa_active_state')||sessionStorage.getItem('nexa_active_state')||0);
const rpc=async(fn,args)=>{const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data};
function save(t,remember,state){localStorage.removeItem('nexa_transfer_staff_token');sessionStorage.removeItem('nexa_transfer_staff_token');localStorage.removeItem('nexa_active_state');sessionStorage.removeItem('nexa_active_state');const s=remember?localStorage:sessionStorage;s.setItem('nexa_transfer_staff_token',t);s.setItem('nexa_active_state',String(state));token=t;activeState=state}
function clearSession(){localStorage.removeItem('nexa_transfer_staff_token');sessionStorage.removeItem('nexa_transfer_staff_token');localStorage.removeItem('nexa_active_state');sessionStorage.removeItem('nexa_active_state');token='';activeState=0}
function dedupeModules(rows){const out=[],seen=new Set();for(const m of rows||[]){if(!m||!m.url)continue;const key=`${m.module||''}|${m.workspace_id||''}|${m.url}`;if(seen.has(key))continue;seen.add(key);out.push(m)}return out}
async function workspaceModel(base={}){
 const [session,access]=await Promise.all([
  rpc('transfer_staff_session',{p_token:token}),
  rpc('nexa_staff_workspace_access_v1',{p_token:token})
 ]);
 if(!session?.ok)throw new Error(session?.error||'Session expired.');
 if(!access?.ok)throw new Error(access?.error||'Unable to load workspace access.');
 const stateful=(session.modules||[]).filter(m=>!activeState||!m.state_number||Number(m.state_number)===Number(activeState));
 const shared=(access.modules||[]).filter(m=>m.module==='gift');
 return {...base,...session,...access,game_name:access.game_name||session.game_name||base.game_name,game_id:access.game_id||session.game_id||base.game_id,modules:dedupeModules([...stateful,...shared])};
}
function moduleMeta(m){if(m.module==='gift')return m.global_owner?'Global Owner':'WOS Access';return m.access_level==='admin'?'Administrative Access':'Regular Access'}
function render(s){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${s.game_name||s.game_id||'Staff'} • State ${activeState||s.state_number||'—'}`;const mods=(s.modules||[]).filter(m=>m.module==='gift'||!activeState||!m.state_number||Number(m.state_number)===Number(activeState));$('grid').innerHTML=mods.length?mods.map(m=>`<a class="card module" href="${m.url}"><div class="k">${m.module==='transfer'?'TRANSFER':m.module==='ministry'?'MINISTRY':m.module==='gift'?'WOS UTILITIES':String(m.module||'WORKSPACE').toUpperCase()}</div><h2>${m.label||'Workspace'}</h2><p class="muted">State ${m.state_number||activeState||'—'} • ${m.module==='gift'?(s.global_owner?'Global Owner':'WOS Access'):moduleMeta(m)}</p><span class="badge">Open Workspace</span></a>`).join(''):'<div class="card muted">No active staff workspaces for this State.</div>'}
async function start(){if(!token)return;try{const s=await workspaceModel();if(s?.ok!==false)render(s)}catch{clearSession()}}
$('go').onclick=async()=>{try{$('msg').textContent='Signing in…';const state=Number($('state').value.trim()),gameId=$('id').value.trim();if(!Number.isInteger(state)||state<1)throw new Error('Enter your State / Server.');if(!/^\d{4,24}$/.test(gameId))throw new Error('Enter a valid Game ID.');const d=await rpc('nexa_staff_login_v2',{p_state_number:state,p_game_id:gameId,p_password:$('pw').value,p_remember:$('remember').checked});if(!d?.ok)throw new Error(d?.error||'Unable to sign in');save(d.token,$('remember').checked,state);const model=await workspaceModel(d);render(model);$('msg').textContent=''}catch(e){$('msg').textContent=e.message||String(e)}};
$('out').onclick=async()=>{try{await rpc('transfer_staff_logout',{p_token:token})}catch{}clearSession();location.reload()};start();
})();
</script></body></html>
