<style>
:root{--a:#48ddff;--m:#aeb7d1;--violet:#9b78ff;--gold:#ffc75b;--green:#67dfb1;--red:#ff7289}
*{box-sizing:border-box}
body{margin:0;background:#02030b;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
main{width:min(760px,100%);margin:auto;padding:22px 16px 90px}
.top{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px}
.round{width:46px;height:46px;border-radius:50%;border:1px solid rgba(72,221,255,.35);background:#081329;color:#bff6ff;display:grid;place-items:center;text-decoration:none;font-size:26px}
.title{text-align:center}
.title small{font-size:9px;letter-spacing:.16em;color:#9aa8c6;font-weight:900}
.title h1{margin:4px 0;font-size:34px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}
.tabs button,.btn{border:1px solid rgba(115,135,210,.32);background:#080d22;color:#c6d0e8;border-radius:999px;min-height:42px;padding:0 14px;font-weight:900}
.tabs button.active,.btn.primary{border-color:#8f73ff;background:linear-gradient(135deg,#4d3392,#245d88);color:#fff}
.note{color:#aeb7d1;font-size:12px;line-height:1.5}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:12px 0}
.status{font-size:12px;color:#8ff3ff;min-height:18px}
.grid{display:grid;gap:12px}
.card{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(145deg,rgba(12,18,40,.96),rgba(5,8,20,.96));padding:13px}
.card.attack{border-color:rgba(255,105,130,.35)}
.card.defense{border-color:rgba(103,223,177,.35)}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:9px;font-weight:950;letter-spacing:.08em;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 7px}
.badge.suggested{color:#ffe0a2;border-color:rgba(255,199,91,.38)}
.badge.approved{color:#a5f3d4;border-color:rgba(103,223,177,.38)}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:12px auto 8px}
.hero{text-align:center;min-width:0}
.hero img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#101522}
.hero b{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ratio{text-align:center;font-size:22px;font-weight:950}
.muted{color:#96a3c3}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;line-height:1.48}
.card.open .detail{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:5px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-weight:900;font-size:10px}
.rarity-mythic,.rarity-gold,.rarity-legendary{color:#ffd260}
.rarity-epic,.rarity-purple{color:#c78bff}
.rarity-rare,.rarity-blue{color:#68c9ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions .btn{min-height:38px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;padding:14px;z-index:50}
.modal.open{display:grid}
.modal-card{width:min(560px,100%);max-height:88dvh;overflow:auto;background:#071022;border:1px solid rgba(72,221,255,.28);border-radius:20px;padding:15px}
.modal-card h3{margin:0 0 10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formgrid .full{grid-column:1/-1}
label{display:grid;gap:5px;color:#aeb7d1;font-size:11px;font-weight:850}
input,select,textarea{width:100%;min-height:42px;border-radius:11px;border:1px solid rgba(122,142,203,.28);background:#050a19;color:#fff;padding:9px;font:inherit}
textarea{min-height:76px;resize:vertical}
.hero-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.empty{border:1px dashed rgba(255,255,255,.14);border-radius:16px;padding:18px;text-align:center;color:#aeb7d1;font-size:12px;line-height:1.55}
@media(max-width:580px){
  .formgrid{grid-template-columns:1fr}
  .formgrid .full{grid-column:auto}
  .hero img{width:56px;height:56px}
}

.hero-source-select{display:none!important}
.formation-hero-picker{width:100%;min-height:104px;border:1px solid rgba(122,142,203,.28);border-radius:13px;background:#050a19;color:#fff;padding:8px;display:grid;justify-items:center;align-content:center;gap:4px;text-align:center}
.formation-hero-picker img{width:58px;height:58px;border-radius:11px;object-fit:cover;border:1px solid rgba(255,255,255,.14)}
.formation-hero-picker b{font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.formation-hero-picker small{font-size:8px;color:#96a3c3}
.formation-hero-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.82);padding:14px}.formation-hero-overlay-card{width:min(620px,100%);max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(72,221,255,.28);border-radius:20px;background:#071022;padding:13px}
.formation-hero-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.formation-hero-choice{border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(255,255,255,.035);color:#fff;padding:8px;display:grid;justify-items:center;gap:4px}.formation-hero-choice.selected{border-color:rgba(155,120,255,.8);box-shadow:0 0 16px rgba(139,89,255,.18)}.formation-hero-choice img{width:58px;height:58px;border-radius:11px;object-fit:cover}.formation-hero-choice b{font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.formation-hero-choice small{font-size:8px;color:#96a3c3;text-align:center}
@media(max-width:580px){.formation-hero-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formation-hero-picker{min-height:94px}.formation-hero-picker img{width:52px;height:52px}}

</style>
</head>

<body>
<main>
  <div class="top">
    <a class="round" href="svs-operations.html">‹</a>
    <div class="title">
      <small>BATTLE OPERATIONS • SVS</small>
      <h1>Formations</h1>
    </div>
    <a class="round" href="index.html">×</a>
  </div>

  <div class="tabs">
    <button class="active" type="button" data-tab="approved">Approved</button>
    <button type="button" data-tab="suggested">Suggested</button>
  </div>

  <div class="bar">
    <div class="note">Approved formations are the only ones Strategy Board may use. Suggested formations stay here until you approve them.</div>
    <button id="add" type="button" class="btn primary">+ Add Formation</button>
  </div>

  <div id="status" class="status"></div>
  <div id="list" class="grid"></div>
</main>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="bar">
      <h3>Add Formation</h3>
      <button id="close" type="button" class="btn">Close</button>
    </div>

    <div class="formgrid">
      <label>Generation<input id="generation" type="number" min="1"></label>

      <label>Type
        <select id="mode">
          <option value="attack">Attack</option>
          <option value="defense">Defense</option>
        </select>
      </label>

      <label class="full">Name
        <input id="name" placeholder="e.g. Main Attack">
      </label>

      <label>Infantry %
        <input id="r0" type="number" min="0" max="100" value="50">
      </label>

      <label>Lancer %
        <input id="r1" type="number" min="0" max="100" value="20">
      </label>

      <label>Marksman %
        <input id="r2" type="number" min="0" max="100" value="30">
      </label>

      <div class="full">
        <div class="note">Rally Lead heroes</div>
        <div class="hero-picks">
          <div><select id="h0" class="hero-source-select" aria-hidden="true"></select><button class="formation-hero-picker" data-formation-hero="h0" data-troop="infantry" type="button"></button></div>
          <div><select id="h1" class="hero-source-select" aria-hidden="true"></select><button class="formation-hero-picker" data-formation-hero="h1" data-troop="lancer" type="button"></button></div>
          <div><select id="h2" class="hero-source-select" aria-hidden="true"></select><button class="formation-hero-picker" data-formation-hero="h2" data-troop="marksman" type="button"></button></div>
        </div>
      </div>

      <label class="full">Top 4 Joiners <span class="muted">stack order • comma separated</span>
        <input id="joinfirst" placeholder="Norah, Norah, Hendrik, Patrick">
      </label>

      <label class="full">Backup Joiner Pool <span class="muted">comma separated</span>
        <input id="backup" placeholder="Hendrik, Gatot, Mia">
      </label>

      <label class="full">Top 4 Synergy & Stack
        <textarea id="top4synergy" placeholder="Explain why these four joiner effects complement each other, how they fit the exact Rally Lead trio + troop ratio, what stacks, and what the combined package adds to this formation."></textarea>
      </label>

      <label class="full">Why this formation is good
        <textarea id="why"></textarea>
      </label>

      <label class="full">Risk / limitations
        <textarea id="risk"></textarea>
      </label>
    </div>

    <div class="actions">
      <button id="save" type="button" class="btn primary">Add Approved Formation</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL='https://dfxcxboxrkfmrnsgpyin.supabase.co';
  const SUPABASE_KEY='sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-';

  let sb=null;
  let rows=[];
  let heroes=[];
  let tab='approved';
  let activeGeneration=1;
  let saveBusy=false;

  const $=s=>document.querySelector(s);
  const status=t=>{const el=$('#status');if(el)el.textContent=t||''};
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const norm=s=>String(s||'').trim().toLowerCase();

  function rarity(n){
    const h=heroes.find(x=>norm(x.name)===norm(n));
    return 'rarity-'+String(h?.rarity||'').toLowerCase();
  }

  function heroCard(n){
    const h=heroes.find(x=>norm(x.name)===norm(n))||{};
    return `<div class="hero">${h.image_url?`<img src="${esc(h.image_url)}" alt="${esc(n)}">`:'<img alt="">'}<b class="${rarity(n)}">${esc(n)}</b></div>`;
  }

  function chips(arr){
    return `<div class="chips">${(arr||[]).map(n=>`<span class="chip ${rarity(n)}">${esc(n)}</span>`).join('')}</div>`;
  }

  function signature(r){
    const mode=norm(r?.mode);
    const leaders=(r?.leader_heroes||[]).map(norm).join('|');
    const ratio=(r?.primary_ratio||[]).map(Number).join('/');
    return `${mode}::${leaders}::${ratio}`;
  }

  function resolveGeneration(generationRows){
    const now=Date.now();
    const eligible=(generationRows||[]).filter(r=>{
      const g=Number(r?.generation||0);
      if(!g)return false;
      if(r?.is_visible===true)return true;
      if(r?.unlock_at){
        const t=new Date(r.unlock_at).getTime();
        return Number.isFinite(t)&&t<=now;
      }
      return false;
    });
    if(eligible.length)return Math.max(1,...eligible.map(r=>Number(r.generation||0)));
    const heroGens=heroes.map(h=>Number(h.generation||0)).filter(Boolean);
    if(heroGens.length)return Math.max(1,...heroGens);
    const ruleGens=rows.map(r=>Number(r.generation||0)).filter(Boolean);
    return ruleGens.length?Math.max(1,...ruleGens):1;
  }

  function currentRows(){
    return rows.filter(r=>Number(r.generation)===activeGeneration);
  }

  function researchRows(){
    return currentRows().filter(r=>
      r.approval_status==='corroborated' ||
      (r.approval_status==='candidate' && Number(r.confidence||0)>=.60 && Number(r.independent_source_count||0)>=2 && Number(r.source_count||0)>=2)
    );
  }

  function approvedRows(){
    return currentRows().filter(r=>r.approval_status==='approved'&&r.is_active!==false);
  }

  function matchingResearch(approved){
    return researchRows()
      .filter(r=>signature(r)===signature(approved))
      .sort((a,b)=>{
        const ac=Number(a.confidence||0),bc=Number(b.confidence||0);
        if(ac!==bc)return bc-ac;
        return new Date(b.last_researched_at||0)-new Date(a.last_researched_at||0);
      })[0]||null;
  }

  function evidenceRow(r){
    if(r.approval_status==='approved')return matchingResearch(r)||r;
    return r;
  }

  function suggestedRows(){
    const approvedSignatures=new Set(approvedRows().map(signature));
    return researchRows()
      .filter(r=>!approvedSignatures.has(signature(r)))
      // Never show a Suggested card with blank/incomplete Join First data.
      // Suggested becomes visible only when all 4 slots are vetted and each unique hero
      // has real first-Expedition skill + buff/effect evidence.
      .filter(r=>{
        const first=safeJoiners(r);
        if(first.length!==4)return false;
        const ev=joinerEvidence(r,'primary');
        return first.every(hero=>{
          const x=ev.find(e=>norm(e.hero)===norm(hero));
          return !!mechanicText(x);
        });
      })
      .sort((a,b)=>{
        const modeOrder={attack:0,defense:1};
        const ma=modeOrder[norm(a.mode)]??99,mb=modeOrder[norm(b.mode)]??99;
        if(ma!==mb)return ma-mb;
        return Number(b.confidence||0)-Number(a.confidence||0);
      });
  }

  function metadata(r){
    return r?.research_metadata&&typeof r.research_metadata==='object'?r.research_metadata:{};
  }

  function safeJoiners(r){
    const md=metadata(r);
    const slots=(md.raw_joiner_primary||r.joiner_primary||[])
      .map(x=>String(x||'').trim()).filter(Boolean).slice(0,4);
    if(r.approval_status==='approved')return slots;
    // Never surface legacy candidate joiners without the hardened gate.
    if(md.joiner_gate&&slots.length===4)return slots;
    return [];
  }

  function firstExpeditionSkill(hero){
    const list=hero?.metadata?.expedition_skills;
    return Array.isArray(list)&&list.length?list[0]:null;
  }

  function maxPercent(text){
    const nums=String(text||'').match(/\d+(?:\.\d+)?%/g)||[];
    return nums.length?Math.max(...nums.map(x=>Number(x.replace('%',''))||0)):0;
  }

  function buffFamily(hero){
    const sk=firstExpeditionSkill(hero);
    if(!sk)return '';
    const text=`${sk.effect||''} ${sk.description||''}`.toLowerCase();
    if(/enemy.*defen|enemy defense down|reducing all enemy troops'? defense/.test(text))return'enemy_defense_down';
    if(/enemy damage taken up|target.*damage taken|increasing target.*damage taken/.test(text))return'enemy_damage_taken_up';
    if(/enemy.*lethality.*down|enemy lethality down/.test(text))return'enemy_lethality_down';
    if(/enemy.*attack.*down|reduces enemy attack|reducing all enemy troops'? attack/.test(text))return'enemy_attack_down';
    if(/enemy damage down|enemy.*damage dealt.*reduc|reducing damage dealt.*enemy/.test(text))return'enemy_damage_down';
    if(/damage taken down|reducing damage taken|reduce.*damage taken/.test(text))return'damage_taken_down';
    if(/health up|increasing health/.test(text))return'health_up';
    if(/defense up|increasing defense/.test(text))return'defense_up';
    if(/lethality up|increasing.*lethality/.test(text))return'lethality_up';
    if(/normal attack damage up/.test(text))return'normal_attack_damage_up';
    if(/attack up|increasing attack|boosting .*attack/.test(text))return'attack_up';
    if(/damage up|increasing damage dealt|increasing damage by|boosting damage dealt/.test(text))return'damage_up';
    if(/crit rate/.test(text))return'crit_rate';
    if(/dodge/.test(text))return'dodge';
    return'';
  }

  function backupWeight(family,mode){
    const attack={
      enemy_defense_down:110,enemy_damage_taken_up:108,lethality_up:102,
      attack_up:98,damage_up:98,normal_attack_damage_up:88,crit_rate:82
    };
    const defense={
      damage_taken_down:110,enemy_attack_down:108,enemy_damage_down:106,
      enemy_lethality_down:103,health_up:100,defense_up:94,dodge:84
    };
    return (mode==='defense'?defense:attack)[family]||0;
  }

  function calculatedBackups(r){
    const mode=norm(r?.mode)==='defense'?'defense':'attack';
    const excluded=new Set([
      ...(r?.leader_heroes||[]),
      ...safeJoiners(r)
    ].map(norm));
    const candidates=heroes
      .filter(h=>Number(h.generation||0)<=activeGeneration&&!excluded.has(norm(h.name)))
      .map(h=>{
        const sk=firstExpeditionSkill(h),family=buffFamily(h),base=backupWeight(family,mode);
        if(!sk||!base)return null;
        const text=`${sk.effect||''} ${sk.description||''}`;
        const global=/all troops|all enemy troops|friendly troop|friendly troops|target.*damage taken/i.test(text);
        const direct=!/chance/i.test(text);
        const score=base+(global?10:-10)+(direct?5:0)+Math.min(50,maxPercent(text))*.12;
        return {hero:h,family,score};
      })
      .filter(Boolean)
      .sort((a,b)=>b.score-a.score||Number(b.hero.generation||0)-Number(a.hero.generation||0));

    const picked=[],families=new Set();
    for(const x of candidates){
      if(picked.length>=6)break;
      if(families.has(x.family))continue;
      picked.push(x.hero.name);families.add(x.family);
    }
    for(const x of candidates){
      if(picked.length>=6)break;
      if(!picked.includes(x.hero.name))picked.push(x.hero.name);
    }
    return picked;
  }

  function safeBackups(r,allowCalculated=false){
    const md=metadata(r);
    const stored=(r.backup_joiner_pool||[]).map(x=>String(x||'').trim()).filter(Boolean);
    if(stored.length)return stored;
    if(allowCalculated)return calculatedBackups(r);
    if(md.joiner_gate)return stored;
    return [];
  }

  function joinerEvidence(r,role){
    return (metadata(r).joiner_evidence||[]).filter(x=>x?.role===role&&x?.hero);
  }

  function compactReason(text,max=220){
    const s=String(text||'').trim();
    if(s.length<=max)return s;
    const cut=s.slice(0,max);
    const i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('; '));
    return (i>80?cut.slice(0,i+1):cut.trimEnd()+'…');
  }

  function sourceFreeReason(text){
    const s=String(text||'').trim();if(!s)return '';
    const bad=/(whiteout|wos guru|guide|source|youtube|creator|website|table|lists?|recommends?|supports?|according to)/i;
    const parts=s.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean).filter(x=>!bad.test(x));
    return parts.join(' ').trim();
  }

  function mechanicText(x){
    if(!x)return '';
    const effect=String(x.buff_effect||'').trim();
    const fit=sourceFreeReason(x.rally_fit||'');
    const why=sourceFreeReason(x.why||'');
    if(effect&&fit)return `${effect} ${fit}`;
    if(effect&&why)return `${effect} ${why}`;
    return effect||fit||why;
  }

  function top4SynergyText(r){
    const md=metadata(r);
    const leaders=(r?.leader_heroes||[]).filter(Boolean).join(' / ');
    const ratio=(r?.primary_ratio||[]).map(Number).join(' / ');
    const explicit=sourceFreeReason(md.top4_synergy||md.joiner_stack_reasoning||md.joiner_synergy||'');
    if(explicit)return explicit;
    const first=safeJoiners(r),ev=joinerEvidence(r,'primary');
    const effects=first.map(hero=>{
      const x=ev.find(e=>norm(e.hero)===norm(hero));
      const effect=String(x?.buff_effect||'').trim();
      return effect?`${hero}: ${effect}`:'';
    }).filter(Boolean);
    if(effects.length)return `These four seats are treated as one combined package for ${leaders||'this Rally Lead trio'} at ${ratio||'this troop ratio'}. ${effects.join(' • ')}. NEXA uses the package only when those effects complement the rally role and can coexist without a corroborated stacking conflict.`;
    return 'Top 4 rally-fit synergy will populate after the next vetted Brain refresh.';
  }

  function whyFirstFour(r){
    const first=safeJoiners(r);
    if(!first.length){
      return `<div class="muted">Top 4 joiners are waiting for a current vetted rally-fit synergy refresh.</div>`;
    }
    const ev=joinerEvidence(r,'primary');
    return `<div style="display:grid;gap:8px;margin-top:6px">${first.map((hero,index)=>{
      const x=ev.find(e=>norm(e.hero)===norm(hero));
      const text=mechanicText(x);
      return `<div>
        <b class="${rarity(hero)}">${index+1}. ${esc(hero)}</b>
        <div class="muted"><b style="color:#d7def5">Why it fits this rally:</b> ${text?esc(compactReason(text,320)):'Rally-fit explanation will populate after the next vetted Brain refresh.'}</div>
      </div>`;
    }).join('')}</div>`;
  }


  function tierLabel(r){
    const conf=Number(r.confidence||0);
    return conf>=.72&&Number(r.independent_source_count||0)>=3&&Number(r.source_count||0)>=3
      ? 'CORROBORATED'
      : 'PROMISING';
  }

  function ratioReasoning(r){
    return metadata(r).ratio_reasoning || r?.constraints?.ratio_reasoning || '';
  }

  function renderCard(r,view){
    const ev=evidenceRow(r);
    const approved=view==='approved';
    const label=approved?'APPROVED':tierLabel(r);
    const joiners=safeJoiners(ev);
    const backups=safeBackups(ev,approved);
    const why=ev.why_good||ev.evidence_note||r.why_good||r.evidence_note||'No explanation saved yet.';
    const risk=ev.risk_note||r.risk_note||'';
    const rr=ratioReasoning(ev);
    const conf=Math.round(Number(ev.confidence||0)*100);
    const indep=Number(ev.independent_source_count||0);
    const sources=Number(ev.source_count||0);

    return `<article class="card ${esc(r.mode)}" data-id="${esc(r.id)}">
      <div class="card-head">
        <div>
          <b>${r.mode==='attack'?'⚔ ATTACK':'🛡 DEFENSE'}</b>
          <div class="muted" style="font-size:10px;margin-top:3px">Gen ${esc(r.generation)}</div>
        </div>
        <span class="badge ${approved?'approved':'suggested'}">${label}</span>
      </div>

      <div class="heroes">${(r.leader_heroes||[]).map(heroCard).join('')}</div>
      <div class="ratio">${(r.primary_ratio||[]).join(' / ')}</div>

      <div class="detail">
        <b>Top 4 Joiners • Stack Order</b>
        ${joiners.length?chips(joiners):'<div class="muted" style="margin-top:6px">Pending vetted Top 4 joiners.</div>'}

        <div style="height:10px"></div>
        <b>Top 4 Synergy & Stack</b>
        <div class="muted" style="margin-top:6px">${esc(compactReason(top4SynergyText(ev),650))}</div>

        <div style="height:10px"></div>
        <b>Why each seat fits this Rally</b>
        ${whyFirstFour(ev)}

        <div style="height:10px"></div>
        <b>Backup Joiner Pool</b>
        ${backups.length?chips(backups):'<div class="muted" style="margin-top:6px">No compatible backup buffs found in the unlocked Hero Library yet.</div>'}

        <div style="height:10px"></div>
        <b>Why this formation</b>
        <div class="muted">${esc(why)}</div>

        ${rr?`<div style="height:10px"></div><b>Why this ratio</b><div class="muted">${esc(rr)}</div>`:''}

        ${risk?`<div style="height:10px"></div><b>Risk / Variables</b><div class="muted">${esc(risk)}</div>`:''}

        <div style="height:10px"></div>
        <b>Evidence</b>
        <div class="muted">${conf}% confidence • ${indep} independent source group${indep===1?'':'s'} • ${sources} source${sources===1?'':'s'}</div>

        ${!approved?`<div class="actions"><button type="button" class="btn primary approve" data-id="${esc(r.id)}">Add / Approve</button></div>`:''}
      </div>
    </article>`;
  }

  function render(){
    const list=$('#list');
    if(!list)return;
    const wanted=tab==='approved'
      ? approvedRows().sort((a,b)=>{
          const mo={attack:0,defense:1};const ma=mo[norm(a.mode)]??99,mb=mo[norm(b.mode)]??99;
          return ma!==mb?ma-mb:Number(evidenceRow(b).confidence||0)-Number(evidenceRow(a).confidence||0);
        })
      : suggestedRows();

    const empty=tab==='suggested'
      ? `<div class="empty"><b>No review-worthy Suggested formations yet for Gen ${activeGeneration}.</b><br>Suggested only shows independently supported formations at 60%+ that are not already Approved.</div>`
      : `<div class="empty">No active Approved formations found for Gen ${activeGeneration}.</div>`;

    list.innerHTML=wanted.length
      ? wanted.map(r=>renderCard(r,tab)).join('')
      : empty;

    document.querySelectorAll('.card').forEach(c=>{
      c.addEventListener('click',e=>{
        if(e.target.closest('button'))return;
        c.classList.toggle('open');
      });
    });
    document.querySelectorAll('.approve').forEach(b=>b.addEventListener('click',approve));
  }

  function setTab(nextTab,button){
    tab=nextTab;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    button.classList.add('active');
    render();
  }

  function pickableRarity(h){const r=String(h?.rarity||'').toLowerCase();return r.includes('legendary')||r.includes('myth')||r.includes('gold')||r.includes('epic')||r.includes('purple')}
  function formationHeroFace(name){const h=heroes.find(x=>norm(x.name)===norm(name));return h?`${h.image_url?`<img src="${esc(h.image_url)}" alt="">`:''}<b class="${rarity(h.name)}">${esc(h.name)}</b><small>Gen ${esc(h.generation)} • ${esc(h.rarity||'')}</small>`:'<b>Choose Hero</b><small>Epic/Purple or Legendary</small>'}
  function refreshFormationHeroButtons(){document.querySelectorAll('[data-formation-hero]').forEach(b=>{const el=document.getElementById(b.dataset.formationHero);b.innerHTML=formationHeroFace(el?.value||'')})}
  function openFormationHeroPicker(button){
    const target=document.getElementById(button.dataset.formationHero),type=button.dataset.troop,current=target?.value||'';
    const pool=heroes.filter(h=>Number(h.generation||0)<=activeGeneration&&pickableRarity(h)&&String(h.troop_type||'').toLowerCase()===type).sort((a,b)=>Number(b.generation||0)-Number(a.generation||0)||String(a.name).localeCompare(String(b.name)));
    const ov=document.createElement('div');ov.className='formation-hero-overlay';
    ov.innerHTML=`<div class="formation-hero-overlay-card"><div class="bar"><div><h3 style="margin:0">Choose ${esc(type[0].toUpperCase()+type.slice(1))} Hero</h3><div class="note">Gen ${activeGeneration} or earlier • Epic/Purple + Legendary only</div></div><button class="btn" data-close-hero type="button">Close</button></div><div class="formation-hero-choice-grid">${pool.map(h=>`<button class="formation-hero-choice ${norm(h.name)===norm(current)?'selected':''}" data-name="${esc(h.name)}" type="button">${h.image_url?`<img src="${esc(h.image_url)}" alt="">`:''}<b class="${rarity(h.name)}">${esc(h.name)}</b><small>Gen ${esc(h.generation)} • ${esc(h.rarity||'')}</small></button>`).join('')}</div></div>`;
    document.body.appendChild(ov);$('[data-close-hero]',ov).onclick=()=>ov.remove();ov.querySelectorAll('[data-name]').forEach(x=>x.onclick=()=>{if(target)target.value=x.dataset.name||'';button.innerHTML=formationHeroFace(target?.value||'');ov.remove()});
  }
  function bindUI(){
    document.querySelectorAll('.tabs button').forEach(button=>{
      button.addEventListener('click',()=>setTab(button.dataset.tab,button));
    });
    $('#add')?.addEventListener('click',()=>{$('#modal')?.classList.add('open');refreshFormationHeroButtons()});
    $('#close')?.addEventListener('click',()=>$('#modal')?.classList.remove('open'));
    $('#modal')?.addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});
    document.querySelectorAll('[data-formation-hero]').forEach(b=>b.addEventListener('click',()=>openFormationHeroPicker(b)));
    $('#save')?.addEventListener('click',save);
  }

  function buildHeroOptions(){
    const generationInput=$('#generation');
    if(generationInput){generationInput.value=activeGeneration;generationInput.max=activeGeneration}
    const types=['infantry','lancer','marksman'];
    ['#h0','#h1','#h2'].forEach((sel,i)=>{const el=$(sel);if(!el)return;const old=el.value,pool=heroes.filter(h=>Number(h.generation||0)<=activeGeneration&&pickableRarity(h)&&String(h.troop_type||'').toLowerCase()===types[i]).sort((a,b)=>Number(b.generation||0)-Number(a.generation||0)||String(a.name).localeCompare(String(b.name)));el.innerHTML='<option value="">Select</option>'+pool.map(h=>`<option value="${esc(h.name)}">${esc(h.name)} • Gen ${esc(h.generation)}</option>`).join('');if(pool.some(h=>h.name===old))el.value=old});
    refreshFormationHeroButtons();
  }

  async function load(attempt=0){
    if(!sb){status('Database connection unavailable. Tabs and Add Formation are still usable.');render();return}
    status('Loading…');
    try{
      const [a,b,g]=await Promise.all([
        sb.from('nexa_battle_meta_rules').select('*').in('approval_status',['approved','corroborated','candidate']).order('generation',{ascending:false}).order('confidence',{ascending:false}),
        sb.from('nexa_library_items').select('name,image_url,rarity,generation,troop_type,metadata').eq('item_type','hero').eq('is_active',true).order('generation'),
        sb.from('nexa_library_generations').select('generation,is_visible,unlock_at').eq('item_type','hero').order('generation')
      ]);

      if(a.error){
        if(attempt<3){
          status(`Formation load retry ${attempt+1}/3…`);
          setTimeout(()=>load(attempt+1),450);
          return;
        }
        status('Formation load error: '+a.error.message);
        rows=[];
      }else rows=a.data||[];

      heroes=b.error?[]:(b.data||[]);
      activeGeneration=resolveGeneration(g.error?[]:(g.data||[]));

      // Safari-safe current-generation Approved fallback.
      // Approved rows exist independently of research rows and should never disappear
      // just because the broad mixed-status request came back incomplete.
      if(sb && !rows.some(r=>Number(r.generation)===activeGeneration&&r.approval_status==='approved'&&r.is_active!==false)){
        const fallback=await sb.from('nexa_battle_meta_rules')
          .select('*')
          .eq('generation',activeGeneration)
          .eq('approval_status','approved')
          .eq('is_active',true)
          .order('confidence',{ascending:false});
        if(!fallback.error && fallback.data?.length){
          const seen=new Set(rows.map(r=>String(r.id)));
          for(const r of fallback.data)if(!seen.has(String(r.id)))rows.push(r);
        }
      }

      buildHeroOptions();
      const approvedCount=approvedRows().length;
      const suggestedCount=suggestedRows().length;
      status(`Gen ${activeGeneration} • Approved ${approvedCount} • Suggested ${suggestedCount} • 60%+ vetted only`);
      render();
    }catch(err){
      console.error('[NEXA Formations] load failed',err);
      activeGeneration=resolveGeneration([]);
      buildHeroOptions();
      status('Could not finish loading formation data.');
      render();
    }
  }

  async function approve(e){
    e.stopPropagation();
    if(!sb){status('Database connection unavailable.');return}
    const id=e.currentTarget.dataset.id;
    const row=rows.find(r=>String(r.id)===String(id));
    if(!row||Number(row.generation)!==activeGeneration){status('Only the current unlocked generation can be approved here.');return}
    status('Approving…');
    try{
      const {error}=await sb.from('nexa_battle_meta_rules')
        .update({approval_status:'approved',is_active:true,verified_at:new Date().toISOString()})
        .eq('id',id);
      if(error){status(error.message);return}
      await load();
    }catch(err){
      console.error('[NEXA Formations] approve failed',err);
      status('Could not approve this formation.');
    }
  }

  async function save(){
    if(!sb){status('Database connection unavailable.');return}
    if(saveBusy)return;
    const ratio=[Number($('#r0')?.value||0),Number($('#r1')?.value||0),Number($('#r2')?.value||0)];
    if(ratio.reduce((a,b)=>a+b,0)!==100){status('Ratio must total 100.');return}
    const hs=['#h0','#h1','#h2'].map(s=>$(s)?.value||'');
    if(hs.some(x=>!x)){status('Choose all 3 Rally Lead heroes.');return}
    const jf=($('#joinfirst')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const bp=($('#backup')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
    if(jf.length!==4){status('Top 4 Joiners must contain exactly 4 hero names.');return}
    const generation=Number($('#generation')?.value||0);
    if(generation!==activeGeneration){status(`Only Gen ${activeGeneration} is currently unlocked.`);return}
    const mode=$('#mode')?.value||'attack',rule_key=`manual_${mode}_${Date.now()}`,button=$('#save');
    saveBusy=true;if(button){button.disabled=true;button.textContent='Saving…'}status('Saving…');
    try{
      const {error}=await sb.from('nexa_battle_meta_rules').insert({
        generation,event_scope:'pvp_rally',mode,rule_key,leader_heroes:hs,primary_ratio:ratio,
        alternative_ratios:[],alternative_formations:[],joiner_primary:jf,joiner_alternatives:bp,backup_joiner_pool:bp,
        constraints:{max_generation:activeGeneration},confidence:1,evidence_status:'verified',
        research_metadata:{top4_synergy:($('#top4synergy')?.value||'').trim()},
        evidence_note:'Manual approved formation.',why_good:($('#why')?.value||'').trim(),risk_note:($('#risk')?.value||'').trim(),
        source_urls:[],source_count:0,independent_source_count:0,approval_status:'approved',is_active:true,is_manual:true,
        verified_at:new Date().toISOString()
      });
      if(error){status(error.message);return}
      $('#modal')?.classList.remove('open');
      status('Formation saved.');
      await load();
    }catch(err){
      console.error('[NEXA Formations] save failed',err);
      status('Could not save this formation.');
    }finally{
      saveBusy=false;if(button){button.disabled=false;button.textContent='Add Approved Formation'}
    }
  }

  function connectSupabase(){
    try{
      const factory=window.supabase?.createClient;
      if(typeof factory!=='function'){status('Supabase library did not load. Retrying…');return false}
      sb=factory(SUPABASE_URL,SUPABASE_KEY);
      return true;
    }catch(err){
      console.error('[NEXA Formations] Supabase init failed',err);
      status('Supabase connection failed.');
      return false;
    }
  }

  function start(){
    bindUI();
    status('Starting Formations…');
    if(connectSupabase()){load();return}
    let attempts=0;
    const retry=setInterval(()=>{
      attempts++;
      if(connectSupabase()){clearInterval(retry);load();return}
      if(attempts>=10){clearInterval(retry);activeGeneration=resolveGeneration([]);buildHeroOptions();render();status('Database connection unavailable. Please reload this page.')}
    },300);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>
</body>
</html>
