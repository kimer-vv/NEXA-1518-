<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Template Builder V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --bg:#070812;--panel:#111321;--panel2:#171a2b;--text:#f6f7ff;--muted:#a9aec7;--line:#2e3246;
  --accent:#6f52ff;--sheet-bg:#ffffff;--sheet-text:#14213d;--sheet-muted:#677084;--team-head:#173b7a;--section-bg:#eef2f8;--pet:#d89b20;--sheet-border:#cfd5e2;--sheet-font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--title-weight:900;--body-weight:400;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17132c 0,#090912 42%,#06060b 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1500px;margin:0 auto;padding:18px}
.back{display:inline-block;color:#cbc8ff;text-decoration:none;margin-bottom:12px}
.builder{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}
.panel{background:rgba(17,19,33,.9);border:1px solid var(--line);border-radius:20px;padding:16px}
h1,h2,h3{margin:.25rem 0 .6rem}
.muted{color:var(--muted)}
.controls{display:grid;gap:14px}
.control-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0e101c}
label{display:grid;gap:6px}
select,input{width:100%;background:#090b15;color:#fff;border:1px solid #3c415a;border-radius:11px;padding:10px;font:inherit}
.btn{width:100%;background:#171425;color:#fff;border:1px solid #4b3a72;border-radius:12px;padding:11px 13px;font-weight:800}
.btn.primary{background:linear-gradient(135deg,#6b4cff,#8f6dff)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview-wrap{overflow:auto}
.sheet{
  min-width:920px;background:var(--sheet-bg);color:var(--sheet-text);border-radius:18px;padding:26px;
  box-shadow:0 24px 70px rgba(0,0,0,.35)
}
.sheet-header{text-align:center;margin-bottom:18px}
.sheet-title{font-size:42px;font-weight:900;letter-spacing:.04em}
.teams-grid{display:grid;gap:16px}
.teams-grid.count-1{grid-template-columns:1fr}
.teams-grid.count-2{grid-template-columns:repeat(2,1fr)}
.teams-grid.count-3{grid-template-columns:repeat(3,1fr)}
.teams-grid.count-4{grid-template-columns:repeat(4,1fr)}
.teams-grid.count-5,.teams-grid.count-6{grid-template-columns:repeat(3,1fr)}
.team-card{border:1px solid #cfd5e2;border-radius:14px;overflow:hidden;background:#fff}
.team-title{background:var(--team-head);color:#fff;text-align:center;padding:10px;font-weight:900}
.team-section-title{background:var(--section-bg);padding:8px 10px;font-weight:900;text-align:center}
.player-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(80px,.75fr) minmax(80px,.75fr);gap:8px;padding:8px 10px;border-top:1px solid #e2e6ef;align-items:center;font-size:14px}
.player-row.rally{grid-template-columns:minmax(120px,1fr) minmax(110px,.85fr)}
.player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet{color:var(--pet);font-weight:800}
.formations{margin-top:18px;border-top:1px solid #dfe3ec;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formation-card{border:1px solid #d5dae5;border-radius:12px;padding:10px}
.formation-title{font-weight:900}
.formation-heroes{font-weight:800;margin-top:4px}
.formation-ratio{color:#5f6675;margin-top:3px}
.legend{margin-top:16px;display:flex;gap:16px;justify-content:center;color:#59606f;font-size:13px}
.compact .player-row{font-size:12px;padding:6px 8px}
.compact .team-title{padding:8px;font-size:14px}
.compact .team-section-title{padding:6px 8px;font-size:12px}
.compact .sheet-title{font-size:34px}
@media(max-width:900px){
  .builder{grid-template-columns:1fr}
  .sheet{min-width:820px}
}

.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-grid input[type=color]{height:42px;padding:3px}
.brand-preview{display:flex;gap:10px;align-items:center}
.brand-preview img{width:58px;height:58px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#090b15;padding:5px}
.sheet{font-family:var(--sheet-font)!important;font-weight:var(--body-weight)}
.sheet-title{font-weight:var(--title-weight)!important}
.sheet-subtitle{color:var(--sheet-muted);font-weight:700}
.sheet-brand-row{display:flex;justify-content:center;align-items:center;gap:16px}
.sheet-emblem{width:74px;height:74px;object-fit:contain}
.team-card{border-color:var(--sheet-border)!important}
.player-row{border-top-color:var(--sheet-border)!important}
.formations{border-top-color:var(--sheet-border)!important}
.formation-card{border-color:var(--sheet-border)!important}
.legend{color:var(--sheet-muted)!important}


.column-labels{
  background:var(--section-bg);
  color:var(--sheet-muted);
  font-size:10px!important;
  font-weight:900;
  letter-spacing:.045em;
  text-transform:uppercase;
}
.pet-time{color:var(--sheet-text);font-weight:700}
.pet-paw{color:var(--pet)!important;font-size:1.12em;filter:saturate(1.2)}
.player-row.no-defense-row{grid-template-columns:minmax(110px,1fr) minmax(90px,.85fr)}


/* NEXA clean layout preview — works on iPhone without relying on Fullscreen API */
.layout-preview-overlay{
  position:fixed;
  inset:0;
  z-index:2147483000;
  background:#eef1f6;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.layout-preview-overlay.hidden{display:none!important}
.layout-preview-toolbar{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:#fff;
  border-bottom:1px solid rgba(0,0,0,.1);
  flex:0 0 auto;
}
.layout-preview-stage{
  flex:1 1 auto;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px;
}
#layout-preview-content{
  width:max-content;
  min-width:100%;
  display:flex;
  justify-content:center;
}
#layout-preview-content .sheet{
  margin:0!important;
  box-shadow:0 10px 34px rgba(0,0,0,.16)!important;
}
body.nexa-layout-preview-open{
  overflow:hidden!important;
}
#export-status.success{color:#59c98a}
#export-status.error{color:#ff8ca4}
@media(max-width:700px){
  .layout-preview-stage{padding:10px}
  #layout-preview-content{
    width:100%;
    min-width:0;
    justify-content:flex-start;
  }
  #layout-preview-content .sheet{
    transform-origin:top left;
    max-width:none!important;
  }
}


/* ===== NEXA FINAL TEAM SHEET — fixed professional layout ===== */
.sheet{
  width:1400px!important;
  min-width:1400px!important;
  max-width:1400px!important;
  background:var(--sheet-bg)!important;
  color:var(--sheet-text)!important;
  border-radius:18px;
  padding:26px 28px 20px!important;
  box-sizing:border-box;
}
.sheet-header{
  position:relative;
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px!important;
  padding:0 300px 0 210px;
}
.sheet-brand-row{justify-content:center!important;gap:14px!important}
.sheet-title{font-size:52px!important;line-height:1!important}
.sheet-subtitle{font-size:18px;margin-top:7px;letter-spacing:.08em}
.sheet-emblem{width:82px!important;height:82px!important}

.sheet-legend{
  position:absolute;
  top:0;
  right:0;
  min-width:245px;
  border:1px solid var(--sheet-border);
  border-radius:13px;
  padding:10px 14px;
  display:grid;
  gap:6px;
  background:var(--sheet-bg);
  font-size:13px;
  font-weight:800;
}
.sheet-legend>div{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.sheet-legend small{font-weight:600;color:var(--sheet-muted)}
.legend-icon{font-size:18px;text-align:center;font-weight:900}
.rally-icon{color:var(--team-head)}
.joiner-icon{color:#24783b}
.pet-icon{color:var(--pet)}

.teams-grid{
  display:grid!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  gap:14px!important;
  align-items:start;
}
.teams-grid.count-1,.teams-grid.count-2,.teams-grid.count-3,
.teams-grid.count-4,.teams-grid.count-5,.teams-grid.count-6{
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
}
.team-card{
  min-width:0!important;
  border:1px solid var(--sheet-border)!important;
  border-radius:12px!important;
  overflow:hidden;
  background:var(--sheet-bg)!important;
}
.team-title{
  background:var(--team-head)!important;
  color:#fff!important;
  text-align:center;
  padding:9px 8px!important;
  font-weight:900;
  font-size:18px;
  letter-spacing:.015em;
}
.team-section-title{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  background:var(--section-bg)!important;
  padding:8px 8px!important;
  font-weight:900;
  text-align:center;
  color:var(--team-head);
  font-size:13px;
}
.team-section-title.joiners-heading{color:#24783b}
.section-icon{font-size:16px;line-height:1}

.rally-list{padding:0 10px}
.rally-entry{
  display:grid;
  grid-template-columns:minmax(0,1fr) 38px;
  align-items:center;
  gap:8px;
  padding:9px 2px;
  border-bottom:1px solid var(--sheet-border);
}
.rally-entry:last-child{border-bottom:0}
.rally-info{min-width:0}
.rally-name{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rally-time{margin-top:2px;font-size:11px;color:var(--sheet-text);font-weight:650}
.rally-pet{
  color:var(--pet);
  font-size:25px;
  line-height:1;
  text-align:center;
}
.rally-pet.empty{visibility:hidden}
.rally-empty{padding:12px;text-align:center;color:var(--sheet-muted);font-size:12px}

.joiner-table{width:100%;display:block}
.joiner-head,.joiner-row{
  display:grid;
  grid-template-columns:minmax(100px,1.25fr) minmax(74px,.8fr) minmax(74px,.8fr);
  align-items:stretch;
}
.joiner-head.no-defense,.joiner-row.no-defense{
  grid-template-columns:minmax(115px,1.35fr) minmax(95px,1fr);
}
.joiner-head{
  background:var(--section-bg);
  color:#24783b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.035em;
}
.joiner-head>div,.joiner-row>div{
  padding:7px 7px;
  border-right:1px solid var(--sheet-border);
}
.joiner-head>div:last-child,.joiner-row>div:last-child{border-right:0}
.joiner-row{
  border-top:1px solid var(--sheet-border);
  min-height:48px;
  font-size:11px;
}
.joiner-player{
  font-weight:850;
  display:flex;
  align-items:center;
  min-width:0;
}
.joiner-player span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-cell{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-width:0;
}
.hero-mini{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:0;
  max-width:100%;
}
.hero-mini img{
  width:29px;height:29px;border-radius:7px;object-fit:cover;border:1px solid var(--sheet-border);
}
.hero-mini-name{
  font-size:10px;
  line-height:1.05;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hero-empty{color:var(--sheet-muted)}

.formations{
  margin-top:20px!important;
  padding-top:0!important;
  border-top:0!important;
  display:block!important;
}
.formations[style*="display: none"],.formations.is-empty{display:none!important}
.formations-heading{
  display:flex;
  align-items:center;
  gap:14px;
  margin:0 0 10px;
  color:var(--team-head);
  font-size:19px;
  font-weight:950;
  text-align:center;
}
.formations-heading:before,.formations-heading:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--sheet-border);
}
.formation-groups{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.formation-group{
  border:1px solid var(--sheet-border);
  border-radius:12px;
  padding:10px;
  min-width:0;
}
.formation-group-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:-21px auto 8px;
  width:max-content;
  max-width:90%;
  padding:0 10px;
  background:var(--sheet-bg);
  font-size:13px;
  font-weight:950;
}
.formation-group.joiner .formation-group-title{color:#24783b}
.formation-group.rally .formation-group-title{color:var(--team-head)}
.formation-cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}
.formation-card{
  border:1px solid var(--sheet-border)!important;
  border-radius:9px!important;
  padding:8px 6px!important;
  min-width:0;
  text-align:center;
  background:var(--sheet-bg);
}
.formation-title{
  font-size:10.5px;
  line-height:1.15;
  font-weight:950!important;
  text-transform:uppercase;
  color:inherit;
}
.formation-hero-list{
  min-height:40px;
  margin-top:7px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:6px;
}
.formation-hero{
  min-width:0;
  max-width:62px;
  text-align:center;
}
.formation-hero img{
  display:block;
  width:31px;height:31px;margin:0 auto 2px;border-radius:7px;object-fit:cover;border:1px solid var(--sheet-border);
}
.formation-hero-name{
  display:block;
  font-size:8.5px;
  line-height:1.05;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.formation-ratio{
  margin-top:7px!important;
  padding:5px 4px;
  border-radius:7px;
  background:var(--section-bg);
  color:var(--sheet-text)!important;
  font-size:13px;
  line-height:1;
  font-weight:900;
}
.sheet-utc{
  margin-top:12px;
  text-align:center;
  color:var(--team-head);
  font-size:12px;
  font-weight:800;
}
.legend{display:none!important}

/* Keep export layout identical regardless of editor density setting. */
.compact .player-row,.compact .team-title,.compact .team-section-title,.compact .sheet-title{
  font-size:inherit;
  padding:inherit;
}


.empty-sheet-message{
  grid-column:1/-1;
  border:1px dashed var(--sheet-border);
  border-radius:12px;
  padding:28px;
  text-align:center;
  color:var(--sheet-muted);
  font-weight:750;
}


/* Mobile-safe live preview: show the FULL sheet width inside the phone. */
.preview-wrap{
  overflow:hidden!important;
}
.sheet-inline-holder{
  width:100%;
  position:relative;
  overflow:hidden;
}
.sheet-inline-holder>.sheet{
  transform-origin:top left;
  margin:0!important;
}
.joiner-person-svg{
  width:1em;
  height:1em;
  display:block;
  fill:#24783b;
}
.legend-icon.joiner-icon,
.section-icon.joiner-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.legend-icon.joiner-icon .joiner-person-svg{width:18px;height:18px}
.section-icon.joiner-icon .joiner-person-svg{width:16px;height:16px}

/* Preview overlay must use all available phone width and scroll vertically only. */
.layout-preview-stage{
  overflow-y:auto!important;
  overflow-x:hidden!important;
}
#layout-preview-content{
  width:100%!important;
  min-width:0!important;
  display:block!important;
}
#layout-preview-content .sheet{
  transform-origin:top left!important;
}


/* iOS live-sheet fix: CSS zoom keeps the complete scaled document in normal flow. */
.sheet-inline-holder{
  width:100%!important;
  height:auto!important;
  min-height:0!important;
  overflow:visible!important;
  position:relative;
}
.sheet-inline-holder>.sheet{
  transform:none!important;
  transform-origin:top left!important;
  margin:0!important;
}
@supports not (zoom: 1){
  .sheet-inline-holder{overflow:auto!important}
  .sheet-inline-holder>.sheet{zoom:1!important}
}


/* ===== NEXA DYNAMIC TEAM / FORMATION WIDTH FIX =====
   Use the full Team Sheet width for the teams that actually exist. */
.teams-grid.count-1{
  grid-template-columns:minmax(0,1fr)!important;
}
.teams-grid.count-2{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
}
.teams-grid.count-3{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
}
.teams-grid.count-4{
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
}
.teams-grid.count-5,
.teams-grid.count-6{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
}

/* With fewer teams, give rows more breathing room rather than leaving
   two empty "phantom" team columns on the right. */
.teams-grid.count-1 .team-card{max-width:760px;width:100%;justify-self:center}
.teams-grid.count-2 .team-card .rally-name{font-size:15px}
.teams-grid.count-2 .team-card .rally-time{font-size:12px}
.teams-grid.count-2 .joiner-row{font-size:13px;min-height:54px}
.teams-grid.count-2 .hero-mini-name{font-size:11px}
.teams-grid.count-2 .team-section-title{font-size:14px}

/* Formations use however many cards are actually saved.
   2 saved formations = 2 wide cards, 4 = 4 compact cards. */
.formation-cards{
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important;
}
.formation-group:has(.formation-card:nth-child(1):last-child) .formation-cards{
  grid-template-columns:minmax(0,1fr)!important;
}
.formation-group:has(.formation-card:nth-child(2):last-child) .formation-cards{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
}
.formation-group:has(.formation-card:nth-child(3):last-child) .formation-cards{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
}
.formation-group:has(.formation-card:nth-child(4):last-child) .formation-cards{
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
}
.formation-title{
  white-space:normal!important;
  overflow-wrap:normal!important;
  word-break:normal!important;
}
.formation-ratio{
  white-space:nowrap!important;
}


.formation-cards.cards-1{grid-template-columns:minmax(0,1fr)!important}
.formation-cards.cards-2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.formation-cards.cards-3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.formation-cards.cards-4{grid-template-columns:repeat(4,minmax(0,1fr))!important}


/* ===== NEXA TEAM SHEET VISUAL POLISH ===== */
/* Keep the approved dynamic-width logic; only refine spacing/type. */

.team-card{
  overflow:hidden;
}
.team-title{
  font-size:clamp(18px,2.5vw,30px)!important;
  line-height:1.05!important;
  padding:10px 8px!important;
}
.team-section-title{
  font-size:12px!important;
  line-height:1.15!important;
  letter-spacing:.35px!important;
  padding:7px 5px!important;
}
.rally-row{
  padding:7px 8px!important;
  min-height:48px!important;
}
.rally-name{
  font-size:14px!important;
  line-height:1.12!important;
}
.rally-time{
  font-size:10px!important;
  line-height:1.1!important;
  margin-top:2px!important;
}
.joiner-head,
.joiner-row{
  grid-template-columns:minmax(0,1.35fr) minmax(0,.82fr) minmax(0,.82fr)!important;
}
.joiner-head{
  font-size:10px!important;
  line-height:1.05!important;
  letter-spacing:.25px!important;
}
.joiner-head > *,
.joiner-row > *{
  min-width:0!important;
  padding-left:5px!important;
  padding-right:5px!important;
}
.joiner-row{
  font-size:11px!important;
  line-height:1.1!important;
  min-height:38px!important;
}
.joiner-name{
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
}
.hero-mini-name{
  font-size:9px!important;
  line-height:1.05!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important;
}

/* Global formations: cleaner hierarchy and more usable card width. */
.formations-title{
  font-size:13px!important;
  line-height:1.1!important;
  letter-spacing:.3px!important;
  margin:4px 0 5px!important;
}
.formation-group{
  padding:7px!important;
}
.formation-group-title{
  font-size:11px!important;
  line-height:1.1!important;
  letter-spacing:.2px!important;
  margin-bottom:6px!important;
}
.formation-card{
  padding:7px 5px!important;
  min-width:0!important;

function displayName(v){
  let out=String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u200B-\u200D\uFEFF]/g,'');
  const map={'Α':'A','Β':'B','Ε':'E','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X','α':'a','β':'b','ε':'e','ι':'i','κ':'k','μ':'m','ν':'n','ο':'o','ρ':'p','τ':'t','υ':'y','χ':'x','Ɛ':'E','ɛ':'e','Ǝ':'E','Ɩ':'I','Ƙ':'K','ƙ':'k','Ɯ':'M','Ɲ':'N','Ƥ':'P','Ʀ':'R','ʀ':'R','Ƨ':'S','Ƭ':'T','Ʋ':'V','Ƴ':'Y','Ƶ':'Z'};
  out=[...out].map(ch=>map[ch]??ch).join('').replace(/[ʚɞ꧁꧂༺༻『』【】〖〗《》〈〉❖✦✧★☆•·]+/g,'').replace(/\s+/g,' ').trim();
  return out;
}

async function load(){
  const teamQuery=sb.from('alliance_teams').select('*')
    .eq('event_type_key',eventKey)
    .eq('alliance_id',String(allianceId))
    .order('sort_order').order('created_at');

  let {data:teams,error:tErr}=await teamQuery;

  // Compatibility fallback for older rows that may have stored event type with different case.
  if(!tErr && (!teams||!teams.length) && eventType!==eventKey){
    const fallback=await sb.from('alliance_teams').select('*')
      .eq('event_type_key',eventType)
      .eq('alliance_id',String(allianceId))
      .order('sort_order').order('created_at');
    if(!fallback.error && fallback.data?.length)teams=fallback.data;
  }

  if(tErr){
    $('teams-grid').innerHTML=`<div class="empty-sheet-message">Could not load Teams: ${esc(tErr.message)}</div>`;
    return;
  }

  const ids=(teams||[]).map(x=>x.id);
  let members=[];
  if(ids.length){
    const {data,error}=await sb.from('team_members').select('*,pet_windows(*)').in('team_id',ids).order('created_at');
    if(error){
      $('teams-grid').innerHTML=`<div class="empty-sheet-message">Teams were found, but Team members could not load: ${esc(error.message)}</div>`;
      return;
    }
    members=data||[];
  }

  let {data:formations,error:fErr}=await sb.from('alliance_formations').select('*')
    .eq('event_type_key',eventKey)
    .eq('alliance_id',String(allianceId))
    .order('formation_scope').order('sort_order');

  if(!fErr && (!formations||!formations.length) && eventType!==eventKey){
    const fallback=await sb.from('alliance_formations').select('*')
      .eq('event_type_key',eventType)
      .eq('alliance_id',String(allianceId))
      .order('formation_scope').order('sort_order');
    if(!fallback.error && fallback.data?.length)formations=fallback.data;
  }

  if(fErr){
    $('formations').classList.remove('is-empty');
    $('formations').innerHTML=`<div class="empty-sheet-message">Could not load Formations: ${esc(fErr.message)}</div>`;
    formations=[];
  }

  renderTeams(teams||[],members);
  renderFormations(formations||[]);
  autoDensity((teams||[]).length);
  requestAnimationFrame(()=>{
    if(typeof fitInlineSheet==='function')fitInlineSheet();
    setTimeout(()=>{ if(typeof fitInlineSheet==='function')fitInlineSheet(); },80);
  });
  requestAnimationFrame(()=>{fitInlineSheet();setTimeout(fitInlineSheet,80);});

  if(!(teams||[]).length){
    $('teams-grid').innerHTML=`<div class="empty-sheet-message">
      No Teams were found for ${esc(allianceTag)} / ${esc(String(eventType).toUpperCase())}.
      Go back to the Alliance Workspace, save the Team, then reopen the layout.
    </div>`;
  }
}
function heroData(value){
  if(value==null||value==='')return null;
  if(typeof value==='object'){
    return {
      name:displayName(value.name||value.hero_name||value.label||'Hero'),
      image:value.image_url||value.image||value.avatar_url||value.portrait_url||''
    };
  }
  return {name:displayName(value),image:''};
}
function heroMarkup(value,formation=false){
  const h=heroData(value);
  if(!h)return `<span class="hero-empty">—</span>`;
  if(formation){
    return `<span class="formation-hero">
      ${h.image?`<img src="${esc(h.image)}" alt="">`:''}
      <span class="formation-hero-name">${esc(h.name)}</span>
    </span>`;
  }
  return `<span class="hero-mini">
    ${h.image?`<img src="${esc(h.image)}" alt="">`:''}
    <span class="hero-mini-name">${esc(h.name)}</span>
  </span>`;
}
function petWindowText(w){
  const start=String(w?.start_utc||'').trim();
  const end=String(w?.end_utc||'').trim();
  if(start&&end)return `${start}–${end}`;
  if(start)return `${start}`;
  return '';
}
function renderTeams(teams,members){
  const sheet=$('sheet');
  const teamCount=(teams||[]).length;
  sheet?.classList.toggle('layout-side',teamCount>=1&&teamCount<=3);
  sheet?.classList.toggle('layout-bottom',teamCount>=4);
  const grid=$('teams-grid');
  grid.className='teams-grid count-'+Math.min(Math.max(teams.length,1),6);

  grid.innerHTML=teams.map((t,index)=>{
    const tm=members.filter(m=>String(m.team_id)===String(t.id));
    const rally=tm.filter(m=>m.member_role==='rally_lead');
    const joiners=tm.filter(m=>m.member_role==='joiner');
    const useDefense=!!t.use_defensive_heroes;
    const teamName=displayName(t.name)||`Team ${index+1}`;

    const rallyHtml=rally.length?rally.map(m=>{
      const windows=Array.isArray(m.pet_windows)?m.pet_windows:[];
      const petTimes=windows.map(petWindowText).filter(Boolean);
      const scheduleStart=(m.schedule_start_utc??'');
      const scheduleEnd=(m.schedule_end_utc??'');
      const rallySchedule=(scheduleStart!=='' && scheduleEnd!=='')
        ? `${String(scheduleStart).padStart(2,'0')}:00–${String(scheduleEnd).padStart(2,'0')}:00`
        : '';
      const fallbackPetSchedule=String(m.pet_schedule||'').trim();
      const timeText=rallySchedule||fallbackPetSchedule;
      const hasPet=petTimes.length>0||m.pets_active===true||m.pet_active===true;

      return `<div class="rally-entry">
        <div class="rally-info">
          <div class="rally-name-line">
            <span class="rally-name">${esc(displayName(m.player_name)||'—')}</span>
            ${timeText?`<span class="rally-time">${esc(timeText)}</span>`:''}
          </div>
          ${petTimes.length?`<div class="rally-pet-times">${esc(petTimes.join(', '))}</div>`:''}
        </div>
        <div class="rally-pet ${hasPet?'':'empty'}" title="Pet Active">🐾</div>
      </div>`;
    }).join(''):`<div class="rally-empty">No Rally Leaders assigned</div>`;

    const joinerHtml=joiners.length?joiners.map(m=>`<div class="joiner-row ${useDefense?'':'no-defense'}">
      <div class="joiner-player"><span>${esc(displayName(m.player_name)||'—')}</span></div>
      <div class="hero-cell">${heroMarkup(m.attack_hero)}</div>
      ${useDefense?`<div class="hero-cell">${heroMarkup(m.defensive_hero)}</div>`:''}
    </div>`).join(''):`<div class="joiner-row ${useDefense?'':'no-defense'}">
      <div class="joiner-player"><span>—</span></div><div class="hero-cell"><span class="hero-empty">—</span></div>${useDefense?'<div class="hero-cell"><span class="hero-empty">—</span></div>':''}
    </div>`;

    return `<section class="team-card">
      <div class="team-title">${esc(teamName)}</div>

      <div class="team-section-title">
        <span class="section-icon rally-icon">♜</span>
        <span>RALLY LEADERS</span>
      </div>
      <div class="rally-list">${rallyHtml}</div>

      <div class="team-section-title joiners-heading">
        <span class="section-icon joiner-icon"><svg class="joiner-person-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4.5 21c.4-5.1 3.1-8 7.5-8s7.1 2.9 7.5 8H4.5z"></path></svg></span>
        <span>JOINERS</span>
      </div>
      <div class="joiner-table">
        <div class="joiner-head ${useDefense?'':'no-defense'}">
          <div>JOINER</div><div>ATTACK</div>${useDefense?'<div>DEFENSE</div>':''}
        </div>
        ${joinerHtml}
      </div>
    </section>`;
  }).join('');
}

function normalizedFormationType(x){
  const raw=String(x.formation_type||'attack').toLowerCase();
  return raw.includes('def')?'defense':'attack';
}
function parseMaybeJSON(v){
  if(v==null)return v;
  if(typeof v!=='string')return v;
  const t=v.trim();
  if(!t)return null;
  try{return JSON.parse(t)}catch(_){return v}
}
function formationHeroes(x){
  if(x.formation_scope==='rally'){
    const cfg=parseMaybeJSON(x.hero_config)||{};
    const heroes=[
      cfg.infantry_hero, cfg.lancer_hero, cfg.marksman_hero,
      cfg.infantry, cfg.lancer, cfg.marksman,
      cfg.hero1, cfg.hero2, cfg.hero3
    ].filter(Boolean);
    return [...new Map(heroes.map(h=>[typeof h==='string'?h:JSON.stringify(h),h])).values()];
  }
  const rec=parseMaybeJSON(x.recommended_heroes);
  if(Array.isArray(rec))return rec.filter(Boolean);
  if(rec && typeof rec==='object')return Object.values(rec).filter(Boolean);
  return rec?[rec]:[];
}
function assignFormationSlots(rows){
  const counts={};
  return rows.map(x=>{
    const scope=x.formation_scope==='rally'?'rally':'joiner';
    const type=normalizedFormationType(x);
    const key=`${scope}:${type}`;
    counts[key]=(counts[key]||0)+1;

    // Existing saved names can still explicitly say Main or Alt.
    const n=String(x.name||'').toLowerCase();
    let variant;
    if(/\balt\b|alternative/.test(n))variant='Alt';
    else if(/\bmain\b/.test(n))variant='Main';
    else variant=counts[key]===1?'Main':'Alt';

    return {...x,_scope:scope,_type:type,_variant:variant};
  });
}
function formationCard(x){
  const heroes=formationHeroes(x);
  const title=`${x._variant} ${x._type==='defense'?'Defense':'Attack'}`;
  return `<div class="formation-card">
    <div class="formation-title">${esc(title)}</div>
    ${heroes.length?`<div class="formation-hero-list">${heroes.map(h=>heroMarkup(h,true)).join('')}</div>`:'<div class="formation-hero-list"></div>'}
    <div class="formation-ratio">${esc(x.infantry_pct)} / ${esc(x.lancer_pct)} / ${esc(x.marksman_pct)}</div>
  </div>`;
}
function renderFormations(rows){
  const box=$('formations');
  if(!rows.length){
    box.classList.add('is-empty');
    box.innerHTML='';
    return;
  }
  box.classList.remove('is-empty');

  const normalized=assignFormationSlots(rows);
  const joiner=normalized.filter(x=>x._scope==='joiner');
  const rally=normalized.filter(x=>x._scope==='rally');

  const group=(items,scope)=>{
    if(!items.length)return '';
    const label=scope==='joiner'?'JOINERS':'RALLY LEADERS';
    const icon=scope==='joiner'
      ? `<svg class="joiner-person-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4.5 21c.4-5.1 3.1-8 7.5-8s7.1 2.9 7.5 8H4.5z"></path></svg>`
      : '♜';

    // Keep additional Attack formations under Attack and Defense under Defense,
    // instead of stretching every formation across a new horizontal slot.
    const attack=items.filter(x=>x._type==='attack');
    const defense=items.filter(x=>x._type==='defense');
    const typeColumn=(typeItems,type)=>{
      if(!typeItems.length)return '';
      return `<div class="formation-type-column ${type}">
        ${typeItems.map(formationCard).join('')}
      </div>`;
    };

    const cols=(attack.length && defense.length)?'two-types':'one-type';
    return `<section class="formation-group ${scope}">
      <div class="formation-group-title"><span class="${scope==='joiner'?'joiner-icon':'rally-icon'}">${icon}</span>${label}</div>
      <div class="formation-type-columns ${cols}">
        ${typeColumn(attack,'attack')}
        ${typeColumn(defense,'defense')}
      </div>
    </section>`;
  };

  box.innerHTML=`
    <div class="formations-heading">FORMATIONS</div>
    <div class="formation-groups">
      ${group(joiner,'joiner')}
      ${group(rally,'rally')}
    </div>`;
}
function autoDensity(count){
  const mode=$('density').value;
  const compact=mode==='compact'||(mode==='auto'&&count>=5);
  $('sheet').classList.toggle('compact',compact);
}

async function loadBranding(){
  const PRESET_ACCENTS={
    forest_green:'#315f4b',ice_blue:'#5d88a8',royal_gold:'#a77a2b',ocean_teal:'#287b7b',
    soft_burgundy:'#884d5c',lavender:'#746b9d',slate_blue:'#536d96',sage:'#6f876b',
    dusty_rose:'#a66d78',steel:'#596579'
  };

  async function findLayoutIdentity(){
    const aid=String(allianceId||'').trim();
    const tag=String(allianceTag||'').trim();

    // First use the exact alliance_id opened by Team Builder.
    if(aid){
      const exact=await sb.from('alliance_layout_settings')
        .select('alliance_id,preset_key,emblem_data_url,updated_at')
        .eq('alliance_id',aid)
        .maybeSingle();
      if(!exact.error && exact.data) return exact.data;
    }

    // NEXA currently has duplicate alliance rows for some visible tags.
    // If the exact row has no identity, find all IDs with the same tag and use the newest saved identity.
    if(tag){
      const aliases=await sb.from('alliances')
        .select('id,tag')
        .ilike('tag',tag);
      const ids=(aliases.data||[]).map(a=>String(a.id)).filter(Boolean);
      if(ids.length){
        const found=await sb.from('alliance_layout_settings')
          .select('alliance_id,preset_key,emblem_data_url,updated_at')
          .in('alliance_id',ids)
          .order('updated_at',{ascending:false})
          .limit(1);
        if(!found.error && found.data?.length) return found.data[0];
      }
    }
    return null;
  }

  try{
    const layout=await findLayoutIdentity();
    if(layout){
      const accent=PRESET_ACCENTS[layout.preset_key]||PRESET_ACCENTS.forest_green;
      branding={
        ...branding,
        emblem_data_url:layout.emblem_data_url||'',
        template_style:'classic',
        colors:{...templateDefaults.classic,head:accent}
      };
      applyBranding();

      const sheet=$('sheet');
      if(sheet){
        sheet.style.setProperty('--accent',accent);
        sheet.style.setProperty('--team-head',accent);
      }
      document.querySelectorAll('#sheet .team-title').forEach(el=>el.style.backgroundColor=accent);

      const emblem=$('sheet-emblem');
      if(emblem){
        if(layout.emblem_data_url){
          emblem.src=layout.emblem_data_url;
          emblem.style.display='block';
        }else{
          emblem.removeAttribute('src');
          emblem.style.display='none';
        }
      }
      return;
    }
  }catch(layoutErr){
    console.warn('Alliance layout identity:',layoutErr?.message||layoutErr);
  }

  // Backward-compatible fallback only when Layout Management has no identity saved.
  const {data,error}=await sb.from('alliance_branding')
    .select('*')
    .eq('alliance_id',String(allianceId))
    .maybeSingle();

  if(error){
    console.warn(error.message);
    applyBranding();
    return;
  }
  if(data){
    branding={
      emblem_data_url:data.emblem_data_url||'',
      template_style:data.template_style||'classic',
      colors:{...templateDefaults[data.template_style||'classic'],...(data.colors||{})},
      font_family:data.font_family||branding.font_family,
      title_weight:String(data.title_weight||900),
      body_weight:String(data.body_weight||400)
    };
  }
  applyBranding();
}

function cloneLayoutSheet(){
  const source=$('sheet');
  const clone=source.cloneNode(true);
  clone.id='sheet-preview-clone';
  clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  return clone;
}

function naturalSheetSize(sheet){
  const prevTransform=sheet.style.transform;
  sheet.style.transform='none';
  const width=sheet.offsetWidth||sheet.scrollWidth||1400;
  const height=sheet.offsetHeight||sheet.scrollHeight||900;
  sheet.style.transform=prevTransform;
  return {width,height};
}

function fitInlineSheet(){
  const holder=$('sheet-inline-holder');
  const sheet=$('sheet');
  if(!holder||!sheet)return;
  sheet.style.zoom='';
  sheet.style.transform='none';
  holder.style.height='auto';
  const naturalWidth=sheet.offsetWidth||1400;
  const naturalHeight=sheet.scrollHeight||sheet.offsetHeight||900;
  const available=Math.max(280,holder.clientWidth||window.innerWidth-40);
  const scale=Math.min(1,available/naturalWidth);
  sheet.style.transform=`scale(${scale})`;
  holder.style.height=Math.ceil(naturalHeight*scale)+'px';
}

function fitPreviewSheet(){

  const sheet=holder?.querySelector('.sheet');

  holder.style.height='auto';

  const natural=naturalSheetSize(sheet);
  const available=Math.max(280,stage.clientWidth);
  const scale=Math.min(1,available/natural.width);

  sheet.style.transform=`scale(${scale})`;
  holder.style.height=Math.ceil(natural.height*scale)+'px';
}

async function ensureHtml2Canvas(){
  if(typeof window.html2canvas==='function')return true;
  const existing=document.querySelector('script[data-nexa-html2canvas="1"]');
  if(existing){
    await new Promise(resolve=>{
      if(typeof window.html2canvas==='function')return resolve();
      existing.addEventListener('load',resolve,{once:true});
      existing.addEventListener('error',resolve,{once:true});
    });
    return typeof window.html2canvas==='function';
  }
  return await new Promise(resolve=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.async=true;
    script.dataset.nexaHtml2canvas='1';
    script.onload=()=>resolve(typeof window.html2canvas==='function');
    script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
}

async function renderLayoutCanvas(){
  if(!(await ensureHtml2Canvas())) throw new Error('Download tool could not load. Check your connection and try again.');

  const source=$('sheet');
  if(!source) throw new Error('Layout was not found.');

  const exportHost=document.createElement('div');
  exportHost.dataset.nexaExportHost='1';
  exportHost.style.cssText='position:fixed;left:-20000px;top:0;width:1400px;z-index:-1;background:#fff;';
  const exportSheet=source.cloneNode(true);
  exportSheet.removeAttribute('id');
  exportSheet.style.transform='none';
  exportSheet.style.zoom='1';
  exportSheet.style.position='relative';
  exportSheet.style.left='0';
  exportSheet.style.top='0';
  exportSheet.style.margin='0';

  const exportStyle=getComputedStyle(source);
  ['--sheet-bg','--sheet-text','--sheet-muted','--team-head','--section-bg','--pet',
   '--sheet-border','--sheet-font','--title-weight','--body-weight','--accent'].forEach(name=>{
    const value=exportStyle.getPropertyValue(name).trim();
    if(value) exportSheet.style.setProperty(name,value);
  });

  exportHost.appendChild(exportSheet);
  document.body.appendChild(exportHost);

  try{
    // Wait for emblem/hero images before capturing.
    const images=[...exportSheet.querySelectorAll('img')];
    await Promise.all(images.map(img=>{
      if(img.complete)return Promise.resolve();
      return new Promise(resolve=>{
        img.addEventListener('load',resolve,{once:true});
        img.addEventListener('error',resolve,{once:true});
        setTimeout(resolve,2500);
      });
    }));

    return await window.html2canvas(exportSheet,{
      backgroundColor:'#ffffff',
      scale:3,
      useCORS:true,
      allowTaint:false,
      logging:false,
      scrollX:0,
      scrollY:0,
      width:Math.ceil(exportSheet.scrollWidth||1400),
      height:Math.ceil(exportSheet.scrollHeight||exportSheet.offsetHeight||900),
      windowWidth:1600,
      windowHeight:Math.max(1000,Math.ceil(exportSheet.scrollHeight||900))
    });
  }finally{
    exportHost.remove();
  }
}

function exportFileBase(){
  const safeAlliance=String(allianceTag||'Alliance').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'')||'Alliance';
  const safeEvent=String(eventType||'event').replace(/[^a-z0-9_-]+/gi,'-');
  return `${safeAlliance}-${safeEvent}-team-layout`;
}

async function saveBlob(blob,filename,mime){
  // On iPhone/iPad, Share Sheet is substantially more reliable than a hidden
  // anchor and lets the user Save Image / Save to Files.
  try{
    if(typeof File==='function' && navigator.canShare && navigator.share){
      const file=new File([blob],filename,{type:mime});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:filename});
        return true;
      }
    }
  }catch(err){
    if(err?.name==='AbortError') return true;
  }

  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  link.rel='noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),15000);
  return true;
}

async function downloadLayout(){
  setExportStatus('Preparing PNG…');
  try{
    const canvas=await renderLayoutCanvas();
    const blob=await new Promise((resolve,reject)=>{
      canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not create PNG image.')),'image/png',1);
    });
    await saveBlob(blob,exportFileBase()+'.png','image/png');
    setExportStatus('PNG ready ✓','success');
  }catch(error){
    document.querySelectorAll('[data-nexa-export-host="1"]').forEach(el=>el.remove());
    console.error('Layout PNG error',error);
    setExportStatus('Could not create PNG. '+(error?.message||''),'error');
  }
}

async function ensureJsPdf(){
  if(window.jspdf?.jsPDF)return true;
  return await new Promise(resolve=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    script.async=true;
    script.onload=()=>resolve(!!window.jspdf?.jsPDF);
    script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
}

async function downloadLayoutPdf(){
  setExportStatus('Preparing PDF…');
  try{
    const [canvas,pdfReady]=await Promise.all([renderLayoutCanvas(),ensureJsPdf()]);
    if(!pdfReady)throw new Error('PDF tool could not load.');
    const {jsPDF}=window.jspdf;
    const orientation=canvas.width>=canvas.height?'landscape':'portrait';
    const pdf=new jsPDF({orientation,unit:'px',format:[canvas.width,canvas.height],hotfixes:['px_scaling']});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',0,0,canvas.width,canvas.height);
    const blob=pdf.output('blob');
    await saveBlob(blob,exportFileBase()+'.pdf','application/pdf');
    setExportStatus('PDF ready ✓','success');
  }catch(error){
    document.querySelectorAll('[data-nexa-export-host="1"]').forEach(el=>el.remove());
    console.error('Layout PDF error',error);
    setExportStatus('Could not create PDF. '+(error?.message||''),'error');
  }
}

<script id="nexa-template-v15-preview-root-fix">
(function(){

    const imp=(document.getElementById('important-notes')?.value||'').trim();
    const notes=(document.getElementById('layout-notes')?.value||'').trim();

    const ib=document.getElementById('sheet-important');
    const it=document.getElementById('sheet-important-text');

    if(nb&&nt){
      nt.textContent=notes;
      nb.classList.remove('hidden');
      nb.style.display='block';
    }

    const sheet=document.getElementById('sheet');
    if(!sheet)return false;

    const clone=sheet.cloneNode(true);
    // Keep the selected alliance preset/emblem identity in Preview.
    const sourceStyle=getComputedStyle(sheet);
    ['--sheet-bg','--sheet-text','--sheet-muted','--team-head','--section-bg','--pet',
     '--sheet-border','--sheet-font','--title-weight','--body-weight','--accent'].forEach(name=>{

    clone.style.setProperty('position','relative','important');
    clone.style.setProperty('left','auto','important');
    clone.style.setProperty('top','auto','important');
    clone.style.setProperty('margin','0 auto','important');

    const styles=[...document.querySelectorAll('style,link[rel="stylesheet"]')]
      .map(el=>el.outerHTML).join('\n');

    try{

        html:clone.outerHTML,
        styles
      }));
      return true;
    }catch(_){
      return false;
    }
  }

  function installPreviewButton(){
    const oldBtn=document.getElementById('preview-layout');
    if(!oldBtn || oldBtn.dataset.v15==='1')return;

    // Cloning removes ALL prior event listeners that were scrolling to the inline preview.
    const btn=oldBtn.cloneNode(true);
    btn.dataset.v15='1';
    oldBtn.replaceWith(btn);

    btn.addEventListener('click',function(ev){
      ev.preventDefault();
      ev.stopPropagation();

      if(!preparePreviewPayload()){
        const status=document.getElementById('export-status');
        if(status)status.textContent='Could not prepare the preview.';

      // Open from the top window directly inside the real user click.

      }
    });

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',installPreviewButton);

  window.addEventListener('load',installPreviewButton);
})();
</script>

    const client=(typeof sb!=='undefined' && sb) ? sb : window.supabaseClient;
    if(!client || typeof client.from!=='function') return null;

    const params=window.NEXA_NATIVE_PARAMS || new URLSearchParams(location.search);
    const aid=String(window.allianceId || params.get('alliance_id') || '').trim();
    const tag=String(window.allianceTag || params.get('alliance_tag') || '').trim();

    // 1) Prefer the exact alliance row used by this Team Builder.
    if(aid){
      const exact=await client.from('alliance_layout_settings')
        .select('alliance_id,preset_key,emblem_data_url,updated_at')
        .eq('alliance_id',aid)
        .maybeSingle();
      if(!exact.error && exact.data) return exact.data;
    }

    // 2) Duplicate alliance rows exist in this NEXA database.
    // Resolve every database ID with the same visible tag, then use the newest saved identity.
    if(tag){
      const aliases=await client.from('alliances')
        .select('id,tag')
        .ilike('tag',tag);
      const ids=(aliases.data||[]).map(x=>String(x.id)).filter(Boolean);
      if(ids.length){
        const found=await client.from('alliance_layout_settings')
          .select('alliance_id,preset_key,emblem_data_url,updated_at')
          .in('alliance_id',ids)
          .order('updated_at',{ascending:false})
          .limit(1);
        if(!found.error && found.data?.length) return found.data[0];
      }
    }
    return null;
  }

  function applyIdentity(row){
    if(!row)return;
    const accent=PRESETS[row.preset_key]||PRESETS.forest_green;
    const sheet=document.getElementById('sheet');
    if(sheet){
      sheet.style.setProperty('--accent',accent);
      sheet.style.setProperty('--team-head',accent);
    }
    document.querySelectorAll('#sheet .team-title').forEach(el=>el.style.backgroundColor=accent);
    document.querySelectorAll('#sheet .rally-icon,#sheet .formation-group.rally .formation-title,#sheet .formation-group.rally .formation-group-title')
      .forEach(el=>el.style.color=accent);

    const img=document.getElementById('sheet-emblem');
    if(img){
      if(row.emblem_data_url){
        img.src=row.emblem_data_url;
        img.style.display='block';
      }else{
        img.removeAttribute('src');
        img.style.display='none';
      }
    }

    // Keep existing builder branding state in sync so later rerenders don't revert it.
    try{
      if(typeof branding==='object' && branding){
        branding.emblem_data_url=row.emblem_data_url||'';
        branding.colors={...(branding.colors||{}),head:accent};
      }
    }catch(_){}

    if(typeof window.fitInlineSheet==='function'){
      requestAnimationFrame(()=>window.fitInlineSheet());
    }
  }

  async function run(){
    try{ applyIdentity(await resolveIdentity()); }catch(e){ console.warn('NEXA alliance identity resolve',e); }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(run,350));
  else setTimeout(run,350);
  window.addEventListener('load',()=>setTimeout(run,550));
})();
</script>


<script id="nexa-identity-reapply-after-render">
(function(){
  async function reapply(){
    try{
      if(typeof loadBranding==='function') await loadBranding();
      if(typeof fitInlineSheet==='function') requestAnimationFrame(()=>fitInlineSheet());
    }catch(e){console.warn('NEXA identity reapply',e);}
  }
  window.addEventListener('load',()=>setTimeout(reapply,700));
  document.addEventListener('DOMContentLoaded',()=>setTimeout(reapply,500));
  document.getElementById('preview-layout')?.addEventListener('click',()=>setTimeout(reapply,50));
})();
</script>
