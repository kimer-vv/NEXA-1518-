<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA • Forms Center</title><link rel="stylesheet" href="style.css"><style>
:root{--fc-accent:#48ddff;--fc-accent2:#6d82ff;--fc-muted:#aeb7d1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 22%,rgba(44,194,255,.08),transparent 28%),radial-gradient(circle at 95% 8%,rgba(104,78,255,.10),transparent 32%),#02030b;color:#fff}.fc-shell{width:min(760px,100%);min-height:100dvh;margin:0 auto;padding:26px 18px 90px;position:relative}.fc-shell:before{content:"";position:fixed;left:max(18px,calc((100vw - 760px)/2 + 18px));top:170px;bottom:110px;width:3px;border-radius:99px;background:linear-gradient(180deg,var(--fc-accent),#6f68ff 62%,transparent);box-shadow:0 0 18px rgba(72,221,255,.42);pointer-events:none}.fc-top{display:grid;grid-template-columns:48px 1fr 48px;gap:12px;align-items:center;margin-bottom:22px}.fc-round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(72,221,255,.36);background:rgba(8,19,41,.82);color:#bff6ff;font-size:28px;font-weight:900;display:grid;place-items:center;text-decoration:none}.fc-close{border-color:rgba(255,103,186,.55);background:rgba(63,11,53,.66);color:#ff8bd0;font-size:24px}.fc-titlewrap{text-align:center}.fc-kicker{color:#aab4d1;font-size:10px;font-weight:950;letter-spacing:.20em}.fc-titlewrap h1{margin:5px 0 0;font-size:clamp(2rem,8vw,3rem);line-height:1}.fc-info{width:36px;height:36px;margin:0 auto 10px;border-radius:50%;border:1px solid rgba(72,221,255,.60);display:grid;place-items:center;color:var(--fc-accent);font-weight:950;background:rgba(4,13,31,.72)}.fc-nav{display:flex;justify-content:center;gap:12px;margin:10px 0 18px}.fc-nav button{width:76px;height:52px;border-radius:28px;border:1px solid rgba(109,130,255,.45);background:rgba(7,11,31,.80);color:#dbe5ff;font-size:28px;font-weight:900}.fc-nav button:disabled{opacity:.22}.fc-description{margin:0 8px 26px 26px;padding:16px 18px;border:1px solid rgba(91,220,255,.30);border-radius:20px;background:linear-gradient(145deg,rgba(8,20,40,.80),rgba(8,8,27,.90));color:var(--fc-muted);line-height:1.48;font-weight:650}.fc-list{display:grid;gap:14px;margin-left:26px}.fc-card{padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:linear-gradient(145deg,rgba(9,17,38,.88),rgba(6,7,21,.96))}.fc-card .tag{color:#9ca9cc;font-size:10px;font-weight:950;letter-spacing:.16em}.fc-card h2{margin:6px 0 7px;font-size:1.45rem}.fc-card p{margin:0;color:var(--fc-muted);line-height:1.46}.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.fc-actions a,.fc-actions button{min-height:46px;padding:11px 12px;border-radius:15px;border:1px solid rgba(72,221,255,.36);background:linear-gradient(135deg,rgba(25,76,112,.72),rgba(36,30,97,.80));color:#fff;text-decoration:none;font-weight:900;font-size:.88rem;text-align:center}.fc-actions button{background:rgba(8,14,35,.76);color:var(--fc-accent)}.fc-status{min-height:18px;margin-top:8px;color:#82f0ff;font-size:.78rem}.fc-empty{padding:22px;border:1px dashed rgba(72,221,255,.22);border-radius:20px;color:var(--fc-muted)}.fc-guide{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:18px;background:rgba(0,2,13,.86);backdrop-filter:blur(9px)}.fc-guide.hidden{display:none}.fc-guide-card{width:min(520px,100%);padding:20px;border:1px solid rgba(72,221,255,.38);border-radius:24px;background:linear-gradient(155deg,#0b1531,#050817)}.fc-guide-close{float:right;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#0c1330;color:#fff;font-size:18px}@media(max-width:560px){.fc-shell{padding-left:14px;padding-right:14px}.fc-shell:before{left:18px}.fc-description,.fc-list{margin-left:18px}}
</style></head><body><main class="fc-shell"><div class="fc-top"><a class="fc-round" href="index.html">‹</a><div class="fc-titlewrap"><button id="guide-open" class="fc-info" type="button">i</button><div class="fc-kicker">FORMS CENTER</div><h1 id="section-title">SvS</h1></div><a class="fc-round fc-close" href="index.html">×</a></div><div class="fc-nav"><button id="prev">‹</button><button id="next">›</button></div><section id="description" class="fc-description"></section><section id="content" class="fc-list"></section></main><div id="guide" class="fc-guide hidden"><div class="fc-guide-card"><button id="guide-close" class="fc-guide-close">×</button><h2>Forms Center</h2><p>Forms Center is NEXA’s central hub for event sign-ups, applications and surveys. Open, share and edit connected forms from one place.</p></div></div><script>
(()=>{'use strict';const SECTIONS=[{key:'svs',title:'SvS',desc:'SvS forms for Preparation Phase and Battle Phase. Forms remain visible here even when an SvS event is not currently live.',cards:[{tag:'SVS • BATTLE PHASE',title:'Battle Sign-Up',desc:'Submit Battle Phase availability and combat information.',href:'battle-form.html?direct=1&event_type=svs',edit:'battle-settings.html?event_type=svs'},{tag:'SVS • PREPARATION PHASE',title:'Ministry Sign-Up',desc:'Request VP or MOE appointments for Construction, Research and Training days.',href:'ministry-signup.html?direct=1',edit:'ministry-settings.html'}]},{key:'fdt',title:'FDT',desc:'Frostdragon Tyrant sign-ups, readiness and response workflows.',cards:[{tag:'FDT • FROSTDRAGON TYRANT',title:'FDT Sign-Up',desc:'Submit FDT availability, Battle Role and battle-readiness information. NEXA Profile data stays connected for later Battle Planning.',href:'fdt-form.html?direct=1',edit:'fdt-settings.html'}]},{key:'tal',title:'TAL',desc:'TAL sign-ups and response workflows will live in this section.',coming:'TAL Sign-Up is reserved for the TAL workflow.'},{key:'transfer',title:'Transfer',desc:'Transfer applications remain connected to the existing NEXA Transfer workflow.',cards:[{tag:'TRANSFER',title:'Transfer Application',desc:'Open the current Transfer application workflow.',href:'transfer-application.html'}]},{key:'surveys',title:'Surveys',desc:'Leadership surveys and reusable questionnaires will live in this section.',coming:'Survey forms will appear here as they are created.'}];const qs=new URLSearchParams(location.search),$=id=>document.getElementById(id);let index=Math.max(0,SECTIONS.findIndex(x=>x.key===(qs.get('section')||'svs')));function cardHtml(c){return `<article class="fc-card"><div class="tag">${c.tag}</div><h2>${c.title}</h2><p>${c.desc}</p><div class="fc-actions"><a href="${c.href}">Open Form</a><button type="button" data-copy="${c.href}">Copy Link</button><button type="button" data-publish="${c.title}">Publish to NEXA</button>${c.edit?`<a href="${c.edit}">Edit Form</a>`:`<button type="button" disabled>Edit Form</button>`}</div><div class="fc-status"></div></article>`}function render(){const s=SECTIONS[index];$('section-title').textContent=s.title;$('description').textContent=s.desc;$('prev').disabled=index===0;$('next').disabled=index===SECTIONS.length-1;$('content').innerHTML=s.cards?.map(cardHtml).join('')||`<div class="fc-empty">${s.coming||'No forms in this section yet.'}</div>`;history.replaceState(null,'',`forms-center.html?section=${s.key}`)}$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<SECTIONS.length-1){index++;render()}};document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){const url=new URL(copy.dataset.copy,location.href).href,status=copy.closest('.fc-card')?.querySelector('.fc-status');try{await navigator.clipboard.writeText(url);if(status)status.textContent='Link copied ✓'}catch{if(status)status.textContent=url}}const pub=e.target.closest('[data-publish]');if(pub){const status=pub.closest('.fc-card')?.querySelector('.fc-status');if(status)status.textContent='Publish to NEXA is reserved for the publishing workflow.'}});$('guide-open').onclick=()=>$('guide').classList.remove('hidden');$('guide-close').onclick=()=>$('guide').classList.add('hidden');$('guide').onclick=e=>{if(e.target===$('guide'))$('guide').classList.add('hidden')};render()})();
</script></body></html>
