<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA • Edit Transfer Application</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="nebula-bg" aria-hidden="true"></div><div class="starfield" aria-hidden="true"></div>
<header class="topbar"><div class="shell nav"><a class="logo" href="index.html"><span class="star">✦</span><span>NEXA<small>STATE 1518 • TRANSFERS</small></span></a></div></header>
<main class="shell event-page">
  <a class="back" href="javascript:history.back()">← Back</a>
  <section id="unlock-card" class="glass" style="margin-top:16px">
    <span class="badge">PRIVATE APPLICATION EDIT</span>
    <h1>Edit My Application</h1>
    <p class="muted">Enter the Application ID and private Edit Token you received when you submitted.</p>
    <form id="unlock-form" class="account-form">
      <label>Application ID<input id="app-id" required autocomplete="off"></label>
      <label>Edit Token<input id="edit-token-input" required autocomplete="off"></label>
      <button class="btn" type="submit">Open My Application</button>
      <p id="unlock-message" class="form-message"></p>
    </form>
  </section>

  <section id="edit-card" class="glass hidden" style="margin-top:14px">
    <h2 id="identity-title">Application</h2>
    <p class="muted">Application ID is system-generated and cannot be changed. You may correct your Player ID if needed.</p>
    <form id="edit-form" class="account-form">
      <label>Player ID<input id="self-player-id"></label>
      <label>Discord / Contact<input id="discord"></label>
      <label>Current Alliance<input id="alliance"></label>
      <label>Coordinates<input id="coordinates" placeholder="X:123 Y:456"></label>
      <label>Total Power<input id="power" inputmode="numeric"><div id="power-preview" class="info-box"></div></label>
      <label>Furnace Level<input id="furnace"></label>
      <label>Transfer Passes<input id="passes"></label>
      <label>Account Progression<select id="progression"><option value="actively_progressing">Still actively progressing</option><option value="highly_developed">Highly developed / Near max / Maxed</option><option value="not_sure">Not sure</option></select></label>
      <label id="leader-q">Did a State 1518 leader ask you to provide your Labyrinth Score?<select id="leader-request"><option value="no">No</option><option value="yes">Yes</option></select></label>
      <label id="lab-wrap" class="hidden">Labyrinth Score<input id="labyrinth" inputmode="numeric"></label>
      <fieldset><legend>Advanced Troops</legend>
        <label class="check"><input id="t12i" type="checkbox"> T12 Exalted Infantry</label>
        <label class="check"><input id="t12l" type="checkbox"> T12 Exalted Lancers</label>
        <label class="check"><input id="t12m" type="checkbox"> T12 Exalted Marksmen</label>
        <label class="check"><input id="t11i" type="checkbox"> T11 Helios Infantry</label>
        <label class="check"><input id="t11l" type="checkbox"> T11 Helios Lancers</label>
        <label class="check"><input id="t11m" type="checkbox"> T11 Helios Marksmen</label>
        <label class="check"><input id="noadv" type="checkbox"> I do not currently have T11 or T12 troops</label>
      </fieldset>
      <button class="btn" type="submit">Save My Changes</button>
      <p id="edit-message" class="form-message"></p>
    </form>
  </section>
</main>
<script>
const sb=window.supabase.createClient(
  "https://dfxcxboxrkfmrnsgpyin.supabase.co",
  "sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-"
);

const q=new URLSearchParams(location.search);
const eventToken=q.get('token') || sessionStorage.getItem('nexa_transfer_event_token') || '';

const ui={
  unlockCard:document.getElementById('unlock-card'),
  unlockForm:document.getElementById('unlock-form'),
  appId:document.getElementById('app-id'),
  token:document.getElementById('edit-token-input'),
  unlockMessage:document.getElementById('unlock-message'),
  editCard:document.getElementById('edit-card'),
  identityTitle:document.getElementById('identity-title'),
  editForm:document.getElementById('edit-form'),
  editMessage:document.getElementById('edit-message'),
  playerId:document.getElementById('self-player-id'),
  discord:document.getElementById('discord'),
  alliance:document.getElementById('alliance'),
  coordinates:document.getElementById('coordinates'),
  power:document.getElementById('power'),
  powerPreview:document.getElementById('power-preview'),
  furnace:document.getElementById('furnace'),
  passes:document.getElementById('passes'),
  progression:document.getElementById('progression'),
  leaderQ:document.getElementById('leader-q'),
  leaderRequest:document.getElementById('leader-request'),
  labWrap:document.getElementById('lab-wrap'),
  labyrinth:document.getElementById('labyrinth'),
  t12i:document.getElementById('t12i'),
  t12l:document.getElementById('t12l'),
  t12m:document.getElementById('t12m'),
  t11i:document.getElementById('t11i'),
  t11l:document.getElementById('t11l'),
  t11m:document.getElementById('t11m'),
  noadv:document.getElementById('noadv')
};

let currentAppId='';
let currentEditToken='';

function syncLab(){
  const auto=ui.progression.value==='highly_developed';
  ui.leaderQ.classList.toggle('hidden',auto);
  const needed=auto || ui.leaderRequest.value==='yes';
  ui.labWrap.classList.toggle('hidden',!needed);
  ui.labyrinth.required=needed;
}

function syncPower(){
  ui.power.value=ui.power.value.replace(/\D/g,'');
  const n=Number(ui.power.value||0);
  ui.powerPreview.innerHTML=n
    ?`Readable preview: <b>${n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n}</b>`
    :'';
}

const advanced=[ui.t12i,ui.t12l,ui.t12m,ui.t11i,ui.t11l,ui.t11m];
ui.noadv.addEventListener('change',()=>{
  if(ui.noadv.checked) advanced.forEach(x=>{x.checked=false;x.disabled=true;});
  else advanced.forEach(x=>x.disabled=false);
});
advanced.forEach(x=>x.addEventListener('change',()=>{
  if(x.checked){
    ui.noadv.checked=false;
    advanced.forEach(y=>y.disabled=false);
  }
}));
ui.progression.addEventListener('change',syncLab);
ui.leaderRequest.addEventListener('change',syncLab);
ui.power.addEventListener('input',syncPower);

async function openApplication(){
  ui.unlockMessage.textContent='Checking…';

  currentAppId=ui.appId.value.trim();
  currentEditToken=ui.token.value.trim();

  if(!eventToken){
    ui.unlockMessage.textContent='This edit link is missing the Transfer Event token. Open Edit My Application from the Transfer Form or Transfer Event page.';
    return;
  }
  if(!currentAppId || !currentEditToken){
    ui.unlockMessage.textContent='Enter both your Application ID and Edit Token.';
    return;
  }

  const {data,error}=await sb.rpc('get_transfer_application_for_edit',{
    p_event_token:eventToken,
    p_application_id:currentAppId,
    p_edit_token:currentEditToken
  });

  if(error){
    ui.unlockMessage.textContent=error.message;
    return;
  }

  let row=data;
  if(typeof row==='string'){
    try{row=JSON.parse(row);}catch(_){}
  }
  if(!row || typeof row!=='object'){
    ui.unlockMessage.textContent='Application could not be loaded.';
    return;
  }

  ui.identityTitle.textContent=`${row.in_game_name||'Application'} • ${row.application_id||currentAppId}`;
  ui.playerId.value=row.player_id||'';
  ui.discord.value=row.discord_username||'';
  ui.alliance.value=row.current_alliance||'';
  ui.coordinates.value=row.coordinates||'';
  ui.power.value=row.current_power||'';
  ui.furnace.value=row.furnace_level||'';
  ui.passes.value=row.transfer_passes||'';
  ui.progression.value=row.account_progression||'actively_progressing';
  ui.leaderRequest.value=row.leader_requested_labyrinth?'yes':'no';
  ui.labyrinth.value=row.labyrinth_score??'';
  ui.t12i.checked=!!row.t12_infantry;
  ui.t12l.checked=!!row.t12_lancer;
  ui.t12m.checked=!!row.t12_marksman;
  ui.t11i.checked=!!row.t11_infantry;
  ui.t11l.checked=!!row.t11_lancer;
  ui.t11m.checked=!!row.t11_marksman;
  ui.noadv.checked=!!row.no_t11_t12;

  advanced.forEach(x=>x.disabled=ui.noadv.checked);
  syncLab();
  syncPower();

  ui.unlockMessage.textContent='';
  ui.unlockCard.classList.add('hidden');
  ui.editCard.classList.remove('hidden');
  window.scrollTo({top:0,left:0,behavior:'auto'});
}

ui.unlockForm.addEventListener('submit',async e=>{
  e.preventDefault();
  e.stopPropagation();
  await openApplication();
});

ui.editForm.addEventListener('submit',async e=>{
  e.preventDefault();
  e.stopPropagation();

  ui.editMessage.textContent='Saving…';

  if((ui.progression.value==='highly_developed' || ui.leaderRequest.value==='yes') && !ui.labyrinth.value){
    ui.editMessage.textContent='Labyrinth Score is required for this application.';
    return;
  }

  const payload={
    player_id:ui.playerId.value.trim(),
    discord_username:ui.discord.value.trim(),
    current_alliance:ui.alliance.value.trim(),
    coordinates:ui.coordinates.value.trim(),
    current_power:ui.power.value,
    furnace_level:ui.furnace.value.trim(),
    transfer_passes:ui.passes.value.trim(),
    account_progression:ui.progression.value,
    leader_requested_labyrinth:ui.leaderRequest.value==='yes',
    labyrinth_score:ui.labyrinth.value||null,
    t12_infantry:ui.t12i.checked,
    t12_lancer:ui.t12l.checked,
    t12_marksman:ui.t12m.checked,
    t11_infantry:ui.t11i.checked,
    t11_lancer:ui.t11l.checked,
    t11_marksman:ui.t11m.checked,
    no_t11_t12:ui.noadv.checked
  };

  const {error}=await sb.rpc('update_transfer_application_by_token',{
    p_event_token:eventToken,
    p_application_id:currentAppId,
    p_edit_token:currentEditToken,
    p_payload:payload
  });

  ui.editMessage.textContent=error ? error.message : 'Application updated ✓';
});

// Prefill from the immediately preceding successful submission.
const savedId=sessionStorage.getItem('nexa_transfer_edit_application_id')||'';
const savedToken=sessionStorage.getItem('nexa_transfer_edit_token')||'';
if(savedId) ui.appId.value=savedId;
if(savedToken) ui.token.value=savedToken;
</script>

<script>
(function(){
  const lang=(navigator.language||'en').toLowerCase();
  if(!lang.startsWith('es'))return;
  const labels=[...document.querySelectorAll('label')];
  document.querySelector('#unlock-card h1').textContent='Editar mi solicitud';
  document.querySelector('#unlock-card .muted').textContent='Ingresa el Application ID y el Edit Token privado que recibiste al enviar tu solicitud.';
  document.querySelector('#unlock-form button').textContent='Abrir mi solicitud';
  const back=document.querySelector('.back');if(back)back.textContent='← Volver';
  const note=document.querySelector('#edit-card .muted');if(note)note.textContent='El Application ID lo genera el sistema y no se puede cambiar. Puedes corregir tu Player ID si es necesario.';
  const save=document.querySelector('#edit-form button[type="submit"]');if(save)save.textContent='Guardar cambios';
})();
</script>

</body></html>
