<!doctype html><!-- NEXA FORMS CENTER V5.0 — TAL + DEADLINE COUNTDOWNS --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA • Forms Center</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/nexa-form-runtime-v1.js?v=1" defer></script><style>
    :root{--a:#48ddff;--m:#aeb7d1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 22%,rgba(44,194,255,.08),transparent 28%),radial-gradient(circle at 95% 8%,rgba(104,78,255,.10),transparent 32%),#02030b;color:#fff}.sh{width:min(760px,100%);margin:auto;padding:26px 18px 90px}.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px}.round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(72,221,255,.36);background:#081329;color:#bff6ff;display:grid;place-items:center;text-decoration:none;font-size:28px}.title{text-align:center}.title small{color:#aab4d1;font-size:10px;font-weight:950;letter-spacing:.2em}.title h1{margin:5px 0;font-size:clamp(2rem,8vw,3rem)}.nav{display:flex;justify-content:center;gap:12px;margin:14px}.nav button{width:76px;height:52px;border-radius:28px;border:1px solid rgba(109,130,255,.45);background:#070b1f;color:#fff;font-size:28px}.desc,.card{margin-left:18px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(9,17,38,.82);padding:16px}.desc{color:var(--m);margin-bottom:16px}.list{display:grid;gap:14px}.tag{font-size:10px;letter-spacing:.15em;color:#9ca9cc;font-weight:950}.card h2{margin:6px 0}.card p{color:var(--m)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions a,.actions button{min-height:46px;border-radius:14px;border:1px solid rgba(72,221,255,.36);background:linear-gradient(135deg,rgba(25,76,112,.72),rgba(36,30,97,.8));color:#fff;text-decoration:none;font-weight:900;display:grid;place-items:center}.deadline{margin-top:10px}.status{font-size:12px;color:#82f0ff;min-height:18px;margin-top:7px}</style></head><body><main class="sh"><div class="top"><a class="round" href="index.html">‹</a><div class="title"><small>FORMS CENTER</small><h1 id="title">SvS</h1></div><a class="round" href="index.html">×</a></div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div><div id="desc" class="desc"></div><div id="list" class="list"></div></main><script>
    (()=>{'use strict';const SB=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');const S=[{k:'svs',t:'SvS',d:'SvS forms for Preparation Phase and Battle Phase.',c:[['SVS • BATTLE PHASE','Battle Sign-Up','Submit Battle Phase availability and combat information.','battle-form.html?direct=1&event_type=svs','battle-settings.html?event_type=svs','svs'],['SVS • PREPARATION PHASE','Ministry Sign-Up','Request VP or MOE appointments for Construction, Research and Training days.','ministry-signup.html?direct=1','ministry-settings.html','']]},{k:'fdt',t:'FDT',d:'Frostdragon Tyrant Sign-Ups.',c:[['FDT • FROSTDRAGON TYRANT','FDT Sign-Up','Submit FDT availability, Battle Role and battle-readiness information.','fdt-form.html?direct=1','fdt-settings.html','fdt']]},{k:'tal',t:'TAL',d:'Tundra Arms League Sign-Ups.',c:[['TAL • TUNDRA ARMS LEAGUE','TAL Sign-Up','Submit availability for every tournament round and TAL battle information.','tal-form.html?direct=1','tal-settings.html','tal']]},{k:'transfer',t:'Transfer',d:'Transfer applications.',c:[['TRANSFER','Transfer Application','Open the current Transfer application workflow.','transfer-application.html','','']]},{k:'surveys',t:'Surveys',d:'Leadership surveys and reusable questionnaires.',c:[]}];const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let i=Math.max(0,S.findIndex(x=>x.k===(q.get('section')||'svs'))),templates={};function left(s){if(!s?.deadline_enabled||!s.deadline_at)return'';const ms=new Date(s.deadline_at)-Date.now();if(ms<=0)return'<span class="nexa-deadline-badge closed">CLOSED</span>';const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60,t=ms<=86400000?'red':ms<=4*86400000?'yellow':'green';return `<span class="nexa-deadline-badge ${t}">Deadline · ${d?d+'D '+h+'H':h+'H '+m+'M'}</span>`}function card(c){const set=templates[c[5]]?.settings;return `<article class="card"><div class="tag">${
