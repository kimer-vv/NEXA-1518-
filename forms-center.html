<style>
:root{--a:#48ddff;--m:#aeb7d1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 22%,rgba(44,194,255,.08),transparent 28%),radial-gradient(circle at 95% 8%,rgba(104,78,255,.10),transparent 32%),#02030b;color:#fff}.sh{width:min(760px,100%);margin:auto;padding:26px 18px 90px}.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px}.round{width:48px;height:48px;border-radius:50%;border:1px solid rgba(72,221,255,.36);background:#081329;color:#bff6ff;display:grid;place-items:center;text-decoration:none;font-size:28px}.title{text-align:center}.title small{color:#aab4d1;font-size:10px;font-weight:950;letter-spacing:.2em}.title h1{margin:5px 0;font-size:clamp(2rem,8vw,3rem)}.nav{display:flex;justify-content:center;gap:12px;margin:14px}.nav button{width:76px;height:52px;border-radius:28px;border:1px solid rgba(109,130,255,.45);background:#070b1f;color:#fff;font-size:28px}.desc,.card{margin-left:18px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(9,17,38,.82);padding:16px}.desc{color:var(--m);margin-bottom:16px}.list{display:grid;gap:14px}.tag{font-size:10px;letter-spacing:.15em;color:#9ca9cc;font-weight:950}.card h2{margin:6px 0}.card p{color:var(--m)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions a,.actions button{min-height:46px;border-radius:14px;border:1px solid rgba(72,221,255,.36);background:linear-gradient(135deg,rgba(25,76,112,.72),rgba(36,30,97,.8));color:#fff;text-decoration:none;font-weight:900;display:grid;place-items:center;text-align:center;padding:8px}.actions button:disabled,.actions a.disabled{opacity:.42;pointer-events:none}.actions .danger{border-color:rgba(255,90,120,.38);background:linear-gradient(135deg,rgba(105,27,52,.55),rgba(61,30,80,.68))}.actions .restore{border-color:rgba(84,240,181,.4);background:linear-gradient(135deg,rgba(23,92,71,.55),rgba(31,64,96,.68))}.deadline{margin-top:10px}.status{font-size:12px;color:#8 .nexa-access-modal{position:fixed;inset:0;z-index:2147483200;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.76)}.nexa-access-card{width:min(445px,100%);padding:19px;border:1px solid rgba(72,221,255,.34);border-radius:22px;background:linear-gradient(180deg,rgba(9,17,38,.99),rgba(4,9,24,.99));box-shadow:0 24px 80px rgba(0,0,0,.55);color:#fff}.nexa-access-card h3{margin:0 0 8px}.nexa-access-card p{color:#aeb7d1;line-height:1.45;margin:7px 0}.nexa-access-card .warn{padding:10px 11px;border-radius:14px;background:rgba(255,90,120,.09);border:1px solid rgba(255,90,120,.22);color:#ffd1dc}.nexa-access-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.nexa-access-actions button{min-height:46px;border-radius:14px;border:1px solid rgba(72,221,255,.36);background:linear-gradient(135deg,rgba(25,76,112,.72),rgba(36,30,97,.8));color:#fff;font-weight:950}.nexa-access-actions .cancel{background:rgba(255,255,255,.05)}
</style></head><body><main class="sh">
<div class="top"><a class="round" href="index.html">‹</a><div class="title"><small>FORMS CENTER</small><h1 id="title">SvS</h1></div><a class="round" href="index.html">×</a></div>
<div class="nav"><button id="prev">‹</button><button id="next">›</button></div><div id="desc" class="desc"></div><div id="list" class="list"></div>
</main><script>
(()=>{
'use strict';
const SB=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');
const SECTIONS=[
 {k:'svs',t:'SvS',d:'SvS forms for Preparation Phase and Battle Phase.',c:[
  {tag:'SVS • BATTLE PHASE',title:'Battle Sign-Up',desc:'Submit Battle Phase availability and combat information.',open:'battle-form.html?direct=1&event_type=svs',edit:'battle-settings.html?event_type=svs',key:'svs'},
  {tag:'SVS • PREPARATION PHASE',title:'Ministry Sign-Up',desc:'Request VP or MOE appointments for Construction, Research and Training days.',open:'ministry-signup.html?direct=1',edit:'ministry-settings.html',key:'ministry',copy:'ministry-public.html?public=1'}
 ]},
 {k:'fdt',t:'FDT',d:'Frostdragon Tyrant Sign-Ups.',c:[{tag:'FDT • FROSTDRAGON TYRANT',title:'FDT Sign-Up',desc:'Submit FDT availability, Battle Role and battle-readiness information.',open:'fdt-form.html?direct=1',edit:'fdt-settings.html',key:'fdt'}]},
 {k:'tal',t:'TAL',d:'Tundra Arms League Sign-Ups.',c:[{tag:'TAL • TUNDRA ARMS LEAGUE',title:'TAL Sign-Up',desc:'Submit availability for every tournament round and TAL battle information.',open:'tal-form.html?direct=1',edit:'tal-settings.html',key:'tal'}]},
 {k:'transfer',t:'Transfer',d:'Transfer applications and public access.',c:[{tag:'TRANSFER • PRIMARY APPLICATION',title:'Transfer Application',desc:'Permanent Transfer application template for the current workspace.',key:'transfer',transfer:true}]},
 {k:'surveys',t:'Surveys',d:'Leadership surveys and reusable questionnaires.',c:[
  {tag:'SURVEYS • QUESTIONNAIRES',title:'Survey Center',desc:'Create Server-wide or Alliance-only surveys and review responses.',open:'survey-center.html'}
]}
];
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
let i=Math.max(0,SECTIONS.findIndex(x=>x.k===(q.get('section')||'svs'))),templates={},transferEvent=null,transferWorkspace=null;

function deadline(s){if(!s?.deadline_enabled||!s.deadline_at)return'';const ms=new Date(s.deadline_at)-Date.now();if(ms<=0)return'<span class="nexa-deadline-badge closed">CLOSED</span>';const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60,t=ms<=86400000?'red':ms<=4*86400000?'yellow':'green';return `<span class="nexa-deadline-badge ${t}">Deadline · ${d?d+'D '+h+'H':h+'H '+m+'M'}</span>`}
function settingsFor(key){return templates[key]?.settings||{}}
function accessOpen(s){return s.public_access_removed!==true&&s.public_access_enabled!==false}
function transferLinks(){if(!transferEvent)return{open:'#',copy:'#',edit:'#'};const id=encodeURIComponent(transferEvent.id);return{open:`transfer-form-v2.html?direct=1&event=${id}`,copy:`transfer-form-v2.html?public=1&event=${id}`,edit:`transfer-form-settings.html?event=${id}`}}
function card(c){
 if(c.transfer){
  const l=transferLinks(),open=transferEvent?.public_access_enabled===true,listed=transferEvent?.listed_in_transfer_center===true,disabled=!transferEvent;
  return `<article class="card" data-card-key="transfer"><div class="tag">${c.tag}</div><h2>${c.title}</h2><p>${c.desc}</p>
  <span class="access-state ${open?'':'off'}">${open?'PUBLIC ACCESS OPEN':'PUBLIC ACCESS REMOVED'}</span><span class="listing-state ${listed?'':'off'}">${listed?'TRANSFER CENTER PUBLISHED':'TRANSFER CENTER HIDDEN'}</span>
  <div class="deadline"><span style="color:#7e89a9;font-size:12px">${transferEvent?`${transferEvent.cycle_kind==='next'?'Next':'Current'} Transfer Cycle • State ${transferEvent.destination_state}`:'No Transfer cycle prepared'}</span></div>
  <div class="actions">
   <a class="${disabled?'disabled':''}" href="${l.open}">Open Form</a>
   <button data-copy="${l.copy}" ${disabled||!open?'disabled':''}>Copy Link</button>
   <button data-transfer-publish ${disabled?'disabled':''}>${listed?'Remove from Transfer Center':'Publish in Transfer Center'}</button>
   <a class="${disabled?'disabled':''}" href="${l.edit}">Edit Form</a>
   <button class="${open?'danger':'restore'}" data-transfer-access ${disabled?'disabled':''}>${open?'Remove Public Access':'Restore Public Access'}</button>
  </div><div class="status"></div></article>`;
 }
 const s=settingsFor(c.key),hasKey=!!c.key,open=accessOpen(s),published=s.published_to_nexa===true,copy=c.copy||c.open||'#';
 return `<article class="card" data-card-key="${c.key||''}"><div class="tag">${c.tag}</div><h2>${c.title}</h2><p>${c.desc}</p>
 ${hasKey?`<span class="access-state ${open?'':'off'}">${open?'PUBLIC ACCESS OPEN':'PUBLIC ACCESS REMOVED'}</span><div class="deadline">${deadline(s)||'<span style="color:#7e89a9;font-size:12px">No deadline set</span>'}</div>`:''}
 <div class="actions"><a href="${c.open}">Open Form</a><button data-copy="${copy}" ${hasKey&&!open?'disabled':''}>Copy Link</button>
 ${hasKey?`<button data-publish="${c.key}" ${!open?'disabled':''}>${published?'Unpublish from NEXA':'Publish to NEXA'}</button>`:'<button disabled>Publish to NEXA</button>'}
 ${c.edit?`<a href="${c.edit}">Edit Form</a>`:'<button disabled>Edit Form</button>'}
 ${hasKey?`<button class="${open?'danger':'restore'}" data-access="${c.key}">${open?'Remove Public Access':'Restore Public Access'}</button>`:'<button disabled>Remove Public Access</button>'}
 </div><div class="status"></div></article>`;
}
function render(){const s=SECTIONS[i];$('title').textContent=s.t;$('desc').textContent=s.d;$('prev').disabled=i===0;$('next').disabled=i===SECTIONS.length-1;$('list').innerHTML=s.c.length?s.c.map(card).join(''):'<div class="desc">No forms in this section yet.</div>';history.replaceState(null,'',`forms-center.html?section=${s.k}`)}
async function reload(){
 const r=await SB.from('event_form_templates').select('event_type_key,settings').in('event_type_key',['svs','fdt','tal','ministry']);if(!r.error)for(const x of r.data||[])templates[x.event_type_key]=x;
 transferWorkspace=null;transferEvent=null;
 const tr=await SB.rpc('get_transfer_form_admin_state');
 const st=tr.data||null;
 if(!tr.error&&st?.ok===true){
   transferWorkspace={id:st.workspace_id,state_number:st.state_number,display_name:st.display_name};
   if(st.event_id){
     transferEvent={
       id:st.event_id,
       workspace_id:st.workspace_id,
       destination_state:st.destination_state,
       cycle_kind:st.cycle_kind||'current',
       public_access_enabled:st.public_access_enabled===true,
       listed_in_transfer_center:st.listed_in_transfer_center===true,
       status:st.status
     };
   }
 }
 render();
}
async function saveSettings(key,next){const r=await SB.from('event_form_templates').update({settings:next,updated_at:new Date().toISOString()}).eq('event_type_key',key);if(r.error)throw r.error;templates[key]={event_type_key:key,settings:next}}
async function confirmBox({title,text,warn,yes='Confirm'}){return await new Promise(resolve=>{document.querySelector('.nexa-access-modal')?.remove();const wrap=document.createElement('div');wrap.className='nexa-access-modal';wrap.innerHTML=`<div class="nexa-access-card"><h3>${title}</h3><p>${text}</p>${warn?`<div class="warn">${warn}</div>`:''}<div class="nexa-access-actions"><button class="cancel" type="button">Cancel</button><button class="yes" type="button">${yes}</button></div></div>`;document.body.appendChild(wrap);const done=v=>{wrap.remove();resolve(v)};wrap.querySelector('.cancel').onclick=()=>done(false);wrap.querySelector('.yes').onclick=()=>done(true);wrap.onclick=e=>{if(e.target===wrap)done(false)}})}
function cardStatus(key,msg){const el=document.querySelector(`[data-card-key="${key}"] .status`);if(el)el.textContent=msg}
$('prev').onclick=()=>{if(i){i--;render()}};$('next').onclick=()=>{if(i<SECTIONS.length-1){i++;render()}};
document.addEventListener('click',async e=>{
 const copy=e.target.closest('[data-copy]');if(copy){const rel=copy.dataset.copy;if(!rel||rel==='#')return;const url=new URL(rel,location.href).href;try{await navigator.clipboard.writeText(url);const old=copy.textContent;copy.textContent='Copied ✓';setTimeout(()=>copy.textContent=old,1100)}catch(_){cardStatus(copy.closest('[data-card-key]')?.dataset.cardKey||'',url)}return}
 const pub=e.target.closest('[data-publish]');if(pub){const key=pub.dataset.publish,current=settingsFor(key),next={...current,public_access_removed:false,public_access_enabled:true,published_to_nexa:current.published_to_nexa!==true};try{await saveSettings(key,next);render()}catch(err){cardStatus(key,err.message||'Unable to update NEXA publishing.')}return}
 const ac=e.target.closest('[data-access]');if(ac){const key=ac.dataset.access,current=settingsFor(key),open=accessOpen(current);if(open){const ok=await confirmBox({title:'Remove Public Access?',text:'Public links will stop accepting responses.',warn:'Saved responses will not be deleted. Internal Open Form access stays available.',yes:'Remove Access'});if(!ok)return;try{await saveSettings(key,{...current,public_access_removed:true,public_access_enabled:false,published_to_nexa:false});render()}catch(err){cardStatus(key,err.message||'Unable to remove public access.')}}else{try{await saveSettings(key,{...current,public_access_removed:false,public_access_enabled:true,published_to_nexa:false});render()}catch(err){cardStatus(key,err.message||'Unable to restore public access.')}}return}
 const ta=e.target.closest('[data-transfer-access]');if(ta&&transferEvent){const open=transferEvent.public_access_enabled===true;if(open){const ok=await confirmBox({title:'Remove Public Access?',text:'The Transfer link will temporarily stop accepting applications.',warn:'Saved applications stay intact. Restore access whenever you are ready.',yes:'Remove Access'});if(!ok)return}const patch=open?{public_access_enabled:false,listed_in_transfer_center:false}:{public_access_enabled:true};const r=await SB.from('transfer_events').update(patch).eq('id',transferEvent.id).select('*').single();if(r.error){cardStatus('transfer',r.error.message);return}transferEvent=r.data;render();return}
 const tp=e.target.closest('[data-transfer-publish]');if(tp&&transferEvent){const next=!transferEvent.listed_in_transfer_center;if(next){const restoring=transferEvent.public_access_enabled!==true;const ok=await confirmBox({title:'Publish in Transfer Center?',text:'The application will be visible inside the State Transfer Center.',warn:restoring?'Publishing here will also restore Public Access. This does not publish it to NEXA Pulse.':'This does not publish it to NEXA Pulse.',yes:'Publish'});if(!ok)return}const patch=next?{listed_in_transfer_center:true,public_access_enabled:true}:{listed_in_transfer_center:false};const r=await SB.from('transfer_events').update(patch).eq('id',transferEvent.id).select('*').single();if(r.error){cardStatus('transfer',r.error.message);return}transferEvent=r.data;render();return}
});
reload();setInterval(reload,30000);
})();
</script></body></html>
