<!doctype html>
<!-- NEXA SURVEY CENTER V2.0 — MANAGEMENT ONLY / REGULAR + ANONYMOUS -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Survey Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--c:#59e4ff;--m:#aab4d0;--p:rgba(8,15,34,.94);--bad:#ff8ca8;--good:#7df1be}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 8% 6%,rgba(89,228,255,.09),transparent 31%),radial-gradient(circle at 93% 2%,rgba(141,118,255,.08),transparent 34%),#03050e;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
.shell{width:min(850px,100%);margin:auto;padding:20px 14px 96px}
.top{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#dffcff;background:#081127;border:1px solid rgba(89,228,255,.28);font-size:22px}
.brand{text-align:center}.brand small{display:block;color:#9ca9cc;font-size:10px;letter-spacing:.18em;font-weight:950}.brand h1{margin:4px 0;font-size:clamp(1.8rem,7vw,2.8rem);color:#fff}
.card{margin-top:14px;padding:16px;border-radius:20px;border:1px solid rgba(255,255,255,.10);background:var(--p)}
.muted{color:var(--m);line-height:1.45}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:42px;border-radius:13px;border:1px solid rgba(89,228,255,.34);background:linear-gradient(135deg,rgba(25,76,112,.72),rgba(36,30,97,.8));color:#fff;padding:9px 13px;font-weight:900}
.btn.secondary{background:rgba(255,255,255,.045)}.btn.danger{border-color:rgba(255,90,120,.34);background:rgba(115,24,52,.42)}
.badge{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:9px;font-weight:950;margin:0 6px 6px 0}
.badge.open{color:var(--good)}.badge.closed{color:#ffb0c0}.badge.anon{color:#d7c8ff}
.list{display:grid;gap:10px}.survey{padding:14px;border-radius:17px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035)}.survey h3{margin:6px 0}.meta{font-size:11px;color:#93a0be}
.hidden{display:none!important}.field{display:grid;gap:6px;margin-top:10px;color:#b8c4df;font-size:12px;font-weight:850}
.field input,.field textarea,.field select{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:#070d20;color:#fff;padding:11px}
.qcard{margin-top:10px;padding:13px;border-radius:16px;border:1px solid rgba(89,228,255,.18);background:rgba(255,255,255,.025)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.opts{display:grid;gap:7px;margin-top:8px}
.optrow{display:grid;grid-template-columns:1fr 36px;gap:7px}.iconBtn{border:1px solid rgba(255,255,255,.12);background:#091126;color:#fff;border-radius:10px}
.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#c7d2e9}.status{min-height:18px;margin-top:8px;color:#8fefff;font-size:12px}
</style>
</head>
<body>
<main class="shell">
<div class="top">
<a class="round" href="forms-center.html?section=surveys">‹</a>
<div class="brand"><small>FORMS CENTER</small><h1>Survey Center</h1></div>
<a class="round" href="index.html">×</a>
</div>

<section class="card">
<div class="actions">
<button class="btn hidden" id="newSurvey">+ Create Survey</button>
<button class="btn secondary" id="refresh">Refresh</button>
</div>
<div class="status" id="topStatus"></div>
</section>

<section class="card">
<h2 style="margin-top:0">Surveys</h2>
<p class="muted">Create, edit, open, close or delete surveys. Results are managed separately in Survey Responses.</p>
<div id="surveyList" class="list"></div>
</section>

<section class="card hidden" id="builder">
<div class="qhead">
<div><small style="color:#8fefff;font-weight:950;letter-spacing:.12em">SURVEY BUILDER</small><h2 id="builderTitle">Create Survey</h2></div>
<button class="btn secondary" id="closeBuilder">Close</button>
</div>
<label class="field">Survey title<input id="title"></label>
<label class="field">Description<textarea id="description" rows="3"></textarea></label>
<label class="field">Audience
<select id="audience">
<option value="server">Entire Server</option>
<option value="alliance">My Alliance Only</option>
</select>
</label>
<div class="muted" id="audienceHint" style="margin-top:7px"></div>

<label class="field">Response privacy
<select id="responsePrivacy">
<option value="regular">Regular — participant identity visible in Survey Responses</option>
<option value="anonymous">Anonymous — only aggregated results are shown</option>
</select>
</label>
<div class="muted" id="privacyHint" style="margin-top:7px"></div>

<div id="questions"></div>
<div class="actions">
<button class="btn secondary" id="addQuestion">+ Add Question</button>
<button class="btn" id="saveSurvey">Save Survey</button>
</div>
<div class="status" id="saveStatus"></div>
</section>
</main>

<script>
(()=>{'use strict';
const SB=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=Number(localStorage.getItem('nexa_active_state_v49')||window.NEXA_ACTIVE_STATE||0);
let accountId=localStorage.getItem('nexa_active_account_v49')||window.NEXA_ACTIVE_ACCOUNT_ID||'';
let ctx=null,editingId='',questions=[];

async function boot(){
 const {data:{session}}=await SB.auth.getSession();
 if(!session){location.href='index.html';return}
 if(!state||!accountId){$('topStatus').textContent='Open NEXA and select a State/account first.';return}
 await load();
}
async function load(){
 const {data,error}=await SB.rpc('nexa_survey_list',{p_state:state,p_account_id:accountId});
 if(error||!data?.ok){$('topStatus').textContent=error?.message||data?.error||'Unable to load surveys.';return}
 ctx=data;$('newSurvey').classList.toggle('hidden',!data.can_manage);renderList();
}
function renderList(){
 const rows=ctx?.surveys||[];
 $('surveyList').innerHTML=rows.length?rows.map(s=>`<div class="survey">
  <div>
   <span class="badge ${s.status}">${String(s.status).toUpperCase()}</span>
   <span class="badge">${s.audience==='alliance'?'ALLIANCE ONLY':'ENTIRE SERVER'}</span>
   <span class="badge ${s.response_privacy==='anonymous'?'anon':''}">${s.response_privacy==='anonymous'?'ANONYMOUS':'REGULAR'}</span>
  </div>
  <h3>${esc(s.title)}</h3>
  <div class="meta">${esc(s.audience==='alliance'?(s.alliance_tag||'Alliance'):'State '+s.state_number)} • ${s.question_count||0} questions • ${s.response_count||0} responses${s.responded?' • You responded':''}</div>
  <div class="actions">
    <button class="btn" data-open="${s.id}">Open Survey</button>
    ${ctx.can_manage?`<button class="btn secondary" data-edit="${s.id}">Edit</button><button class="btn secondary" data-status="${s.id}" data-next="${s.status==='open'?'closed':'open'}">${s.status==='open'?'Close':'Reopen'}</button><button class="btn danger" data-delete="${s.id}">Delete</button>`:''}
  </div></div>`).join(''):'<div class="muted">No surveys yet.</div>';
}
function newQuestion(q={}){
 questions.push({id:q.id||crypto.randomUUID(),question_text:q.question_text||'',question_type:q.question_type||'single',required:!!q.required,allow_other:!!q.allow_other,options:Array.isArray(q.options)?q.options.slice():[]});
 renderQuestions();
}
function renderQuestions(){
 $('questions').innerHTML=questions.map((q,i)=>`<div class="qcard" data-q="${q.id}">
  <div class="qhead"><b>Question ${i+1}</b><button class="iconBtn" data-removeq="${q.id}">×</button></div>
  <label class="field">Question<input data-qtext="${q.id}" value="${esc(q.question_text)}"></label>
  <label class="field">Answer type<select data-qtype="${q.id}">
    <option value="single" ${q.question_type==='single'?'selected':''}>Single choice</option>
    <option value="multiple" ${q.question_type==='multiple'?'selected':''}>Multiple choice</option>
    <option value="short" ${q.question_type==='short'?'selected':''}>Short answer</option>
    <option value="long" ${q.question_type==='long'?'selected':''}>Long answer</option>
  </select></label>
  ${['single','multiple'].includes(q.question_type)?`<div class="opts">
    ${q.options.map((o,j)=>`<div class="optrow"><input data-opt="${q.id}" data-idx="${j}" value="${esc(o)}"><button class="iconBtn" data-rmopt="${q.id}" data-idx="${j}">×</button></div>`).join('')}
    <button class="btn secondary" data-addopt="${q.id}">+ Add option</button>
  </div>
  <div class="checks"><label><input type="checkbox" data-other="${q.id}" ${q.allow_other?'checked':''}> Allow “Other”</label><label><input type="checkbox" data-required="${q.id}" ${q.required?'checked':''}> Required</label></div>`:
  `<div class="checks"><label><input type="checkbox" data-required="${q.id}" ${q.required?'checked':''}> Required</label></div>`}
 </div>`).join('');
}
function sync(){
 questions.forEach(q=>{
  const el=document.querySelector(`[data-q="${q.id}"]`);if(!el)return;
  q.question_text=el.querySelector(`[data-qtext="${q.id}"]`)?.value.trim()||'';
  q.question_type=el.querySelector(`[data-qtype="${q.id}"]`)?.value||'single';
  q.required=!!el.querySelector(`[data-required="${q.id}"]`)?.checked;
  q.allow_other=!!el.querySelector(`[data-other="${q.id}"]`)?.checked;
  q.options=[...el.querySelectorAll(`[data-opt="${q.id}"]`)].map(x=>x.value.trim()).filter(Boolean);
 });
}
function setHints(){
 $('audienceHint').textContent=$('audience').value==='alliance'?`Only ${ctx?.account?.alliance_tag||'your alliance'} will be able to respond.`:'Every member in the active State can respond.';
 $('privacyHint').textContent=$('responsePrivacy').value==='anonymous'?'Survey Responses will show aggregated totals only. Participant identity is not returned in results.':'Survey Responses can show who selected each option.';
}
function openBuilder(s=null,qs=[]){
 editingId=s?.id||'';$('builderTitle').textContent=s?'Edit Survey':'Create Survey';
 $('title').value=s?.title||'';$('description').value=s?.description||'';$('audience').value=s?.audience||'server';
 $('responsePrivacy').value=s?.response_privacy||'regular';
 questions=(qs||[]).map(q=>({...q,options:Array.isArray(q.options)?q.options:[]}));
 if(!questions.length)newQuestion();else renderQuestions();
 setHints();$('builder').classList.remove('hidden');$('builder').scrollIntoView({behavior:'smooth'});
}
async function editSurvey(id){
 const {data,error}=await SB.rpc('nexa_survey_get',{p_survey_id:id,p_account_id:accountId});
 if(error||!data?.ok)return alert(error?.message||data?.error||'Unable to load survey.');
 openBuilder(data.survey,data.questions);
}
async function save(){
 sync();const title=$('title').value.trim();
 if(!title)return $('saveStatus').textContent='Survey title is required.';
 if(!questions.length||questions.some(q=>!q.question_text))return $('saveStatus').textContent='Every question needs text.';
 for(const q of questions)if(['single','multiple'].includes(q.question_type)&&q.options.length<1)return $('saveStatus').textContent='Choice questions need at least one option.';
 const existing=(ctx?.surveys||[]).find(x=>x.id===editingId);
 const payload={id:editingId||null,state_number:state,title,description:$('description').value.trim(),audience:$('audience').value,response_privacy:$('responsePrivacy').value,status:existing?.status||'open',questions:questions.map((q,i)=>({sort_order:i,question_text:q.question_text,question_type:q.question_type,required:q.required,allow_other:q.allow_other,options:q.options}))};
 $('saveStatus').textContent='Saving…';
 const {data,error}=await SB.rpc('nexa_survey_save',{p_account_id:accountId,p_payload:payload});
 if(error||!data?.ok){$('saveStatus').textContent=error?.message||data?.error||'Unable to save survey.';return}
 $('saveStatus').textContent='Saved ✓';$('builder').classList.add('hidden');await load();
}

$('newSurvey').onclick=()=>openBuilder();$('refresh').onclick=load;$('closeBuilder').onclick=()=>$('builder').classList.add('hidden');
$('addQuestion').onclick=()=>{sync();newQuestion()};$('saveSurvey').onclick=save;
$('audience').onchange=setHints;$('responsePrivacy').onchange=setHints;
document.addEventListener('click',async e=>{
 const t=e.target;
 if(t.dataset.open)location.href=`survey.html?id=${encodeURIComponent(t.dataset.open)}`;
 if(t.dataset.edit)await editSurvey(t.dataset.edit);
 if(t.dataset.removeq){sync();questions=questions.filter(q=>q.id!==t.dataset.removeq);renderQuestions()}
 if(t.dataset.addopt){sync();questions.find(q=>q.id===t.dataset.addopt)?.options.push('');renderQuestions()}
 if(t.dataset.rmopt){sync();const q=questions.find(x=>x.id===t.dataset.rmopt);if(q)q.options.splice(Number(t.dataset.idx),1);renderQuestions()}
 if(t.dataset.status){const {data}=await SB.rpc('nexa_survey_set_status',{p_survey_id:t.dataset.status,p_account_id:accountId,p_status:t.dataset.next});if(data?.ok)await load()}
 if(t.dataset.delete&&confirm('Delete this survey and all responses permanently?')){const {data}=await SB.rpc('nexa_survey_delete',{p_survey_id:t.dataset.delete,p_account_id:accountId});if(data?.ok)await load()}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-qtype]')){
  sync();const q=questions.find(x=>x.id===e.target.dataset.qtype);
  if(q){q.question_type=e.target.value;if(!['single','multiple'].includes(q.question_type)){q.options=[];q.allow_other=false}renderQuestions()}
 }
});
boot();
})();
</script>
</body>
</html>
