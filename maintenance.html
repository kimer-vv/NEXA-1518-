<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Maintenance</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;overflow:hidden;background:#050716}.sky{position:fixed;inset:0;background:radial-gradient(circle at 18% 17%,rgba(111,50,255,.34),transparent 31%),radial-gradient(circle at 78% 76%,rgba(18,119,255,.22),transparent 35%),radial-gradient(circle at 52% 42%,rgba(185,42,255,.11),transparent 28%),linear-gradient(150deg,#050716,#0a0d27 48%,#060814)}.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";background-image:radial-gradient(circle,#fff 0 1px,transparent 1.2px),radial-gradient(circle,#9ab8ff 0 1px,transparent 1.2px);background-size:73px 73px,113px 113px;background-position:0 0,23px 37px;opacity:.25}.comet{position:absolute;width:150px;height:2px;top:20%;left:-190px;transform:rotate(-20deg);background:linear-gradient(90deg,transparent,rgba(194,210,255,.35),#fff);filter:drop-shadow(0 0 8px #7b86ff);animation:fly 1.7s ease-out .25s 1 forwards}.comet:after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 16px #8b86ff}@keyframes fly{to{left:115%;top:56%}}.wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:22px}.card{position:relative;width:min(570px,100%);padding:34px 28px 30px;border-radius:28px;text-align:center;background:rgba(8,12,32,.78);border:1px solid rgba(154,124,255,.35);box-shadow:0 28px 90px rgba(0,0,0,.45),0 0 46px rgba(104,67,255,.13);backdrop-filter:blur(20px)}.mark{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 15px}.mark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(92,183,255,.55)) drop-shadow(0 0 28px rgba(126,74,255,.35))}h1{margin:0;font-size:clamp(34px,7vw,54px);letter-spacing:.12em}h2{font-size:20px;margin:27px 0 8px}.copy{color:#9fa8cb;line-height:1.65;margin:0 auto;max-width:410px}.pill{display:inline-flex;margin-top:20px;padding:8px 12px;border-radius:999px;border:1px solid rgba(152,120,255,.3);background:rgba(103,74,255,.09);color:#c9c8ff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.owner-lock{position:absolute;right:14px;bottom:13px;width:34px;height:34px;border:0;background:transparent;color:rgba(216,219,255,.42);font-size:16px;cursor:pointer;border-radius:50%}.preview{position:absolute;left:16px;top:14px;font-size:10px;color:#8b94b9;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body><div class="sky"><div class="stars"></div><div class="comet"></div></div><main class="wrap"><section class="card"><div id="preview-label" class="preview" hidden>Owner Preview</div><div class="mark"><img src="/nexa-icon.png" alt="NEXA"></div><h1>NEXA</h1><h2>Server Under Maintenance</h2><p class="copy">NEXA is currently being updated. Public pages, forms and shared links are temporarily unavailable while improvements are in progress.</p><div class="pill">We’ll be back soon</div><button class="owner-lock" aria-label="Owner access" title="Owner access" onclick="location.href='/owner-access.html'">🔒</button></section></main><script>if(new URLSearchParams(location.search).has('preview'))document.getElementById('preview-label').hidden=false;</script></body></html>
