<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Template Builder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#070812;--panel:#111321;--panel2:#171a2b;--text:#f6f7ff;--muted:#a9aec7;--line:#2e3246;
  --accent:#6f52ff;--sheet-bg:#ffffff;--sheet-text:#14213d;--team-head:#173b7a;--section-bg:#eef2f8;--pet:#d89b20;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17132c 0,#090912 42%,#06060b 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1500px;margin:0 auto;padding:18px}
.back{display:inline-block;color:#cbc8ff;text-decoration:none;margin-bottom:12px}
.builder{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}
.panel{background:rgba(17,19,33,.9);border:1px solid var(--line);border-radius:20px;padding:16px}
h1,h2,h3{margin:.25rem 0 .6rem}
.muted{color:var(--muted)}
.controls{display:grid;gap:14px}
.control-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0e101c}
label{display:grid;gap:6px}
select,input{width:100%;background:#090b15;color:#fff;border:1px solid #3c415a;border-radius:11px;padding:10px;font:inherit}
.btn{width:100%;background:#171425;color:#fff;border:1px solid #4b3a72;border-radius:12px;padding:11px 13px;font-weight:800}
.btn.primary{background:linear-gradient(135deg,#6b4cff,#8f6dff)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview-wrap{overflow:auto}
.sheet{
  min-width:920px;background:var(--sheet-bg);color:var(--sheet-text);border-radius:18px;padding:26px;
  box-shadow:0 24px 70px rgba(0,0,0,.35)
}
.sheet-header{text-align:center;margin-bottom:18px}
.sheet-title{font-size:42px;font-weight:900;letter-spacing:.04em}
.teams-grid{display:grid;gap:16px}
.teams-grid.count-1{grid-template-columns:1fr}
.teams-grid.count-2{grid-template-columns:repeat(2,1fr)}
.teams-grid.count-3{grid-template-columns:repeat(3,1fr)}
.teams-grid.count-4{grid-template-columns:repeat(4,1fr)}
.teams-grid.count-5,.teams-grid.count-6{grid-template-columns:repeat(3,1fr)}
.team-card{border:1px solid #cfd5e2;border-radius:14px;overflow:hidden;background:#fff}
.team-title{background:var(--team-head);color:#fff;text-align:center;padding:10px;font-weight:900}
.team-section-title{background:var(--section-bg);padding:8px 10px;font-weight:900;text-align:center}
.player-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(80px,.75fr) minmax(80px,.75fr);gap:8px;padding:8px 10px;border-top:1px solid #e2e6ef;align-items:center;font-size:14px}
.player-row.rally{grid-template-columns:minmax(120px,1fr) minmax(110px,.85fr)}
.player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet{color:var(--pet);font-weight:800}
.formations{margin-top:18px;border-top:1px solid #dfe3ec;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formation-card{border:1px solid #d5dae5;border-radius:12px;padding:10px}
.formation-title{font-weight:900}
.formation-heroes{font-weight:800;margin-top:4px}
.formation-ratio{color:#5f6675;margin-top:3px}
.legend{margin-top:16px;display:flex;gap:16px;justify-content:center;color:#59606f;font-size:13px}
.compact .player-row{font-size:12px;padding:6px 8px}
.compact .team-title{padding:8px;font-size:14px}
.compact .team-section-title{padding:6px 8px;font-size:12px}
.compact .sheet-title{font-size:34px}
@media(max-width:900px){
  .builder{grid-template-columns:1fr}
  .sheet{min-width:820px}
}
</style>
</head>
<body>
<main class="shell">
<a class="back" id="back-link" href="#">← Alliance Workspace</a>
<div class="builder">
  <aside class="panel">
    <h1>Template Builder</h1>
    <p class="muted">Build the final alliance team plan from your saved NEXA data.</p>
    <div class="controls">
      <div class="control-card">
        <h3>1. Template</h3>
        <select id="template-style">
          <option value="classic">Classic Light</option>
          <option value="dark">Dark Forge</option>
          <option value="gold">Royal Gold</option>
          <option value="ice">Ice Blue</option>
          <option value="forest">Forest Green</option>
        </select>
      </div>
      <div class="control-card">
        <h3>2. Layout</h3>
        <label>Scale
          <select id="density">
            <option value="auto">Auto</option>
            <option value="normal">Normal</option>
            <option value="compact">Compact</option>
          </select>
        </label>
      </div>
      <div class="control-card">
        <h3>3. Preview</h3>
        <button class="btn" id="fullscreen" type="button">Preview Fullscreen</button>
      </div>
      <div class="control-card">
        <h3>4. Export</h3>
        <div class="row">
          <button class="btn primary" id="save-preview" type="button">Save</button>
          <button class="btn" id="print-btn" type="button">Print / PDF</button>
        </div>
        <p class="muted" style="font-size:.8rem;margin-bottom:0">PNG/JPG export comes next; this first version validates the final layout and data flow.</p>
      </div>
    </div>
  </aside>

  <section class="panel preview-wrap">
    <div id="sheet" class="sheet">
      <div class="sheet-header">
        <div class="sheet-title" id="sheet-title">Alliance</div>
        <div id="sheet-subtitle" style="color:#677084;font-weight:700"></div>
      </div>
      <div id="teams-grid" class="teams-grid"></div>
      <div id="formations" class="formations"></div>
      <div class="legend"><span>🐾 Pets Active</span><span>All times in UTC</span></div>
    </div>
  </section>
</div>
</main>
<script>
const sb=window.supabase.createClient("https://dfxcxboxrkfmrnsgpyin.supabase.co","sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-");
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const p=new URLSearchParams(location.search);
const eventType=p.get('event_type')||'svs',allianceId=p.get('alliance_id')||'',allianceTag=p.get('alliance_tag')||'Alliance';

function displayName(v){
  let out=String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u200B-\u200D\uFEFF]/g,'');
  const map={'Α':'A','Β':'B','Ε':'E','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X','α':'a','β':'b','ε':'e','ι':'i','κ':'k','μ':'m','ν':'n','ο':'o','ρ':'p','τ':'t','υ':'y','χ':'x','Ɛ':'E','ɛ':'e','Ǝ':'E','Ɩ':'I','Ƙ':'K','ƙ':'k','Ɯ':'M','Ɲ':'N','Ƥ':'P','Ʀ':'R','ʀ':'R','Ƨ':'S','Ƭ':'T','Ʋ':'V','Ƴ':'Y','Ƶ':'Z'};
  out=[...out].map(ch=>map[ch]??ch).join('').replace(/[ʚɞ꧁꧂༺༻『』【】〖〗《》〈〉❖✦✧★☆•·]+/g,'').replace(/\s+/g,' ').trim();
  return out;
}
$('back-link').href=`alliance-teams.html?event_type=${encodeURIComponent(eventType)}&alliance_id=${encodeURIComponent(allianceId)}&alliance_tag=${encodeURIComponent(allianceTag)}`;
$('sheet-title').textContent=allianceTag;
$('sheet-subtitle').textContent=eventType.toUpperCase();

async function load(){
  const {data:teams,error:tErr}=await sb.from('alliance_teams').select('*').eq('event_type_key',eventType).eq('alliance_id',String(allianceId)).order('sort_order').order('created_at');
  if(tErr){alert(tErr.message);return}

  const ids=(teams||[]).map(x=>x.id);
  let members=[];
  if(ids.length){
    const {data,error}=await sb.from('team_members').select('*,pet_windows(*)').in('team_id',ids).order('created_at');
    if(error){alert(error.message);return}
    members=data||[];
  }

  const {data:formations,error:fErr}=await sb.from('alliance_formations').select('*').eq('event_type_key',eventType).eq('alliance_id',String(allianceId)).order('formation_scope').order('sort_order');
  if(fErr){alert(fErr.message);return}

  renderTeams(teams||[],members);
  renderFormations(formations||[]);
  autoDensity((teams||[]).length);
}
function renderTeams(teams,members){
  const grid=$('teams-grid');
  grid.className='teams-grid count-'+Math.min(Math.max(teams.length,1),6);
  grid.innerHTML=teams.map(t=>{
    const tm=members.filter(m=>String(m.team_id)===String(t.id));
    const rally=tm.filter(m=>m.member_role==='rally_lead');
    const joiners=tm.filter(m=>m.member_role==='joiner');
    const useDefense=!!t.use_defensive_heroes;

    return `<section class="team-card">
      <div class="team-title">${esc(t.name)}</div>
      <div class="team-section-title">RALLY LEADS</div>
      ${rally.length?rally.map(m=>{
        const pets=(m.pet_windows||[]).map(w=>`${esc(w.start_utc)}–${esc(w.end_utc)}`).join(', ');
        return `<div class="player-row rally"><div class="player-name">${esc(displayName(m.player_name))}</div><div class="pet">${pets?'🐾 '+pets+' UTC':'—'}</div></div>`;
      }).join(''):'<div class="player-row rally"><div>—</div><div>—</div></div>'}
      <div class="team-section-title">JOINERS</div>
      ${joiners.length?joiners.map(m=>`<div class="player-row">
        <div class="player-name">${esc(displayName(m.player_name))}</div>
        <div>${esc(displayName(m.attack_hero||'—'))}</div>
        <div>${useDefense?esc(displayName(m.defensive_hero||'—')):''}</div>
      </div>`).join(''):'<div class="player-row"><div>—</div><div>—</div><div></div></div>'}
    </section>`;
  }).join('');
}
function renderFormations(rows){
  const box=$('formations');
  if(!rows.length){box.style.display='none';return}
  box.style.display='grid';
  box.innerHTML=rows.map(x=>{
    const heroes=x.formation_scope==='rally'
      ? [x.hero_config?.infantry_hero,x.hero_config?.lancer_hero,x.hero_config?.marksman_hero].filter(Boolean).map(displayName)
      : (Array.isArray(x.recommended_heroes)?x.recommended_heroes.map(displayName):[]);
    return `<div class="formation-card">
      <div class="formation-title">${x.formation_scope==='rally'?'Rally Leader':'Joiner'} — ${esc(x.name)} <span style="font-size:.75rem">${esc(String(x.formation_type).toUpperCase())}</span></div>
      ${heroes.length?`<div class="formation-heroes">${heroes.map(esc).join(' • ')}</div>`:''}
      <div class="formation-ratio">${x.infantry_pct} / ${x.lancer_pct} / ${x.marksman_pct}</div>
    </div>`;
  }).join('');
}
function autoDensity(count){
  const mode=$('density').value;
  const compact=mode==='compact'||(mode==='auto'&&count>=5);
  $('sheet').classList.toggle('compact',compact);
}
function applyTheme(v){
  const root=document.documentElement;
  const themes={
    classic:['#ffffff','#14213d','#173b7a','#eef2f8','#d89b20'],
    dark:['#0d111c','#f4f6ff','#1b243a','#151a26','#f0a82c'],
    gold:['#fffaf0','#2b210d','#8a6719','#f5ead0','#c89012'],
    ice:['#f4fbff','#103149','#1976a5','#e3f4fb','#dc9b20'],
    forest:['#f6fbf7','#183c29','#285f42','#e6f1e9','#d99b20']
  };
  const [bg,text,head,section,pet]=themes[v]||themes.classic;
  root.style.setProperty('--sheet-bg',bg);root.style.setProperty('--sheet-text',text);root.style.setProperty('--team-head',head);root.style.setProperty('--section-bg',section);root.style.setProperty('--pet',pet);
}
$('template-style').onchange=e=>applyTheme(e.target.value);
$('density').onchange=()=>load();
$('fullscreen').onclick=()=>document.getElementById('sheet').requestFullscreen?.();
$('print-btn').onclick=()=>window.print();
$('save-preview').onclick=()=>alert('Template layout saved for this preview. Persistent saved-template profiles come in the next export phase.');
load();
</script>
</body>
</html>
