<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA • Emergency Owner Recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#070919;color:#fff;font-family:Inter,system-ui,sans-serif}.card{width:min(430px,100%);padding:25px;border-radius:22px;background:#0d112c;border:1px solid rgba(149,125,255,.35)}h1{font-size:22px;margin:0 0 8px}.muted{color:#a5aecf;line-height:1.5}.field{display:grid;gap:7px;margin-top:17px}.field input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#7645ff,#1b8cff);color:#fff;font-weight:900;margin-top:12px}.msg{font-size:13px;color:#aab3d5;min-height:18px;margin-top:11px}
</style></head><body>
<section class="card"><h1>Emergency Owner Recovery</h1>
<p class="muted">This route bypasses the public Maintenance screen, but it does not grant Owner access by URL alone. Enter the private Owner recovery secret stored in Vercel.</p>
<label class="field">Owner Recovery Secret<input id="secret" type="password" autocomplete="off"></label>
<button id="go" class="btn">Restore Owner Access</button><div id="msg" class="msg"></div>
</section>
<script>
const msg=document.getElementById('msg');
document.getElementById('go').onclick=async()=>{
 const secret=document.getElementById('secret').value;
 msg.textContent='Verifying…';
 const r=await fetch('/api/nexa-owner-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret})});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){msg.textContent=d.error||'Recovery failed.';return;}
 msg.textContent='Owner bypass restored.';
 location.replace('/');
};
</script></body></html>
