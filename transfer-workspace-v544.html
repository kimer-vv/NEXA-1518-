<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Transfer Workspace</title>
<style>
html,body{margin:0;min-height:100%;background:#03050e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#loader span{display:block;margin-top:7px;color:#9da9c8;font-size:12px}
</style>
</head>
<body>
<div id="loader"><div><b>Loading Transfer Workspace…</b><span>Applying modern Groups + selector contrast</span></div></div>
<script>
(async()=>{
 try{
   /* IMPORTANT: keep the exact V5.44 base used by the modern Groups renderer */
   const source=new URL('/transfer-workspace.html',location.origin);
   source.search=location.search;
   source.searchParams.set('_nexa_base','544');

   const res=await fetch(source.href,{cache:'no-store'});
   if(!res.ok)throw new Error('Unable to load Transfer Workspace');
   let html=await res.text();

   /* Existing instant-save / Groups behavior stays intact */
   const patch='<scr'+'ipt src="/nexa-transfer-live-sync-v3.js?v=3-20261012-1"></scr'+'ipt>';

   /* Visual-only override: never changes renderer, events, RPCs, reorder or buttons */
   const contrast=`<style id="nexaTransferModernPillContrast">
/* Neutral/inactive modern pills */
.babySeg [data-v515-route],
.babySeg [data-route-card],
.babySeg [data-v515-invite],
.babySeg [data-invite-toggle],
.orderSeg524 [data-app-order]{
  background:linear-gradient(180deg,#343a46,#292e38)!important;
  color:#9fa8b8!important;
  border:1px solid rgba(255,255,255,.09)!important;
  box-shadow:none!important;
  text-shadow:none!important;
  filter:none!important;
}

/* ONLY active selection receives color */
.babySeg [data-v515-route="ordinary"].active,
.babySeg [data-route-card="ordinary"].active{
  background:linear-gradient(135deg,#16835c,#42c28e)!important;
  color:#fff!important;
  border-color:rgba(122,239,188,.76)!important;
  box-shadow:0 3px 12px rgba(31,156,109,.28)!important;
}

.babySeg [data-v515-route="special"].active,
.babySeg [data-route-card="special"].active{
  background:linear-gradient(135deg,#9b6618,#e2b54b)!important;
  color:#fff!important;
  border-color:rgba(255,214,109,.78)!important;
  box-shadow:0 3px 12px rgba(181,126,27,.28)!important;
}

.babySeg [data-v515-invite="pending"].active,
.babySeg [data-invite-toggle="pending"].active{
  background:linear-gradient(135deg,#6652d7,#3d8ed4)!important;
  color:#fff!important;
  border-color:rgba(159,172,255,.76)!important;
  box-shadow:0 3px 12px rgba(77,91,195,.27)!important;
}

.babySeg [data-v515-invite="sent"].active,
.babySeg [data-invite-toggle="sent"].active{
  background:linear-gradient(135deg,#16835c,#42c28e)!important;
  color:#fff!important;
  border-color:rgba(122,239,188,.76)!important;
  box-shadow:0 3px 12px rgba(31,156,109,.28)!important;
}

.orderSeg524 [data-app-order].active{
  background:linear-gradient(135deg,#6c52d9,#358dc9)!important;
  color:#fff!important;
  border-color:rgba(151,143,255,.78)!important;
  box-shadow:0 3px 12px rgba(72,88,202,.27)!important;
}

/* Explicitly force every sibling that is NOT selected to neutral gray */
.babySeg [data-v515-route]:not(.active),
.babySeg [data-route-card]:not(.active),
.babySeg [data-v515-invite]:not(.active),
.babySeg [data-invite-toggle]:not(.active),
.orderSeg524 [data-app-order]:not(.active){
  background:linear-gradient(180deg,#343a46,#292e38)!important;
  color:#9fa8b8!important;
  border-color:rgba(255,255,255,.09)!important;
  box-shadow:none!important;
}
</style>`;

   const close='</bo'+'dy>';
   const injected=patch+contrast;
   html=html.includes(close)?html.replace(close,injected+close):html+injected;

   document.open();
   document.write(html);
   document.close();
 }catch(err){
   document.getElementById('loader').innerHTML=
     '<div><b>Transfer Workspace could not load.</b><span>'+
     String(err?.message||err)+'</span></div>';
 }
})();
</script>
</body>
</html>
