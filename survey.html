<!doctype html>
<!-- NEXA SURVEY RESPONSE V2.0 — UNIFIED NEXA FORM VISUAL -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Survey</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#02030b;color:#fff}
.sh{max-width:720px;margin:auto;padding:24px 16px 90px}
.back{color:#54f0b5;text-decoration:none;font-weight:900;margin-left:18px}
.head{display:block;width:calc(100% - 36px);margin:18px 0 22px 18px}
.head small{display:block;color:#a5b2d2;font-size:10px;font-weight:950;letter-spacing:.14em;margin-bottom:8px}
.head h1{font-size:clamp(2rem,8vw,3rem);line-height:1.04;margin:0;color:#fff}
.head p,.muted{color:#aeb7d1;line-height:1.45}
.card{margin:12px 0 0 18px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(10,14,30,.58);width:calc(100% - 18px)}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;border:1px solid rgba(84,240,181,.26);color:#bfffe1;font-size:9px;font-weight:950}
.q{margin-top:12px;padding:14px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(8,16,35,.38)}
.q h3{margin:0 0 10px;font-size:16px}.req{color:#ff9fb5}
.choice{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid rgba(255,255,255,.10);border-radius:13px;margin-top:8px;background:rgba(255,255,255,.015)}
.choice:has(input:checked){border-color:rgba(84,240,181,.62);background:rgba(18,75,64,.22)}
.choice input{width:23px;height:23px;min-width:23px;accent-color:#54f0b5;margin:0}
.choice span{padding-top:2px}
.text,.other{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid rgba(119,142,210,.28);background:#081126;color:#fff;font-size:16px;max-width:100%}
.other{margin-top:8px}.text{margin-top:6px}
.btn{width:100%;min-height:52px;border-radius:15px;border:1px solid rgba(75,213,231,.62);background:linear-gradient(135deg,rgba(19,104,111,.92) 0%,rgba(32,75,118,.93) 54%,rgba(61,49,139,.92) 100%);color:#fff;font-weight:950;margin-top:14px}
.btn:disabled{opacity:.55}
.status{min-height:22px;margin-top:10px;color:#8ef0cf;font-weight:900}
</style>
</head>
<body>
<main class="sh">
<a class="back" href="index.html">‹ Home</a>
<header class="head"><small>NEXA SURVEY</small><h1 id="title">Survey</h1><p id="description"></p></header>
<section class="card"><span class="badge" id="audience">—</span><div id="questions"></div></section>
<section class="card"><button class="btn" id="submit">Submit Survey</button><div class="status" id="status"></div></section>
</main>
<script>
(()=>{'use strict';
const SB=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),surveyId=q.get('id')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let accountId=localStorage.getItem('nexa_active_account_v49')||window.NEXA_ACTIVE_ACCOUNT_ID||'',data=null;

async function boot(){
 const {data:{session}}=await SB.auth.getSession();if(!session){location.href='index.html';return}
 if(!surveyId||!accountId){$('status').textContent='Survey or active account is missing.';return}
 const r=await SB.rpc('nexa_survey_get',{p_survey_id:surveyId,p_account_id:accountId});
 if(r.error||!r.data?.ok){$('status').textContent=r.error?.message||r.data?.error||'This survey is not available to this account.';$('submit').disabled=true;return}
 data=r.data;render();
}
function render(){
 const s=data.survey;$('title').textContent=s.title;$('description').textContent=s.description||'';$('audience').textContent=s.audience==='alliance'?`ALLIANCE ONLY • ${s.alliance_tag||''}`:'ENTIRE SERVER';
 $('submit').textContent=data.response?'Update Response':'Submit Survey';
 if(s.status!=='open'){$('submit').disabled=true;$('status').textContent='This survey is closed.'}
 const saved=data.response?.answers||{};
 $('questions').innerHTML=(data.questions||[]).map((x,i)=>{
  const req=x.required?'<span class="req">*</span>':'';
  if(x.question_type==='single'){
   const val=String(saved[x.id]??''),isOther=val.startsWith('Other: ');
   return `<div class="q" data-q="${x.id}" data-type="single"><h3>${i+1}. ${esc(x.question_text)} ${req}</h3>${(x.options||[]).map(o=>`<label class="choice"><input type="radio" name="${x.id}" value="${esc(o)}" ${val===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}${x.allow_other?`<label class="choice"><input type="radio" name="${x.id}" value="__other" ${isOther?'checked':''}><span>Other</span></label><input class="other" data-other="${x.id}" placeholder="Type your answer…" value="${isOther?esc(val.slice(7)):''}">`:''}</div>`;
  }
  if(x.question_type==='multiple'){
   const vals=Array.isArray(saved[x.id])?saved[x.id]:[],other=vals.find(v=>String(v).startsWith('Other: '));
   return `<div class="q" data-q="${x.id}" data-type="multiple"><h3>${i+1}. ${esc(x.question_text)} ${req}</h3>${(x.options||[]).map(o=>`<label class="choice"><input type="checkbox" value="${esc(o)}" ${vals.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}${x.allow_other?`<label class="choice"><input type="checkbox" value="__other" ${other?'checked':''}><span>Other</span></label><input class="other" data-other="${x.id}" placeholder="Type your answer…" value="${other?esc(String(other).slice(7)):''}">`:''}</div>`;
  }
  if(x.question_type==='long')return `<div class="q" data-q="${x.id}" data-type="long"><h3>${i+1}. ${esc(x.question_text)} ${req}</h3><textarea class="text" rows="5">${esc(saved[x.id]||'')}</textarea></div>`;
  return `<div class="q" data-q="${x.id}" data-type="short"><h3>${i+1}. ${esc(x.question_text)} ${req}</h3><input class="text" value="${esc(saved[x.id]||'')}"></div>`;
 }).join('');
}
function collect(){
 const out={};
 for(const qd of data.questions||[]){
  const el=document.querySelector(`[data-q="${qd.id}"]`);let v='';
  if(qd.question_type==='single'){const c=el.querySelector('input[type=radio]:checked');if(c?.value==='__other'){const t=el.querySelector('[data-other]')?.value.trim()||'';v=t?`Other: ${t}`:''}else v=c?.value||''}
  else if(qd.question_type==='multiple'){v=[...el.querySelectorAll('input[type=checkbox]:checked')].map(c=>{if(c.value==='__other'){const t=el.querySelector('[data-other]')?.value.trim()||'';return t?`Other: ${t}`:''}return c.value}).filter(Boolean)}
  else v=el.querySelector('.text')?.value.trim()||'';
  if(qd.required&&(v===''||(Array.isArray(v)&&!v.length))){el.scrollIntoView({behavior:'smooth',block:'center'});throw new Error('Please answer every required question.')}
  out[qd.id]=v;
 }
 return out;
}
$('submit').onclick=async()=>{
 try{
  const answers=collect();$('status').textContent='Submitting…';
  const r=await SB.rpc('nexa_survey_submit',{p_survey_id:surveyId,p_account_id:accountId,p_answers:answers});
  if(r.error||!r.data?.ok){$('status').textContent=r.error?.message||r.data?.error||'Unable to submit survey.';return}
  $('status').textContent='Response saved ✓';data.response={answers};$('submit').textContent='Update Response';
 }catch(e){$('status').textContent=e.message||String(e)}
};
boot();
})();
</script>
</body>
</html>
