<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA • SvS</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lang.js"></script>
</head>
<body>
<div class="nebula-bg" aria-hidden="true"></div>
<div class="starfield" aria-hidden="true"></div>

<header class="topbar">
  <div class="shell nav">
    <a class="logo" href="index.html"><span class="star">✦</span><span>NEXA<small>STATE 1518</small></span></a>
    <a class="back" href="index.html">← Home</a>
  </div>
</header>

<main class="shell event-page">
  <a class="back" href="index.html">← Back to events</a>
  <div style="margin-top:18px">
    <span class="badge">SVS</span>
    <h1 id="event-title">Loading SvS…</h1>
    <div id="event-meta" class="muted">WOS Game Time (UTC)</div>
    <button id="edit-event-inline" class="btn secondary hidden" type="button" style="margin-top:10px">Edit Event</button>
  </div>

  <section class="glass calendar">
    <div id="event-days" class="days-list"></div>

    <div class="actions">
      <a id="prep-form-btn" class="btn disabled" href="prep-form.html">Fill Out Prep Form</a>
      <a id="schedule-btn" class="btn gold" href="schedule.html">View Schedule</a>
      <a id="battle-form-btn" class="btn battle disabled" href="#">Fill Out Battle Form</a>
    </div>
  </section>

  <section class="glass about">
    <h3>About this event</h3>
    <p id="event-description">No additional notes have been published.</p>
  </section>

  <section id="state-assignments" class="glass about hidden">
    <h3>State Assignments</h3>
    <div class="assignment-grid">
      <div id="castle-assignment" class="assignment-item hidden">
        <span>🏰 Castle</span>
        <b></b>
      </div>
      <div id="presidency-assignment" class="assignment-item hidden">
        <span>👑 Presidency</span>
        <b></b>
      </div>
    </div>
  </section>
</main>


<div id="event-edit-modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close-event-edit></div>
  <section class="modal-card">
    <div class="modal-head">
      <div><small>ADMIN</small><h2>Edit Event</h2></div>
      <button class="icon-btn" type="button" data-close-event-edit>×</button>
    </div>
    <form id="inline-event-form" class="account-form">
      <label>Opponent State<input id="inline-opponent" type="number" min="1" required></label>
      <label>Prep Monday — Game Date (UTC)<input id="inline-monday" type="date" required></label>
      <label>Event Notes<textarea id="inline-notes" rows="3"></textarea></label>
      <label>Important Announcement<textarea id="inline-announcement" rows="2"></textarea></label>
      <div class="toggle-grid">
        <label class="toggle-line"><input id="inline-prep-open" type="checkbox"> Prep Form Open</label>
        <label class="toggle-line"><input id="inline-battle-open" type="checkbox"> Battle Form Open</label>
        <label class="toggle-line"><input id="inline-schedule-published" type="checkbox"> Schedule Published</label>
        <label class="toggle-line"><input id="inline-live" type="checkbox"> Live Event</label>
      </div>
      <div class="form-actions"><button class="btn" type="submit">Save Changes</button></div>
      <div id="inline-event-message" class="form-message"></div>
    </form>
  </section>
</div>

<script>
const sb = window.supabase.createClient("https://dfxcxboxrkfmrnsgpyin.supabase.co", "sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-");

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}
function utcDateLabel(d) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone:'UTC', weekday:'short', month:'short', day:'numeric', year:'numeric'
  }).format(d);
}
function localDateTime(d, tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone:tz, weekday:'short', month:'short', day:'numeric',
    hour:'numeric', minute:'2-digit', hour12:true
  }).format(d);
}
async function getProfilePrefs() {
  const { data: { session } } = await sb.auth.getSession();
  const detectedTZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  if (!session?.user) return {tz:detectedTZ,lang:NEXA_I18N.device()};
  const { data } = await sb.from('user_profiles').select('time_zone,language').eq('user_id',session.user.id).maybeSingle();
  return {tz:data?.time_zone || detectedTZ, lang:NEXA_I18N.resolve(data?.language || 'auto')};
}
async function loadEvent() {
  await sb.rpc('refresh_auto_ended_events');
  const id = localStorage.getItem('nexa_live_event_id');
  let query = sb.from('svs_events').select('*,castle_alliance:alliances!svs_events_castle_alliance_id_fkey(tag),presidency_alliance:alliances!svs_events_presidency_alliance_id_fkey(tag)');
  query = id ? query.eq('id', id) : query.eq('status','live').order('prep_monday', {ascending:false}).limit(1);
  const { data, error } = id ? await query.maybeSingle() : await query.maybeSingle();
  if (error || !data) {
    document.getElementById('event-title').textContent = 'No live SvS event';
    return;
  }

  const prefs = await getProfilePrefs();
  const tz = prefs.tz;
  currentLang = prefs.lang;
  NEXA_I18N.setDir(currentLang);
  const t=(k)=>NEXA_I18N.t(currentLang,k);
  const days = [
    [t('monday'),t('construction'),0],
    [t('tuesday'),t('research'),1],
    [t('thursday'),t('training'),3],
    [t('saturday'),t('battle'),5]
  ];

  document.getElementById('event-title').textContent = currentLang==='es' ? `SvS contra ${data.opponent_state}` : `SvS against ${data.opponent_state}`;
  document.getElementById('event-meta').textContent =
    `${utcDateLabel(addDays(data.prep_monday,0))} 00:00 UTC • ${t('yourTime')}: ${localDateTime(addDays(data.prep_monday,0),tz)}`;

  document.getElementById('event-days').innerHTML = days.map(([day,label,off]) => {
    const d = addDays(data.prep_monday,off);
    return `<div>${day} — <b>${label}</b><small class="event-local-line">${utcDateLabel(d)} • 00:00 UTC • ${t('yourTime')}: ${localDateTime(d,tz)}</small></div>`;
  }).join('');

  document.getElementById('event-description').textContent = data.description || t('noNotes');

  const prep = document.getElementById('prep-form-btn');
  const battle = document.getElementById('battle-form-btn');
  prep.classList.toggle('disabled', !data.prep_form_open);
  battle.classList.toggle('disabled', !data.battle_form_open);
  document.getElementById('schedule-btn').classList.toggle('disabled', !data.schedule_published);

  document.querySelector('.back').textContent='← '+t('backEvents');
  document.querySelector('.about h3').textContent=t('aboutEvent');
  document.getElementById('prep-form-btn').textContent=t('fillPrep');
  document.getElementById('battle-form-btn').textContent=t('fillBattle');
  document.getElementById('schedule-btn').textContent=t('viewSchedule');
  const castleTag = data.castle_alliance?.tag || null;
  const presidencyTag = data.presidency_alliance?.tag || null;
  const assignmentBox = document.getElementById('state-assignments');
  const castleBox = document.getElementById('castle-assignment');
  const presidencyBox = document.getElementById('presidency-assignment');

  if (castleTag || presidencyTag) assignmentBox.classList.remove('hidden');
  if (castleTag) {
    castleBox.classList.remove('hidden');
    castleBox.querySelector('b').textContent = castleTag;
  }
  if (presidencyTag) {
    presidencyBox.classList.remove('hidden');
    presidencyBox.querySelector('b').textContent = presidencyTag;
  }

  await enableInlineEdit(data);
  localStorage.setItem('nexa_live_event_id', data.id);
}

async function enableInlineEdit(data){
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(isAdmin!==true) return;
  const btn=document.getElementById('edit-event-inline');
  btn.classList.remove('hidden');
  btn.addEventListener('click',()=>{
    document.getElementById('inline-opponent').value=data.opponent_state;
    document.getElementById('inline-monday').value=data.prep_monday;
    document.getElementById('inline-notes').value=data.description||'';
    document.getElementById('inline-announcement').value=data.announcement_text||'';
    document.getElementById('inline-prep-open').checked=!!data.prep_form_open;
    document.getElementById('inline-battle-open').checked=!!data.battle_form_open;
    document.getElementById('inline-schedule-published').checked=!!data.schedule_published;
    document.getElementById('inline-live').checked=!!data.is_live;
    document.getElementById('event-edit-modal').classList.add('open');
  });
  document.querySelectorAll('[data-close-event-edit]').forEach(x=>x.addEventListener('click',()=>{
    document.getElementById('event-edit-modal').classList.remove('open');
  }));
  document.getElementById('inline-event-form').onsubmit=async(e)=>{
    e.preventDefault();
    const oldAnn=data.announcement_text||null;
    const newAnn=document.getElementById('inline-announcement').value.trim()||null;
    const payload={
      opponent_state:Number(document.getElementById('inline-opponent').value),
      prep_monday:document.getElementById('inline-monday').value,
      description:document.getElementById('inline-notes').value.trim()||null,
      announcement_text:newAnn,
      announcement_version:newAnn===oldAnn?Number(data.announcement_version||0):Number(data.announcement_version||0)+(newAnn?1:0),
      prep_form_open:document.getElementById('inline-prep-open').checked,
      battle_form_open:document.getElementById('inline-battle-open').checked,
      schedule_published:document.getElementById('inline-schedule-published').checked,
      is_live:document.getElementById('inline-live').checked
    };
    const {error}=await sb.from('svs_events').update(payload).eq('id',data.id);
    document.getElementById('inline-event-message').textContent=error?error.message:'Event updated.';
    if(!error) setTimeout(()=>location.reload(),350);
  };
}

loadEvent();
</script>
</body>
</html>
