<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Transfer Workspace</title>
<style>
html,body{margin:0;min-height:100%;background:#03050e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#loader span{display:block;margin-top:7px;color:#9da9c8;font-size:12px}
</style>
</head>
<body>
<div id="loader"><div><b>Loading Transfer Workspace…</b><span>Applying instant selector contrast</span></div></div>
<script>
(async()=>{
 try{
   const source=new URL('/transfer-workspace.html',location.origin);
   source.search=location.search;
   source.searchParams.set('_nexa_base','544c');
   const res=await fetch(source.href,{cache:'no-store'});
   if(!res.ok)throw new Error('Unable to load Transfer Workspace');
   let html=await res.text();

   const contrast=`<style id="nexaTransferSelectorContrastFinal">
/* TRUE neutral state — old purple/cyan gradients cannot bleed through */
.babySeg button[data-v515-route],
.babySeg button[data-route-card],
.babySeg button[data-v515-invite],
.babySeg button[data-invite-toggle],
.orderSeg524 button[data-app-order]{
  background:linear-gradient(180deg,#343a46,#282d37)!important;
  color:#9da6b5!important;
  border:1px solid rgba(255,255,255,.09)!important;
  box-shadow:none!important;
  text-shadow:none!important;
  filter:none!important;
  opacity:1!important;
  font-weight:850!important;
  transform:none!important;
}

/* Unselected ALWAYS gray */
.babySeg button[data-v515-route]:not(.active),
.babySeg button[data-route-card]:not(.active),
.babySeg button[data-v515-invite]:not(.active),
.babySeg button[data-invite-toggle]:not(.active),
.orderSeg524 button[data-app-order]:not(.active){
  background:linear-gradient(180deg,#343a46,#282d37)!important;
  color:#9da6b5!important;
  border-color:rgba(255,255,255,.09)!important;
  box-shadow:none!important;
  text-shadow:none!important;
  filter:none!important;
}

/* Ordinary active = GREEN */
.babySeg button[data-v515-route="ordinary"].active,
.babySeg button[data-route-card="ordinary"].active{
  background:linear-gradient(135deg,#17885f,#48c694)!important;
  color:#fff!important;
  border-color:rgba(126,244,194,.78)!important;
  box-shadow:0 0 0 1px rgba(126,244,194,.20),0 4px 14px rgba(28,153,105,.34)!important;
  transform:translateY(-1px)!important;
}

/* Special active = GOLD */
.babySeg button[data-v515-route="special"].active,
.babySeg button[data-route-card="special"].active{
  background:linear-gradient(135deg,#9f6917,#e6b84e)!important;
  color:#fff!important;
  border-color:rgba(255,215,112,.82)!important;
  box-shadow:0 0 0 1px rgba(255,215,112,.20),0 4px 14px rgba(180,126,26,.34)!important;
  transform:translateY(-1px)!important;
}

/* Pending active = PURPLE/BLUE */
.babySeg button[data-v515-invite="pending"].active,
.babySeg button[data-invite-toggle="pending"].active{
  background:linear-gradient(135deg,#6251d4,#428bd5)!important;
  color:#fff!important;
  border-color:rgba(157,171,255,.78)!important;
  box-shadow:0 0 0 1px rgba(157,171,255,.18),0 4px 14px rgba(75,92,197,.30)!important;
  transform:translateY(-1px)!important;
}

/* Sent active = GREEN */
.babySeg button[data-v515-invite="sent"].active,
.babySeg button[data-invite-toggle="sent"].active{
  background:linear-gradient(135deg,#17885f,#48c694)!important;
  color:#fff!important;
  border-color:rgba(126,244,194,.78)!important;
  box-shadow:0 0 0 1px rgba(126,244,194,.20),0 4px 14px rgba(28,153,105,.34)!important;
  transform:translateY(-1px)!important;
}

/* First Come / Priority — only selected gets color */
.orderSeg524 button[data-app-order].active{
  background:linear-gradient(135deg,#6b50d8,#348ecb)!important;
  color:#fff!important;
  border-color:rgba(150,143,255,.82)!important;
  box-shadow:0 0 0 1px rgba(150,143,255,.18),0 4px 14px rgba(70,86,205,.30)!important;
  transform:translateY(-1px)!important;
}
</style>`;

   const patch='<scr'+'ipt src="/nexa-transfer-live-sync-v3.js?v=3-20261012-2"></scr'+'ipt>';
   const close='</bo'+'dy>';
   const injected=contrast+patch;

   html=html.includes(close)?html.replace(close,injected+close):html+injected;
   document.open();document.write(html);document.close();
 }catch(err){
   document.getElementById('loader').innerHTML='<div><b>Transfer Workspace could not load.</b><span>'+String(err?.message||err)+'</span></div>';
 }
})();
</script>
</body>
</html>
