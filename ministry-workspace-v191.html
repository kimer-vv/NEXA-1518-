<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXA • Ministry Workspace</title>
<style>
html,body{margin:0;min-height:100%;background:#03050e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#nexaMinistryLoader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#nexaMinistryLoader b{font-size:18px}#nexaMinistryLoader span{display:block;margin-top:8px;color:#9da9c8;font-size:13px}
</style>
</head>
<body>
<div id="nexaMinistryLoader"><div><b>Loading Ministry Workspace…</b><span>NEXA is applying the latest Ministry fixes.</span></div></div>
<script>
(async()=>{
  try{
    const source=new URL('/ministry-workspace.html',location.origin);
    source.search=location.search;
    const res=await fetch(source.href,{cache:'no-store'});
    if(!res.ok)throw new Error('Unable to load Ministry Workspace');
    let html=await res.text();

    const patch='<scr'+'ipt src="/ministry-workspace-fixes-v191.js?v=191-20261012"></scr'+'ipt>';
    const close='</bo'+'dy>';
    html=html.includes(close)?html.replace(close,patch+close):html+patch;

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const root=document.getElementById('nexaMinistryLoader');
    if(root)root.innerHTML='<div><b>Ministry Workspace could not load.</b><span>'+String(err?.message||err)+'</span></div>';
  }
})();
</script>
</body>
</html>
