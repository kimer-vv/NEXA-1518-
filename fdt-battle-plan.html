async function downloadPdf(){
 const btn=document.getElementById('publicDownloadPdf');btn.disabled=true;btn.textContent='Preparing PDF…';
 try{
  const source=root.querySelector('.fdt-bp-doc');if(!source)throw new Error('Battle Plan not loaded.');
  await readyImages(source);
  const blob=await fdtNativePlanPdf(source,plan?.title||'FDT Battle Plan');
  const filename=String(plan?.title||'FDT_Battle_Plan').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'FDT_Battle_Plan';
  const name=filename+'.pdf';
  const file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:plan?.title||'FDT Battle Plan'});
  else {const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
 }catch(error){if(error?.name!=='AbortError')failPdf(error?.message||'Could not export PDF.')}finally{btn.disabled=false;btn.textContent='Download PDF'}
}
function failPdf(message){const e=document.createElement('div');e.className='public-loader';e.textContent=message;root.prepend(e)}
document.getElementById('publicDownloadPdf').addEventListener('click',downloadPdf);
load();
})();
