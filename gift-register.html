<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>NEXA · Gift Code Registration</title>
<style>
:root{color-scheme:dark;--ice:#8eeeff;--text:#f7fbff;--muted:#b8c9dc;--line:#ffffff2a}*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;background:radial-gradient(circle at 50% 15%,#24466f99,transparent 32%),linear-gradient(#071326,#07101d 56%,#0a1420);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.scene{min-height:100svh;display:grid;place-items:center;padding:28px 16px;position:relative;isolation:isolate}.scene:before,.scene:after{content:"";position:fixed;z-index:-2;inset:auto -10% 0;height:44vh;background:linear-gradient(145deg,transparent 42%,#0c2133 43% 55%,transparent 56%) 0 0/180px 220px repeat-x;opacity:.8}.scene:after{transform:scaleX(-1);opacity:.55;bottom:-7vh}.snow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-5vh;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}.card{width:min(520px,100%);padding:clamp(24px,6vw,42px);border:1px solid #b8e9ff42;border-radius:28px;background:linear-gradient(150deg,#122a43d9,#081421e8);box-shadow:0 24px 90px #0009,inset 0 1px #fff2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center}.kicker{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--ice)}h1{font-size:clamp(26px,7vw,38px);line-height:1.06;margin:10px 0 8px}.sub{color:var(--muted);line-height:1.55;margin:0 auto 20px}.context{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid #8eeeff4d;border-radius:999px;background:#0b2034;color:#dffaff;font-weight:800;font-size:13px;margin-bottom:22px}.form{display:grid;gap:14px;text-align:left}.form label{display:grid;gap:7px;font-size:13px;font-weight:800}.form input{width:100%;min-height:50px;border-radius:14px;border:1px solid #7b9bb94d;background:#06111f;color:white;padding:12px 14px;font:inherit;font-size:16px;outline:none}.form input:focus{border-color:#7fe8ff;box-shadow:0 0 0 3px #5ee4ff1c}.cta{min-height:52px;border:1px solid #8cecff80;border-radius:15px;background:linear-gradient(120deg,#5547bb,#168ba7);color:white;font:inherit;font-weight:900;font-size:15px;margin-top:4px}.cta:disabled{opacity:.6}.status{min-height:20px;text-align:center;color:#ffc6cf;font-size:13px;line-height:1.4}.gift-stage{display:none;min-height:310px;place-items:center;position:relative}.gift-stage.show{display:grid}.gift{width:128px;height:105px;position:relative;margin:38px auto 18px;background:linear-gradient(90deg,#9b2339 0 41%,#f3c65c 42% 58%,#a72b42 59%);border-radius:9px;box-shadow:0 15px 35px #0007}.gift:before{content:"";position:absolute;left:-8px;right:-8px;top:-24px;height:30px;border-radius:8px;background:linear-gradient(90deg,#b72d47 0 41%,#ffd66b 42% 58%,#c1324c 59%);transform-origin:20% 100%}.gift:after{content:"✦";position:absolute;font-size:34px;color:#fff4b8;left:48px;top:-60px;opacity:0}.gift.open:before{animation:lid .65s cubic-bezier(.2,.8,.2,1) forwards}.gift.open{animation:shake .45s ease}.gift.open:after{animation:spark .8s .3s ease forwards}.success h2{font-size:28px;margin:6px 0;color:#fff}.success p{color:var(--muted);line-height:1.5;margin:6px 0}.confetti{position:fixed;inset:0;pointer-events:none}.confetti i{position:absolute;left:50%;top:48%;width:7px;height:12px;border-radius:2px;background:hsl(var(--h) 85% 65%);animation:burst 1.1s ease-out forwards;transform:translate(-50%,-50%) rotate(var(--r))}.hidden{display:none!important}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(240deg)}}@keyframes shake{20%,60%{transform:rotate(-4deg)}40%,80%{transform:rotate(4deg)}}@keyframes lid{to{transform:translate(-18px,-50px) rotate(-18deg)}}@keyframes spark{50%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:translateY(-35px) scale(2)}}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) + 360deg));opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flake{display:none}.gift.open:before{transform:translate(-18px,-35px) rotate(-12deg)}}
</style></head><body><div class="scene"><div class="snow" id="snow"></div><main class="card"><section id="loading"><div class="kicker">NEXA · GIFT CODES</div><h1>Member Registration</h1><p class="sub">Validating your alliance invitation…</p></section><section id="register" class="hidden"><div class="kicker">🎁 NEXA GIFT CODE REGISTRATION</div><h1>Register for Gift Codes</h1><p class="sub">Register your account to receive Alliance Gift Codes.</p><div class="context" id="context"></div><p class="sub" style="margin-top:-10px">You’ve been invited by your alliance.</p><form class="form" id="form"><label>Game ID<input id="gameId" inputmode="numeric" pattern="[0-9]*" maxlength="30" autocomplete="off" required></label><label>In-Game Name (IGN)<input id="gameName" maxlength="80" autocomplete="nickname" required></label><button class="cta" id="submit" type="submit">🎁 REGISTER FOR GIFT CODES</button><div class="status" id="status"></div></form></section><section id="result" class="gift-stage"><div><div class="gift" id="gift"></div><div class="success"><div class="kicker" id="resultKicker">REGISTRATION COMPLETE</div><h2 id="resultTitle">🎉 YOU’RE REGISTERED!</h2><p id="resultName"></p><p id="resultContext"></p><p>You can close this page.</p></div></div></section></main><div class="confetti" id="confetti"></div></div>
<script>
const $=id=>document.getElementById(id),invite=new URLSearchParams(location.search).get('invite')||'';let info=null;
for(let i=0;i<34;i++){const f=document.createElement('i');f.className='flake';const s=2+Math.random()*5;Object.assign(f.style,{left:Math.random()*100+'%',width:s+'px',height:s+'px',animationDuration:6+Math.random()*9+'s',animationDelay:-Math.random()*12+'s','--drift':(-60+Math.random()*120)+'px'});$('snow').append(f)}
async function call(action,opts={}){const u='/api/nexa-system-settings?mode=gift&action='+encodeURIComponent(action)+(opts.query||'');const r=await fetch(u,{method:opts.body?'POST':'GET',headers:opts.body?{'Content-Type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed.');return d}
function showError(msg){$('loading').innerHTML='<div class="kicker">NEXA · GIFT CODES</div><h1>Invitation unavailable</h1><p class="sub">'+String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>'}
async function init(){try{if(!/^[A-Za-z0-9_-]{32,160}$/.test(invite))throw Error('This registration link is invalid or has expired.');const d=await call('registration_invite',{query:'&invite='+encodeURIComponent(invite)});info=d.invite;$('context').textContent=`STATE ${info.state_number} · ${info.tag}`;$('loading').classList.add('hidden');$('register').classList.remove('hidden')}catch(e){showError(e.message)}}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<34;i++){const p=document.createElement('i');p.style.setProperty('--h',Math.floor(Math.random()*360));p.style.setProperty('--r',Math.floor(Math.random()*180)+'deg');p.style.setProperty('--x',(-170+Math.random()*340)+'px');p.style.setProperty('--y',(-190+Math.random()*330)+'px');$('confetti').append(p);setTimeout(()=>p.remove(),1300)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Registering…';$('status').textContent='';try{const d=await call('public_register',{body:{action:'public_register',invite,game_id:$('gameId').value.trim(),game_name:$('gameName').value.trim()}});$('register').classList.add('hidden');$('result').classList.add('show');if(d.status==='already_registered'){$('resultKicker').textContent='GIFT CODE REGISTRATION';$('resultTitle').textContent='🎁 YOU’RE ALREADY REGISTERED!';$('resultName').textContent=(d.member?.game_name||$('gameName').value.trim())+' is already registered.'}else{$('resultName').textContent='Welcome, '+(d.member?.game_name||$('gameName').value.trim())+'!'}$('resultContext').textContent=`You’re registered with ${info.tag} · State ${info.state_number} for Gift Codes.`;requestAnimationFrame(()=>{$('gift').classList.add('open');celebrate()})}catch(err){$('status').textContent=err.message;b.disabled=false;b.textContent='🎁 REGISTER FOR GIFT CODES'}});init();
</script></body></html>
