g.onclick=()=>{const d=document.createElement('dialog');d.innerHTML='<div style="width:min(480px,calc(100vw - 32px));padding:20px;border-radius:22px;background:#080d24;color:#f4f2ff;border:1px solid #ff4fd8"><b style="color:#ff4fd8;letter-spacing:.14em;font-size:10px">GUIDE</b><h2 style="margin:6px 0 8px">Library</h2><p style="font-size:13px;line-height:1.5;color:#c5c6d8">Library is the verified NEXA master catalog. Use the category and generation rails to review Heroes, Experts, Pets, Troops, Chief Gear and Charms. Generation visibility controls what players can see in Player Intelligence.</p><button style="width:100%;padding:10px;border-radius:999px;border:1px solid #ff4fd8;background:#11152f;color:white;font-weight:900">Close</button></div>';d.style.cssText='border:0;padding:0;background:transparent';document.body.appendChild(d);d.querySelector('button').onclick=()=>{d.close();d.remove()};d.showModal()};document.body.appendChild(g)})();

<body><div class="nebula-bg"></div><div class="starfield"></div>
<main class="lib-shell">
 <div id="admin-nav"></div>
 <a class="back" href="index.html">← Home</a>
 <header class="lib-head"><div><div class="lib-kicker">ADMINISTRATION · LIBRARY</div><h1>Library</h1><div class="lib-muted">Verified master catalog. Choose what players can see.</div></div><div id="status" class="status">Connecting…</div></header>
 <nav id="tabs" class="lib-tabs"></nav><div id="generations" class="gen-row"></div><div id="generation-manager"></div>
 <div class="lib-toolbar"><input id="search" type="search" placeholder="Search library"></div>
 <section id="grid" class="lib-grid"><div class="empty">Loading Library…</div></section>
</main>
<dialog id="mode-dialog" class="mode-dialog"><form method="dialog" class="mode-card"><h2 id="mode-title">Generation status</h2><div id="mode-copy"></div><div id="mode-fields" class="mode-fields"></div><div class="mode-actions"><button value="cancel">Cancel</button><button id="mode-confirm" class="confirm" value="default" type="button">Confirm Change</button></div></form></dialog>
<script>
const sb=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');
const V26_GEAR={
 'helmet':'/nexa-gear-helmet.webp',
 'watch':'/nexa-gear-watch.webp',
 'coat':'/nexa-gear-coat.webp',
 'pants':'/nexa-gear-pants.webp',
 'belt':'/nexa-gear-belt.webp',
 'shortstaff':'/nexa-gear-shortstaff.webp',
 'short staff':'/nexa-gear-shortstaff.webp'
};
const types=[['hero','Heroes'],['expert','Experts'],['pet','Pets'],['troop','Troops'],['chief_gear','Chief Gear'],['chief_charm','Charms']];
let active='hero',generation=null,items=[],isAdmin=false,generations=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function adminNav(){if(new URLSearchParams(location.search).get('admin')!=='1')return;document.getElementById('admin-nav').innerHTML='<nav class="admin-nav"><a href="index.html?admin=administration&tab=alliances">‹ A</a><b>Library</b><a class="next" href="index.html?admin=administration&tab=permissions">N ›</a></nav>'}
async function boot(){adminNav();const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}const role=await sb.rpc('current_nexa_role');isAdmin=['owner','admin'].includes(String(role.data||'').toLowerCase());await sb.rpc('nexa_unlock_scheduled_library_generations');document.getElementById('status').textContent=isAdmin?'ADMIN CATALOG':'PLAYER CATALOG';renderTabs();await load()}
function renderTabs(){const box=document.getElementById('tabs');box.innerHTML=types.map(([k,n])=>`<button data-type="${k}" class="${active===k?'active':''}">${n}</button>`).join('');requestAnimationFrame(()=>box.querySelector('.active')?.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'}))}
async function load(){let q=sb.from('nexa_library_items').select('*').eq('item_type',active).eq('is_active',true).order('sort_order').order('name');if(!isAdmin)q=q.eq('is_visible',true);if(generation!==null)q=q.eq('generation',generation);const {data,error}=await q;items=data||[];if(error){document.getElementById('grid').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}await loadGenerations();render();renderGenerationManager()}
async function loadGenerations(){const box=document.getElementById('generations');const oldScroll=box.scrollLeft;if(!['hero','expert','pet'].includes(active)){box.innerHTML='';generations=[];return}let q=sb.from('nexa_library_generations').select('*').eq('item_type',active).order('generation');if(!isAdmin)q=q.eq('is_visible',true);const {data,error}=await q;if(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}generations=data||[];box.innerHTML=`<button data-gen="all" class="${generation===null?'active':''}">All</button>`+generations.map(g=>`<button data-gen="${g.generation}" class="${generation===g.generation?'active':''}">Gen ${g.generation}${isAdmin?' • '+generationStatus(g):''}</button>`).join('');requestAnimationFrame(()=>{const selected=box.querySelector('.active');if(selected&&generation!==null)selected.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'});else box.scrollLeft=oldScroll})}
function generationStatus(g){if(g.unlock_at&&new Date(g.unlock_at)>new Date())return'Scheduled';return g.is_visible?'Unlocked':'Hidden'}
function renderGenerationManager(){const box=document.getElementById('generation-manager');const g=generations.find(x=>Number(x.generation)===Number(generation));if(!isAdmin||!['hero','expert','pet'].includes(active)||!g){box.innerHTML='';return}const status=generationStatus(g),countdown=status==='Scheduled'?`<div class="generation-countdown" data-countdown="${esc(g.unlock_at)}"></div>`:'';box.innerHTML=`<section class="generation-manager"><div class="generation-manager-head"><div><b>${active.toUpperCase()} · GEN ${g.generation} VISIBILITY</b><div class="lib-muted">Controls the entire generation.</div></div><button class="info-button" type="button" data-mode-info>ⓘ</button></div><select data-generation-mode><option ${status==='Hidden'?'selected':''}>Hidden</option><option ${status==='Scheduled'?'selected':''}>Scheduled</option><option ${status==='Unlocked'?'selected':''}>Unlocked</option></select>${countdown}</section>`;tickCountdown()}
function tickCountdown(){document.querySelectorAll('[data-countdown]').forEach(el=>{const ms=new Date(el.dataset.countdown)-new Date();if(ms<=0){el.textContent='UNLOCKING NOW…';return}const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);el.textContent=`UNLOCKS IN ${d}D ${h}H ${m}M`})}
function openModeDialog(mode,infoOnly=false){const g=generations.find(x=>Number(x.generation)===Number(generation));if(!g)return;const dialog=document.getElementById('mode-dialog');document.getElementById('mode-title').textContent=`GEN ${g.generation} • ${mode}`;const copy={Hidden:'The generation stays loaded in NEXA, but players cannot view or select it.',Scheduled:'The generation stays hidden until its scheduled UTC date, then unlocks automatically.',Unlocked:'The generation becomes visible to every player immediately.'};document.getElementById('mode-copy').innerHTML=`<p>${copy[mode]}</p><p><b>${infoOnly?'Review only. No changes will be made.':'Confirm this visibility change before it is saved.'}</b></p>`;document.getElementById('mode-fields').innerHTML=mode==='Scheduled'&&!infoOnly?`<label>Unlock in days<input data-unlock-days type="number" min="1" step="1" value="25"></label><label>Or exact UTC date and time<input data-unlock-date type="datetime-local"></label>`:'';document.getElementById('mode-confirm').hidden=infoOnly;dialog.dataset.mode=mode;dialog.showModal()}
function troopSrc(type,tier=12){return window.NEXA_TROOP_PORTRAITS?.[String(type||'').toLowerCase()]?.['t'+tier]||''}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),rows=items.filter(x=>!term||x.name.toLowerCase().includes(term));document.getElementById('grid').innerHTML=rows.length?rows.map(x=>{const cls=x.item_type==='troop'?'troop':x.item_type==='chief_gear'?'gear':'';const fallback='https://ui-avatars.com/api/?name='+encodeURIComponent(x.name)+'&background=111a38&color=cabaff&bold=true';const key=String(x.name||'').trim().toLowerCase();const type=String(x.troop_type||x.name||'').trim().toLowerCase();const src=x.item_type==='chief_gear'?(V26_GEAR[key]||x.image_url||fallback):x.item_type==='troop'?(troopSrc(type,12)||fallback):(x.image_url||fallback);const tiers=x.item_type==='troop'?`<div class="troop-tiers" data-troop-type="${esc(type)}">${Array.from({length:12},(_,i)=>`<button class="troop-tier ${i===11?'active':''}" type="button" data-tier="${i+1}">T${i+1}</button>`).join('')}</div>`:'';return`<article class="lib-card"><span class="lib-img-wrap"><img class="lib-img ${cls}" data-lib-troop-img="${esc(type)}" src="${esc(src)}" alt="${esc(x.name)}"></span><div><div class="lib-name">${esc(x.name)}</div><div class="lib-meta">${esc([x.generation!=null?'Gen '+x.generation:'',x.troop_type,x.rarity].filter(Boolean).join(' • '))}</div></div>${tiers}</article>`}).join(''):`<div class="empty">No ${types.find(x=>x[0]===active)[1]} found.</div>`}

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;active=b.dataset.type;generation=null;renderTabs();load()});
document.getElementById('generations').addEventListener('click',e=>{const b=e.target.closest('[data-gen]');if(!b)return;generation=b.dataset.gen==='all'?null:Number(b.dataset.gen);load()});
document.getElementById('search').addEventListener('input',render);
document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('[data-tier]');if(!b)return;const row=b.closest('[data-troop-type]'),card=b.closest('.lib-card'),type=row?.dataset.troopType,tier=Number(b.dataset.tier);const img=card?.querySelector('[data-lib-troop-img]'),src=troopSrc(type,tier);if(img&&src)img.src=src;row?.querySelectorAll('.troop-tier').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('generation-manager').addEventListener('change',e=>{if(e.target.matches('[data-generation-mode]'))openModeDialog(e.target.value)});
document.getElementById('generation-manager').addEventListener('click',e=>{if(e.target.closest('[data-mode-info]')){const g=generations.find(x=>Number(x.generation)===Number(generation));openModeDialog(generationStatus(g),true)}});
document.getElementById('mode-confirm').addEventListener('click',async()=>{const dialog=document.getElementById('mode-dialog'),mode=dialog.dataset.mode,g=generations.find(x=>Number(x.generation)===Number(generation));if(!g)return;let unlockAt=null,visible=mode==='Unlocked';if(mode==='Scheduled'){const exact=document.querySelector('[data-unlock-date]')?.value,days=Number(document.querySelector('[data-unlock-days]')?.value||0);unlockAt=exact?new Date(exact).toISOString():new Date(Date.now()+days*86400000).toISOString();visible=false}const {error}=await sb.from('nexa_library_generations').update({is_visible:visible,unlock_at:unlockAt,updated_at:new Date().toISOString()}).eq('id',g.id);if(error){document.getElementById('status').textContent=error.message;return}await sb.from('nexa_library_items').update({is_visible:visible,updated_at:new Date().toISOString()}).eq('item_type',active).eq('generation',g.generation);dialog.close();await load()});
setInterval(tickCountdown,60000);boot();
</script></body></html>
