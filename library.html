<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA • Library</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{min-height:100vh;background:#02030b;color:#f7f5ff}.lib-shell{max-width:1050px;margin:auto;padding:24px 16px 90px}.lib-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.lib-kicker{color:#b895ff;letter-spacing:.22em;font-weight:900;font-size:.75rem}.lib-head h1{margin:5px 0;font-size:clamp(2rem,8vw,3.5rem)}.lib-muted{color:#979bb8}.lib-tabs,.gen-row{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.lib-tabs button,.gen-row button{white-space:nowrap;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:#11152b;color:#eee;padding:10px 14px;font-weight:800}.lib-tabs button.active,.gen-row button.active{background:linear-gradient(135deg,#6e40ff,#1fa7ff);border-color:transparent}.lib-toolbar{margin:12px 0}.lib-toolbar input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:#0b1022;color:#fff;padding:13px}.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.lib-card{border:1px solid rgba(130,102,255,.3);border-radius:20px;padding:14px;background:linear-gradient(145deg,rgba(20,24,55,.94),rgba(4,7,20,.96));display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}.lib-img-wrap{position:relative;width:72px;height:72px;border-radius:50%;overflow:visible;background:#111936;border:2px solid #7658ff;box-sizing:border-box;display:grid;place-items:center;box-shadow:0 0 20px rgba(118,88,255,.28),0 0 34px rgba(48,192,255,.09)}.lib-img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block;border-radius:50%;overflow:hidden}.lib-img.troop{object-fit:contain;object-position:center;transform:none;padding:3%;box-sizing:border-box}.lib-img.gear{object-fit:contain;object-position:center;transform:none;padding:1%;box-sizing:border-box}.lib-name{font-size:1.05rem;font-weight:900}.lib-meta{color:#9ba5cc;font-size:.82rem;margin-top:4px}.empty{padding:34px 18px;text-align:center;border:1px dashed rgba(255,255,255,.17);border-radius:18px;color:#9ba1be;grid-column:1/-1}.status{font-size:.8rem;color:#70dcff}.back{color:#64bdff;text-decoration:none;font-weight:800}.admin-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 0 16px}.admin-nav a{color:#fff;text-decoration:none;border:1px solid rgba(139,92,246,.5);border-radius:999px;padding:8px 11px;background:#0d122b;font-weight:900}.admin-nav .next{justify-self:end}.admin-nav b{text-align:center}.generation-manager{display:grid;gap:10px;margin:4px 0 12px;padding:14px;border:1px solid rgba(124,87,255,.3);border-radius:18px;background:rgba(8,12,31,.75)}.generation-manager-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.generation-manager select{min-width:145px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#10152d;color:#fff;padding:10px;font-weight:850}.generation-countdown{color:#65dcff;font-size:.8rem;font-weight:850}.info-button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(101,220,255,.45);background:#0b1731;color:#76e5ff;font-weight:950}.mode-dialog{border:0;padding:0;background:transparent;color:#fff}.mode-dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(6px)}.mode-card{position:relative;width:min(520px,calc(100vw - 32px));max-height:85dvh;overflow:auto;border:1px solid rgba(131,87,255,.65);border-radius:24px;padding:20px;background:radial-gradient(circle at 15% 0%,rgba(192,63,255,.12),transparent 32%),linear-gradient(155deg,#10152f,#050818);box-shadow:0 28px 80px rgba(0,0,0,.58),0 0 34px rgba(96,74,255,.18)}.mode-fields{display:grid;gap:9px;margin:14px 0}.mode-fields input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#0b1024;color:#fff;padding:12px}.mode-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.mode-actions button{border:1px solid rgba(255,255,255,.16);border-radius:12px;background:#12172f;color:#fff;padding:10px 14px;font-weight:850}.mode-actions .confirm{background:linear-gradient(135deg,#7044ff,#159fe8)}
@media(max-width:600px){.lib-head{display:block}.lib-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="nebula-bg"></div><div class="starfield"></div>
<main class="lib-shell">
 <div id="admin-nav"></div>
 <a class="back" href="index.html">← Home</a>
 <header class="lib-head"><div><div class="lib-kicker">NEXA INTELLIGENCE</div><h1>Library</h1><div class="lib-muted">Verified master catalog. Choose only what players can see.</div></div><div id="status" class="status">Connecting…</div></header>
 <nav id="tabs" class="lib-tabs"></nav><div id="generations" class="gen-row"></div><div id="generation-manager"></div>
 <div class="lib-toolbar"><input id="search" type="search" placeholder="Search library"></div>
 <section id="grid" class="lib-grid"><div class="empty">Loading Library…</div></section>
</main>
<dialog id="mode-dialog" class="mode-dialog"><form method="dialog" class="mode-card"><h2 id="mode-title">Generation status</h2><div id="mode-copy"></div><div id="mode-fields" class="mode-fields"></div><div class="mode-actions"><button value="cancel">Cancel</button><button id="mode-confirm" class="confirm" value="default" type="button">Confirm Change</button></div></form></dialog>
<script>
const sb=window.supabase.createClient('https://dfxcxboxrkfmrnsgpyin.supabase.co','sb_publishable_HTd6T3L8WuN_owZwPUjE1Q_glB9YWM-');
const V25_GEAR={
 'helmet':'/assets/nexa-v25/chief-gear/helmet.webp',
 'watch':'/assets/nexa-v25/chief-gear/watch.webp',
 'coat':'/assets/nexa-v25/chief-gear/coat.webp',
 'pants':'/assets/nexa-v25/chief-gear/pants.webp',
 'belt':'/assets/nexa-v25/chief-gear/belt.webp',
 'shortstaff':'/assets/nexa-v25/chief-gear/shortstaff.webp',
 'short staff':'/assets/nexa-v25/chief-gear/shortstaff.webp'
};
const types=[['hero','Heroes'],['expert','Experts'],['pet','Pets'],['troop','Troops'],['chief_gear','Chief Gear'],['chief_charm','Charms']];
let active='hero',generation=null,items=[],isAdmin=false,generations=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function adminNav(){if(new URLSearchParams(location.search).get('admin')!=='1')return;document.getElementById('admin-nav').innerHTML='<nav class="admin-nav"><a href="index.html?admin=administration&tab=alliances">‹ A</a><b>Library</b><a class="next" href="index.html?admin=administration&tab=permissions">N ›</a></nav>'}
async function boot(){adminNav();const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}const role=await sb.rpc('current_nexa_role');isAdmin=['owner','admin'].includes(String(role.data||'').toLowerCase());await sb.rpc('nexa_unlock_scheduled_library_generations');document.getElementById('status').textContent=isAdmin?'ADMIN CATALOG':'PLAYER CATALOG';renderTabs();await load()}
function renderTabs(){document.getElementById('tabs').innerHTML=types.map(([k,n])=>`<button data-type="${k}" class="${active===k?'active':''}">${n}</button>`).join('')}
async function load(){let q=sb.from('nexa_library_items').select('*').eq('item_type',active).eq('is_active',true).order('sort_order').order('name');if(!isAdmin)q=q.eq('is_visible',true);if(generation!==null)q=q.eq('generation',generation);const {data,error}=await q;items=data||[];if(error){document.getElementById('grid').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}await loadGenerations();render();renderGenerationManager()}
async function loadGenerations(){const box=document.getElementById('generations');if(!['hero','expert','pet'].includes(active)){box.innerHTML='';generations=[];return}let q=sb.from('nexa_library_generations').select('*').eq('item_type',active).order('generation');if(!isAdmin)q=q.eq('is_visible',true);const {data,error}=await q;if(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}generations=data||[];box.innerHTML=`<button data-gen="all" class="${generation===null?'active':''}">All</button>`+generations.map(g=>`<button data-gen="${g.generation}" class="${generation===g.generation?'active':''}">Gen ${g.generation}${isAdmin?' • '+generationStatus(g):''}</button>`).join('')}
function generationStatus(g){if(g.unlock_at&&new Date(g.unlock_at)>new Date())return'Scheduled';return g.is_visible?'Unlocked':'Hidden'}
function renderGenerationManager(){const box=document.getElementById('generation-manager');const g=generations.find(x=>Number(x.generation)===Number(generation));if(!isAdmin||!['hero','expert','pet'].includes(active)||!g){box.innerHTML='';return}const status=generationStatus(g),countdown=status==='Scheduled'?`<div class="generation-countdown" data-countdown="${esc(g.unlock_at)}"></div>`:'';box.innerHTML=`<section class="generation-manager"><div class="generation-manager-head"><div><b>${active.toUpperCase()} · GEN ${g.generation} VISIBILITY</b><div class="lib-muted">Controls the entire generation.</div></div><button class="info-button" type="button" data-mode-info>ⓘ</button></div><select data-generation-mode><option ${status==='Hidden'?'selected':''}>Hidden</option><option ${status==='Scheduled'?'selected':''}>Scheduled</option><option ${status==='Unlocked'?'selected':''}>Unlocked</option></select>${countdown}</section>`;tickCountdown()}
function tickCountdown(){document.querySelectorAll('[data-countdown]').forEach(el=>{const ms=new Date(el.dataset.countdown)-new Date();if(ms<=0){el.textContent='UNLOCKING NOW…';return}const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);el.textContent=`UNLOCKS IN ${d}D ${h}H ${m}M`})}
function openModeDialog(mode,infoOnly=false){const g=generations.find(x=>Number(x.generation)===Number(generation));if(!g)return;const dialog=document.getElementById('mode-dialog');document.getElementById('mode-title').textContent=`GEN ${g.generation} • ${mode}`;const copy={Hidden:'The generation stays loaded in NEXA, but players cannot view or select it.',Scheduled:'The generation stays hidden until its scheduled UTC date, then unlocks automatically.',Unlocked:'The generation becomes visible to every player immediately.'};document.getElementById('mode-copy').innerHTML=`<p>${copy[mode]}</p><p><b>${infoOnly?'Review only. No changes will be made.':'Confirm this visibility change before it is saved.'}</b></p>`;document.getElementById('mode-fields').innerHTML=mode==='Scheduled'&&!infoOnly?`<label>Unlock in days<input data-unlock-days type="number" min="1" step="1" value="25"></label><label>Or exact UTC date and time<input data-unlock-date type="datetime-local"></label>`:'';document.getElementById('mode-confirm').hidden=infoOnly;dialog.dataset.mode=mode;dialog.showModal()}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),rows=items.filter(x=>!term||x.name.toLowerCase().includes(term));document.getElementById('grid').innerHTML=rows.length?rows.map(x=>{const cls=x.item_type==='troop'?'troop':x.item_type==='chief_gear'?'gear':'';const fallback='https://ui-avatars.com/api/?name='+encodeURIComponent(x.name)+'&background=111a38&color=cabaff&bold=true';const key=String(x.name||'').trim().toLowerCase();const src=x.item_type==='chief_gear'?(V25_GEAR[key]||x.image_url||fallback):(x.image_url||fallback);return`<article class="lib-card"><span class="lib-img-wrap"><img class="lib-img ${cls}" src="${esc(src)}" alt="${esc(x.name)}"></span><div><div class="lib-name">${esc(x.name)}</div><div class="lib-meta">${esc([x.generation!=null?'Gen '+x.generation:'',x.troop_type,x.rarity].filter(Boolean).join(' • '))}</div></div></article>`}).join(''):`<div class="empty">No ${types.find(x=>x[0]===active)[1]} found.</div>`}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;active=b.dataset.type;generation=null;renderTabs();load()});
document.getElementById('generations').addEventListener('click',e=>{const b=e.target.closest('[data-gen]');if(!b)return;generation=b.dataset.gen==='all'?null:Number(b.dataset.gen);load()});
document.getElementById('search').addEventListener('input',render);
document.getElementById('generation-manager').addEventListener('change',e=>{if(e.target.matches('[data-generation-mode]'))openModeDialog(e.target.value)});
document.getElementById('generation-manager').addEventListener('click',e=>{if(e.target.closest('[data-mode-info]')){const g=generations.find(x=>Number(x.generation)===Number(generation));openModeDialog(generationStatus(g),true)}});
document.getElementById('mode-confirm').addEventListener('click',async()=>{const dialog=document.getElementById('mode-dialog'),mode=dialog.dataset.mode,g=generations.find(x=>Number(x.generation)===Number(generation));if(!g)return;let unlockAt=null,visible=mode==='Unlocked';if(mode==='Scheduled'){const exact=document.querySelector('[data-unlock-date]')?.value,days=Number(document.querySelector('[data-unlock-days]')?.value||0);unlockAt=exact?new Date(exact).toISOString():new Date(Date.now()+days*86400000).toISOString();visible=false}const {error}=await sb.from('nexa_library_generations').update({is_visible:visible,unlock_at:unlockAt,updated_at:new Date().toISOString()}).eq('id',g.id);if(error){alert(error.message);return}await sb.from('nexa_library_items').update({is_visible:visible,updated_at:new Date().toISOString()}).eq('item_type',active).eq('generation',g.generation);dialog.close();await load()});
setInterval(tickCountdown,60000);boot();
</script></body></html>
